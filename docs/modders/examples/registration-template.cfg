// A registration with ReDefinition, to start from. Put it anywhere in your mod's
// folder under GameData, rename it, and delete what your mod does not need: only
// name, detect, and each setting's name and member are needed.
// What every key does:
// https://github.com/CaptainKeyboard/ReDefinition/blob/main/docs/modders/registration-reference.md
//
// Every note below stands beside its value, because a value here holds no // and no brace.

MOD_SETTINGS
{
	name = mymod                                  // your mod's id: lower-case letters, digits and _. Never change it
	title = My Mod
	detect = MyMod.Settings                       // a type that is loaded only with your mod
	needs = MyMod.Settings.Instance               // what your settings cannot be trusted without
	version = 1.0.0.0                             // the version the defaults were read from
	save = MyMod.Settings.Instance.Save           // a method without parameters that saves your settings
	ready = MyMod.Settings.Instance               // holds nothing, or False, until your settings are loaded
	saving = InModFiles                           // or PerSave, or AtEveryStart
	window = MyMod.SettingsWindow.DrawWindow      // the method that draws your IMGUI settings window
	button = MyMod                                // the assembly your toolbar button's handler lives in: hidden while bundled
	tab = Effects                                 // where the Advanced button for your window goes
	behaviour = MyMod.SettingsBridge              // a type of yours that answers for the settings without a member

	// Where builds differ, told apart by a member one of them has.
	BUILD
	{
		name = large
		has = MyMod.Settings.Instance.largeEffects
	}

	SETTING
	{
		name = effectQuality                      // the second part of the setting's key. Never change it
		member = MyMod.Settings.Instance.effectQuality
		title = Effect quality
		tooltip = What it does, in a line.\nA second line.
		default = 2
		kind = Quality                            // Quality: the profiles set it; Taste or Other: they do not
		row = Effects                             // a row on that tab; without it, no row
		order = 95                                // where among that tab's rows
		takesEffect = Live                        // or NextScene, or Restart
		min = 0
		max = 3
		whole = True
		after = MyMod.Settings.Instance.Apply     // called once at the end of the frame after a change
		required = True                           // without this member the whole mod is left out
	}
	SETTING
	{
		name = shadows
		member = MyMod.Settings.Instance.shadows
		title = Shadows
		default = High
		kind = Quality
		choices = Low, Medium, High
		labels = Low, Medium, High\, sharp       // a comma inside a label is written \,
		optional = only newer builds have it      // without this member only this setting goes
	}
	SETTING
	{
		name = disableGlow
		member = MyMod.Settings.Instance.disableGlow
		title = Glow
		default = True
		kind = Taste
		invert = True                             // stored the other way round: the row shows it the right way
	}
	SETTING
	{
		name = temporalAntialiasing
		member = MyMod.Settings.Instance.temporalAntialiasing
		default = True                            // no row: kept, reset, and set by ALL_PROFILES below
	}
	SETTING
	{
		name = debugOverlay
		leftOut = it is for finding faults only    // named, and never bundled
	}

	// Values for one build over the settings' own defaults.
	DEFAULTS
	{
		build = large
		effectQuality = 3
	}

	// What a graphics profile sets for your mod: quality settings only.
	PROFILE
	{
		name = low                                // low, medium, high, ultra, max, or a profile a visual pack adds
		effectQuality = 1
		shadows = Low
	}
	PROFILE
	{
		name = low
		build = large                             // for one build only
		effectQuality = 0
	}

	// What every graphics profile sets, whatever the kind: what your mod needs to run with the upscaler.
	ALL_PROFILES
	{
		temporalAntialiasing = False
	}

	// What your mod needs of another setting while it is loaded.
	REQUIRES
	{
		setting = ksp.SHADOWS_QUALITY
		atLeast = 2
		reason = My Mod's effects need KSP's shadows at medium quality or above.
	}
}
