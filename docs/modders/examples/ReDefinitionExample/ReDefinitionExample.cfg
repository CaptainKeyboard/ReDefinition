// ReDefinitionExample's registration: one key binding, kept by ReDefinition.
//
// Without ReDefinition the game reads this file and does nothing with it. With it,
// the binding stands in the settings window's Keys tab, and the mod asks
// ReDefinition.Api.Keys whether it is pressed (ExampleAddon.CutPressed).
//
// The format: docs/modders/registering-a-mod.md in ReDefinition's repository.

MOD_SETTINGS
{
	name = redefinitionexample
	title = ReDefinition example
	detect = ReDefinitionExample.ExampleAddon

	KEY
	{
		name = cameraCut
		title = Camera back to its start distance
		tooltip = Puts the flight camera back to its start distance and tells ReDefinition about the cut.
		takesEffect = Live
		default = None
	}
}
