// ReDefinitionExample's registration: two settings and one key binding, kept by
// ReDefinition.
//
// Without ReDefinition the game reads this file and does nothing with it. With it,
// the binding stands in the settings window's Keys tab, and the mod asks
// ReDefinition.Api.Keys whether it is pressed (ExampleAddon.CutPressed).
//
// The settings have no member: `behaviour` names this mod's own type, which reads,
// writes and saves them (SettingsBridge.cs).
//
// The format: docs/modders/registering-a-mod.md in ReDefinition's repository.

MOD_SETTINGS
{
	name = redefinitionexample
	title = ReDefinition example
	detect = ReDefinitionExample.ExampleAddon
	behaviour = ReDefinitionExample.SettingsBridge
	version = 1.0.0
	saving = InModFiles

	SETTING
	{
		name = edgeDarkening
		title = Edge darkening
		tooltip = How far the example's compute pass darkens the image towards its edges.
		takesEffect = Live
		kind = Taste
		row = Effects
		min = 0
		max = 1
		whole = False
		default = 0.35
	}
	SETTING
	{
		name = overlay
		title = Velocity line
		tooltip = The line along the vessel's surface velocity, drawn after the scene.
		takesEffect = Live
		kind = Taste
		row = Effects
		default = True
	}

	KEY
	{
		name = cameraCut
		title = Camera back to its start distance
		tooltip = Puts the flight camera back to its start distance and tells ReDefinition about the cut.
		takesEffect = Live
		default = None
	}
}
