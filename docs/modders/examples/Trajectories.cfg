// A worked example of a registration (docs/modders/registering-a-mod.md in ReDefinition's
// repository): Trajectories 2.4.5.4 (GPL-3.0-or-later; Youen Toupin, A. Korsunsky, S.
// Gray), which ReDefinition does not bundle. To try it, put this file into
// GameData/Trajectories and start the game: its row shows under Effects, and holds
// Trajectories' values from the first flight on.
//
// Its settings are static properties of Trajectories.Settings, internal -- a member
// path reaches them all the same -- saved by Settings.Save, which its own window
// calls. Trajectories loads them only as its flight scenario loads: until then its
// Settings object is not there, the properties read 0 and Settings.Save does
// nothing. `ready` names that object, so what is set before the first flight of a
// run waits in ReDefinition until then. Two of them limit how far ahead and how
// quickly it predicts, and with that what the prediction costs per frame: quality,
// in the ranges of its own sliders. Three of its switches are here for the reset.
//
// No button, window or tab: Trajectories' window is the tool itself rather than a
// settings window, so its toolbar button stays; and it is one of KSP's dialogs, not
// an IMGUI window ReDefinition could give a close button.

REDEFINITION_MOD
{
	name = trajectories
	title = Trajectories
	detect = Trajectories.Settings
	version = 2.4.5.4
	save = Trajectories.Settings.Save
	ready = Trajectories.Trajectories.Settings

	SETTING
	{
		name = MaxPatchCount
		member = Trajectories.Settings.MaxPatchCount
		title = Trajectory prediction depth
		tooltip = How many patches of the path ahead Trajectories predicts -- each change of sphere of influence starts one.\nMore reaches further and costs more computation whenever the prediction updates.
		kind = Quality
		row = Effects
		order = 90
		takesEffect = Live
		min = 3
		max = 10
		whole = True
		default = 4
		required = True
	}
	SETTING
	{
		name = MaxFramesPerPatch
		member = Trajectories.Settings.MaxFramesPerPatch
		title = Frames per trajectory patch
		tooltip = Over how many frames Trajectories spreads the computation of one patch. Fewer update the prediction sooner and cost more in each frame.
		kind = Quality
		takesEffect = Live
		min = 1
		max = 50
		whole = True
		default = 15
		required = True
	}

	// For the reset, not shown: switches of the tool itself.
	SETTING
	{
		name = UseCache
		member = Trajectories.Settings.UseCache
		takesEffect = Live
		default = True
	}
	SETTING
	{
		name = DisplayTrajectories
		member = Trajectories.Settings.DisplayTrajectories
		takesEffect = Live
		default = False
	}
	SETTING
	{
		name = DisplayCompleteTrajectory
		member = Trajectories.Settings.DisplayCompleteTrajectory
		takesEffect = Live
		default = False
	}

	// What the graphics profiles set: the prediction's limits, within its own sliders.
	PROFILE
	{
		name = low
		MaxPatchCount = 3
		MaxFramesPerPatch = 25
	}
	PROFILE
	{
		name = max
		MaxPatchCount = 8
	}
}
