; ReDefinition proxy
;
; Copy next to KSP_x64.exe, alongside dxgi.dll. Without this file the defaults
; below apply.
;
; The proxy writes ReDefinitionProxy.log next to the executable. When the screen
; stays black or the game does not start, that log says why where the proxy can
; tell.
;
; Everything below the "live" marker is re-read while the game runs, within a
; second of the file being saved.

[Proxy]

; ---------------------------------------------------------------- read at load

; 1 = intercept the swapchain, 0 = pass everything through to Windows' own
; dxgi.dll. Set this to 0 if the game does not start with the proxy.
enabled=1

; 1 = do not substitute anything, but time Present and report it in the log.
; A run with 1 and a run with 0 give "Baseline:" and "D3D12 proxy:" lines from
; the same timing code, directly comparable.
measureOnly=0

; 1 = create the swapchain through FidelityFX rather than DXGI directly, which
; FSR's frame generation needs. Requires amd_fidelityfx_framegeneration_dx12.dll
; next to the executable; without it the proxy logs a line and presents without
; frame generation.
frameGeneration=1

; 1 = NVIDIA's DLSS frame generation where it runs, FSR's otherwise. It runs with
; NVIDIA's Streamline 2.14.1 next to KSP_x64.exe (or in streamlineDirectory below):
; sl.interposer.dll, sl.common.dll, sl.dlss_g.dll, sl.reflex.dll, sl.pcl.dll and
; nvngx_dlssg.dll, which "NVIDIA DLSS files" in ReDefinition's settings window
; downloads from NVIDIA's release. It also
; needs an NVIDIA RTX 40 GPU or newer, Windows 10 20H1 or newer, and
; hardware-accelerated GPU scheduling on in Windows' graphics settings. The log's
; "DLSS frame generation" lines say which runs and why. 0 = FSR's always.
dlssFrameGeneration=1

; 1 = the swapchain allows tearing presents, as KSP asks for: without V-Sync a
; frame is shown at once. 0 = the swapchain keeps the flags KSP asked for.
allowTearing=1

; ------------------------------------------------------------------------ live

; 1 = keep the UI out of the interpolated frames.
;
; Frame generation finds the UI by comparing the presented frame with a copy of it
; that has no UI: whatever differs is UI and is left alone. That copy is taken from
; the backbuffer itself, at the end of the last camera that draws the scene and
; before the first that draws UI -- so it differs from the presented frame in the UI
; and nowhere else. The KSP log names the cameras it is taken after and every camera
; drawn later; the "HUD-less check" lines in this proxy's log say how much of the
; frame differs, and where.
;
; 0 interpolates the UI along with the scene, and it smears with it.
hudLessColour=1

; 1 = tell FSR the depth buffer runs [1..0], which KSP's does. The upscaler sets
; the same flag for itself. FSR's source takes min and max of the near and far
; planes and lets only this flag decide; without it FSR reads the nearest geometry
; as the farthest, and the vessel smears outward into the world. Changing this
; rebuilds the context.
fgDepthInverted=1

; DLSS frame generation only: the smallest depth difference, in metres, at which it
; tells two surfaces apart as separate objects. Streamline takes it in linear depth,
; 1 / depth, which is about the distance over the camera's near plane; its default of
; 40 comes to 8.4 m at KSP's near plane in flight, 0.21 m, so an aircraft and the
; runway under it count as one object. The proxy divides this value by the near plane
; of each frame. 0 keeps Streamline's default. Read while the game runs.
fgObjectSeparationMetres=1.0

; 1 = negate the motion vector scale. Unity's vectors point opposite to FSR's
; and the upscaler already compensates, so this is normally 0.
fgNegateMotionScale=0

; 1 = flip depth and motion vectors vertically before they go to frame
; generation. Unity renders RenderTextures upside down on Direct3D; the backbuffer
; is not. The "motion vectors" line in this log tries both orientations and both
; signs and names the one with the smallest reprojection error. DLSS frame
; generation stays off with 0.
fgFlipInputs=1

; 1 = flip the HUD-less copy as well. 0 is right for KSP: the copy is a Blit from
; the screen, which Unity orients like the screen. The "HUD-less check" line
; measures it in both orientations; the right setting is the one where "direct" is
; small and "mirrored" is large.
fgFlipHudLess=0

; FSR frame generation only. 1 = pass the camera position and orientation, which
; the API documents as required. With 0 they are zero, and everything with parallax
; smears -- the vessel and the launch clamps most. DLSS frame generation always gets
; them.
fgCameraBasis=1

; FSR frame generation only; DLSS frame generation follows KSP's V-Sync as
; NVIDIA's guide allows it.
;
; 0 = KSP's own V-Sync setting applies, also while frame generation generates.
; The default: turn V-Sync on in KSP's graphics settings for even frames, on a
; fixed-refresh monitor and with G-Sync or FreeSync alike. AMD: running "within
; half the VRR window supported by the monitor ... enabling VSync will result in
; optimal pacing"; in full screen without VSync "Tearing artifacts may appear
; even with VRR enabled".
;
; 1 = present with VSync for as long as frame generation is switched on, not only
; on the frames it interpolates, whatever KSP's own setting says. A sync interval
; of 0 becomes 1; a higher one the game asks for stays. AMD: with VSync, frame generation "will slow down the
; application to half refresh rate, so every interpolated and real frame gets
; displayed for one refresh"; without it, in a window, "not all frames generated
; will get displayed".
fgVSync=0

; FSR frame generation only. 1 = while frame generation generates and KSP
; presents without V-Sync, hold the rendered frame rate slightly below half the
; monitor's refresh rate. AMD: "The application should ensure that the rendered
; frame rate is slightly below half the desired output frame rate." In a window
; nothing tears; in full screen frames can still tear without V-Sync, with G-Sync
; or FreeSync too. More even than KSP's own frame limit, which is a software
; timer. 0 = no cap, the default.
fgHalfRefreshLimit=0

; FSR frame generation only. 1 = run optical flow and interpolation on a compute
; queue of AMD's swapchain, overlapping the next frame's rendering, instead of on
; the game's queue. AMD: this "can improve performance depending on the GPU and
; workloads", and "It is strongly advised to profile, if significant performance
; benefits can be gained from asynchronous compute usage. Not using asynchronous
; compute will result in a lower memory overhead." The proxy keeps its inputs in
; two copies in turn, as AMD requires then. Changing this rebuilds the context.
; 0 = the game's queue, the default.
fgAsyncWorkloads=0

; Where nvngx_dlss.dll lies, if not next to KSP_x64.exe. DLSS needs NVIDIA's
; nvngx_dlss.dll, which "NVIDIA DLSS files" in ReDefinition's settings window
; downloads from NVIDIA's release. Empty = next to KSP_x64.exe only.
dlssDirectory=

; Where amd_fidelityfx_upscaler_dx12.dll lies, if not next to KSP_x64.exe. AMD's
; upscaler -- FSR 4 on a GPU that has it -- needs AMD's DLL, which games that use
; AMD's upscaler carry. Empty = next to KSP_x64.exe.
amdUpscalerDirectory=

; Where NVIDIA's Streamline DLLs lie, if not next to KSP_x64.exe: the folder with
; sl.interposer.dll, its sl.*.dll plugins and nvngx_dlssg.dll. Only Streamline
; 2.14.1, signed by NVIDIA, is loaded. Read when KSP creates its swapchain, at the
; start. Empty = next to KSP_x64.exe.
streamlineDirectory=

; FSR frame generation's pacing. FSR's swapchain owns the timing of generated
; frames and spends two worker threads on it; these are the settings it exposes,
; at AMD's defaults.
;
; fgPacingHybridSpin lets the pacing spinlock sleep -- in AMD's words "Less
; precise, but power saving". Off for the most even spacing; on a laptop it can be
; the better trade.
fgPacingSafetyMarginMs=0.1
fgPacingVarianceFactor=0.1
fgPacingHybridSpin=0
fgPacingHybridSpinTime=2
fgPacingWaitOnFence=0

; Seconds between frame time reports in the log. The "presented/rendered" figure
; at the end of each line says whether frames are generated: near 1.0 means no,
; near 2.0 means every second frame is generated.
reportSeconds=10

; Log every value handed to frame generation, this often in seconds. 0 switches it
; off.
logInputsSeconds=0
