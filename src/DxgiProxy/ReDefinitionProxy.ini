; ReDefinition proxy
;
; Next to KSP_x64.exe, alongside dxgi.dll. The proxy writes this file there when
; there is none, and adds the keys a file from an earlier version lacks, each with
; its default and comment; values already set stay as they are.
;
; The proxy writes ReDefinitionProxy.log next to the executable. When the screen
; stays black or the game does not start, that log says why where the proxy can
; tell.
;
; Everything between the "live" marker and the next is re-read while the game
; runs, within a second of the file being saved.

[Proxy]

; ---------------------------------------------------------------- read at load

; 1 = intercept the swapchain, 0 = pass everything through to Windows' own
; dxgi.dll. Set this to 0 if the game does not start with the proxy.
enabled=1

; 1 = do not substitute anything, but time Present and report it in the log.
; A run with 1 and a run with 0 give "Baseline:" and "D3D12 proxy:" lines from
; the same timing code, directly comparable.
measureOnly=0

; 1 = create the swapchain through FidelityFX rather than DXGI directly, which
; FSR's frame generation needs. Requires amd_fidelityfx_framegeneration_dx12.dll
; next to the executable; without it the proxy logs a line and presents without
; frame generation. With 0, the proxy still presents through NVIDIA's Streamline
; where it finds it and the GPU runs DLSS Ray Reconstruction, for raytracing --
; except with rrPath=ngx below.
frameGeneration=1

; Which frame generation the swapchain is made for: auto, dlss, xess or fsr.
;
; dlss = NVIDIA's DLSS frame generation where it runs, FSR's otherwise. It runs with
; NVIDIA's Streamline 2.14.16 next to KSP_x64.exe (or in streamlineDirectory below):
; sl.interposer.dll, sl.common.dll, sl.dlss_g.dll, sl.reflex.dll, sl.pcl.dll and
; nvngx_dlssg.dll, which "NVIDIA DLSS files" in ReDefinition's settings window
; downloads from NVIDIA's release. It also
; needs an NVIDIA RTX 40 GPU or newer (or an RTX 30 or 20 with the dlssg_for_sm86
; package), Windows 10 20H1 or newer, and hardware-accelerated GPU scheduling on in
; Windows' graphics settings. The log's
; "DLSS frame generation" lines say which runs and why.
;
; xess = Intel's XeSS frame generation, one generated frame per rendered frame, where
; it runs, FSR's otherwise. It runs with libxess_fg.dll and libxell.dll from Intel's
; XeSS SDK 2.1 or newer next to KSP_x64.exe (or in xessFgDirectory below), on an Intel
; Arc GPU or Core Ultra processor, or on any other GPU with Shader Model 6.4, and brings
; Intel's XeLL for the latency, which it requires. The log's "XeSS frame generation"
; lines say which runs and why.
;
; auto = DLSS's where it runs, XeSS's on an Intel GPU where its DLLs are there, FSR's
; otherwise. fsr = FSR's always. Read when KSP creates its swapchain, at the start.
frameGenerationTechnique=auto

; How DLSS Ray Reconstruction runs for raytracing: auto, streamline or ngx. It needs
; NVIDIA's nvngx_dlssd.dll, which "NVIDIA DLSS files" in ReDefinition's settings
; window downloads next to the Streamline DLLs, and an NVIDIA RTX GPU.
;
; streamline = through NVIDIA's Streamline, whose swapchain then presents: with DLSS
; frame generation, or with frameGeneration=0. Beside FSR's or XeSS's frame
; generation there is then no Ray Reconstruction.
;
; ngx = through NVIDIA's NGX directly, beside any frame generation but DLSS's, whose
; Streamline holds NGX on the device. With frameGeneration=0 the swapchain is then
; not Streamline's.
;
; auto = Streamline's where its swapchain presents, NGX's otherwise. Read when KSP
; creates its swapchain, at the start.
rrPath=auto

; 1 = the swapchain allows tearing presents, as KSP asks for: without V-Sync a
; frame is shown at once. 0 = the swapchain keeps the flags KSP asked for.
allowTearing=1

; ------------------------------------------------------------------------ live

; 1 = keep the UI out of the interpolated frames.
;
; Frame generation finds the UI by comparing the presented frame with a copy of it
; that has no UI: whatever differs is UI and is left alone. That copy is taken from
; the backbuffer itself, at the end of the last camera that draws the scene and
; before the first that draws UI -- so it differs from the presented frame in the UI
; and nowhere else. The KSP log names the cameras it is taken after and every camera
; drawn later; the "HUD-less check" lines in this proxy's log say how much of the
; frame differs, and where.
;
; 0 interpolates the UI along with the scene, and it smears with it.
hudLessColour=1

; 1 = tell FSR the depth buffer runs [1..0], which KSP's does. The upscaler sets
; the same flag for itself. FSR's source takes min and max of the near and far
; planes and lets only this flag decide; without it FSR reads the nearest geometry
; as the farthest, and the vessel smears outward into the world. Changing this
; rebuilds the context. XeSS frame generation takes it when KSP creates its
; swapchain.
fgDepthInverted=1

; DLSS frame generation only: the smallest depth difference, in metres, at which it
; tells two surfaces apart as separate objects. Streamline takes it in linear depth,
; 1 / depth, which is about the distance over the camera's near plane; its default of
; 40 comes to 8.4 m at KSP's near plane in flight, 0.21 m. The proxy divides this
; value by the near plane of each frame. 0 keeps Streamline's default. Read while the
; game runs.
fgObjectSeparationMetres=0

; DLSS frame generation only: on or dynamic. on = a fixed multiplier, as many generated
; frames as the GPU, the package's MaxGeneratedFrames and the display allow. dynamic =
; Dynamic Multi Frame Generation: Streamline "automatically adjusts the number of
; generated frames to align the output frame rate with the display's refresh rate or a
; user-defined target" (dlssgDynamicTargetFps), and ignores the multiplier. It needs an
; NVIDIA driver 595.41 or newer and a GPU that does multi frame generation; where
; Streamline's state does not report it supported (DLSSGState::bIsDynamicMFGSupported)
; the fixed multiplier stays and the log says so. The log's "DLSS frame generation:
; dynamic multi frame generation" line says what Streamline reports, once per
; swapchain. NVIDIA: it "is designed to work with the Reflex frame rate limiter";
; ReDefinition sets none; the latency brake sleeps before Streamline's Reflex sleep
; (latencyBrakeWithDlssg) and measured the same gain under dynamic as under a fixed multiplier.
; Read while the game runs.
dlssgMode=on

; DLSS frame generation only: the generated frames per rendered frame, where the mod's
; settings window has not chosen a multiplier (it does, every time the game starts, and
; then this and dlssgMode are not read): 1 = 2x, 2 = 3x, 3 = 4x and so on, never more
; than Streamline's state says the GPU and the package's MaxGeneratedFrames allow
; (DLSSGState::numFramesToGenerateMax). 0 = as many as they allow. Read while the game
; runs.
dlssgFrames=0

; Dynamic Multi Frame Generation's target output frame rate in frames a second; 0 =
; the monitor's refresh rate. Streamline ignores it under V-Sync. Read while the game
; runs.
dlssgDynamicTargetFps=0

; DLSS frame generation only: 1 = hand DLSS-G a UI plane and turn user interface
; recomposition on, so that it interpolates the scene without the HUD and lays the HUD
; over the result. KSP draws its HUD straight onto the backbuffer and gives DLSS-G no
; UI plane, so the proxy makes one: the pixels where the presented frame differs from
; the HUD-less copy are UI. A difference gives no alpha, only a bound on it, so the
; plane is an approximation (dlssgUiAlpha). 0 = the HUD-less copy alone, with which
; DLSS-G keeps a still HUD still by itself: measured in KSP on an RTX A4500, the HUD's
; pixels in generated frames equal the rendered frames' (PSNR 65 dB and up), and with 1
; they come out a little off (the navball's glyphs 36 dB), which is why 0 is the default.
; DLSS-G in the RTX 30/20 package: Preset=C (FG Lite) turns recomposition off whatever is
; asked (its log's preset_pinned says effective 0). Read while the game runs.
dlssgUiRecomposition=0

; How the UI plane's alpha is found where the presented frame and the HUD-less copy
; differ. binary = alpha 1 and the presented colour: the UI is taken as opaque, so the
; HUD stays as drawn and the scene behind a translucent panel is not interpolated.
; minimal = the least alpha that gives the presented frame over the HUD-less copy: right
; for black and white UI, too transparent for grey panels, which let the scene ghost
; through. Read while the game runs.
dlssgUiAlpha=binary

; The greatest difference, in levels of 255, between the presented frame and the
; HUD-less copy that still counts as no UI. Read while the game runs.
dlssgUiThreshold=2

; 1 = negate the motion vector scale. Unity's vectors point opposite to FSR's
; and the upscaler already compensates, so this is normally 0.
fgNegateMotionScale=0

; 1 = flip depth and motion vectors vertically before they go to frame
; generation. Unity renders RenderTextures upside down on Direct3D; the backbuffer
; is not. The "motion vectors" line in this log tries both orientations and both
; signs and names the one with the smallest reprojection error. DLSS and XeSS frame
; generation stay off with 0.
fgFlipInputs=1

; 1 = flip the HUD-less copy as well. 0 is right for KSP: the copy is a Blit from
; the screen, which Unity orients like the screen. The "HUD-less check" line
; measures it in both orientations; the right setting is the one where "direct" is
; small and "mirrored" is large.
fgFlipHudLess=0

; FSR frame generation only. 1 = pass the camera position and orientation, which
; the API documents as required. With 0 they are zero, and everything with parallax
; smears -- the vessel and the launch clamps most. DLSS and XeSS frame generation
; always get them.
fgCameraBasis=1

; FSR frame generation only; DLSS frame generation follows KSP's V-Sync as
; NVIDIA's guide allows it.
;
; 0 = KSP's own V-Sync setting applies, also while frame generation generates.
; The default: turn V-Sync on in KSP's graphics settings for even frames, on a
; fixed-refresh monitor and with G-Sync or FreeSync alike. AMD: running "within
; half the VRR window supported by the monitor ... enabling VSync will result in
; optimal pacing"; in full screen without VSync "Tearing artifacts may appear
; even with VRR enabled".
;
; 1 = present with VSync for as long as frame generation is switched on, not only
; on the frames it interpolates, whatever KSP's own setting says. A sync interval
; of 0 becomes 1; a higher one the game asks for stays. AMD: with VSync, frame generation "will slow down the
; application to half refresh rate, so every interpolated and real frame gets
; displayed for one refresh"; without it, in a window, "not all frames generated
; will get displayed".
fgVSync=0

; FSR frame generation only. 1 = while frame generation generates and KSP
; presents without V-Sync, hold the rendered frame rate slightly below half the
; monitor's refresh rate. AMD: "The application should ensure that the rendered
; frame rate is slightly below half the desired output frame rate." In a window
; nothing tears; in full screen frames can still tear without V-Sync, with G-Sync
; or FreeSync too. More even than KSP's own frame limit, which is a software
; timer. 0 = no cap, the default. With XeSS frame generation the cap is Intel XeLL's
; (xellLimitLive below): the presented frames held slightly below the
; refresh rate, with or without V-Sync. Intel: "FPS Cap is controlled via
; xellSetSleepMode API when Low Latency mode is active", and XeLL "will limit the frame
; rate to half of the target ensuring that the total count of presented frames (both
; generated and rendered) matches the requested FPS".
fgHalfRefreshLimit=0

; FSR frame generation only. 1 = run optical flow and interpolation on a compute
; queue of AMD's swapchain, overlapping the next frame's rendering, instead of on
; the game's queue. AMD: this "can improve performance depending on the GPU and
; workloads", and "It is strongly advised to profile, if significant performance
; benefits can be gained from asynchronous compute usage. Not using asynchronous
; compute will result in a lower memory overhead." The proxy keeps its inputs in
; two copies in turn, as AMD requires then. Changing this rebuilds the context.
; 0 = the game's queue, the default.
fgAsyncWorkloads=0

; FSR frame generation's pacing. FSR's swapchain owns the timing of generated
; frames and spends two worker threads on it; these are the settings it exposes,
; at AMD's defaults.
;
; fgPacingHybridSpin lets the pacing spinlock sleep -- in AMD's words "Less
; precise, but power saving". Off for the most even spacing; on a laptop it can be
; the better trade.
fgPacingSafetyMarginMs=0.1
fgPacingVarianceFactor=0.1
fgPacingHybridSpin=0
fgPacingHybridSpinTime=2
fgPacingWaitOnFence=0

; The rendered frame rate, averaged over two seconds, below which frame generation
; stays off: below nine tenths of it, until above nineteen twentieths of it again. AMD: "FSR Frame Generation 3.1.6 has
; been designed for an input framerate of at least 60 FPS", 4.0.1 for 30, and "it may
; be preferable to ... [disable] FSR Frame Generation ... if the frame rate
; consistently drops below that threshold". -1: that rate for FSR, 30 for DLSS frame
; generation, for which NVIDIA names none, 40 for XeSS frame generation, Intel's "40
; FPS minimum"; 0: never off for this; any other number: that many frames a second.
fgMinimumFps=-1

; NVIDIA Reflex's low latency mode where DLSS frame generation's own Reflex does not
; run: frame generation off or FSR's, on an NVIDIA GPU. The game's frame begins as late
; as it can and still finish in time, so input reaches the screen sooner. 0 leaves the
; mode off. Re-read while the game runs. On an Intel GPU without XeSS frame generation
; the same for Intel's XeLL (xell, further down), read when KSP creates its swapchain;
; with XeSS frame generation XeLL is always on, as Intel requires. While XeLL's low
; latency mode is on KSP's V-Sync shows every refresh at most -- Intel: "when VSync is
; enabled, sync interval for IDXGISwapChain::Present must always be 1 when Low Latency
; is active".
lowLatency=1

; The latency brake, on any GPU, not while XeLL lowers the latency: where the GPU holds
; the frames back, the game waits in the proxy after its frame has read the input. On a
; GPU other than Intel's XeLL lowers the latency only while XeSS frame generation
; generates -- Intel: "If the condition is not fulfilled then XeLL will not perform
; Latency reduction" -- and the brake takes over while it is held off. The brake has it
; wait before the frame begins instead, leaving latencyBrakeTargetMs of those waits a
; frame, so the GPU is still fed in time. Measured on an RTX A4500 with raytracing Full
; and 4 ms, the median from the frame's start to the GPU's end: 57.8 ms without the brake,
; 48.6 ms with it at the same frame rate; with FSR frame generation 60.2 and 45.7 ms,
; with DLSS frame generation 72.1 and 57.8 ms. A lower target lowers it further, at some
; cost in frame rate where the CPU, not the GPU, limits it.
; 0 switches it off. Re-read while the game runs.
latencyBrake=1
latencyBrakeTargetMs=4
; Which waits the brake counts: 1 the proxy's and the Present, 2 the proxy's alone.
latencyBrakeWaits=1
; The brake under DLSS frame generation too: it sleeps before Streamline's Reflex sleep,
; which then follows with its markers as before. 0 leaves DLSS frame generation to its
; Reflex alone.
latencyBrakeWithDlssg=1
; AMD Anti-Lag 2 on a Radeon RX 5000 or later: 12 on the proxy's Direct3D 12 device, 11 on
; the game's Direct3D 11 device, 0 off. On, it takes the latency brake's place. The log's
; "Latency:" lines measure from the frame's start to the GPU's end of its Present on every
; GPU, for telling which lowers it more. Re-read while the game runs.
antiLag2=0

; Seconds between frame time reports in the log. The "presented/rendered" figure
; at the end of each line says whether frames are generated: near 1.0 means no,
; near 2.0 means every second frame is generated.
reportSeconds=10

; Log every value handed to frame generation, this often in seconds. 0 switches it
; off.
logInputsSeconds=0

; For development, off by default: DLSS and XeSS frame generation show only the frames
; they generate.
fgShowOnlyGenerated=0

; XeSS frame generation only. 0 = the UI is interpolated with the scene, Intel's default
; and recommendation. 1 = the UI is laid onto the generated frames from the HUD-less copy
; (hudLessColour) and the backbuffer instead; Intel: composition "ties the UI update rate
; to the application frame rate", and interpolation "may introduce visible distortions"
; where interfaces are layered and semi-transparent. Re-read while the game runs.
xessFgUiComposition=0

; XeSS frame generation only: frames generated per rendered frame, 1 by default. More only
; on an Intel GPU, as many as it supports; Intel: "On non-Intel GPUs the maximum number
; of generated frames is one". The most is set when KSP creates its swapchain -- "The
; maximum number of generated frames is set during the proxy swap chain initialization and
; cannot be updated" -- and fewer while the game runs.
xessFgFrames=1

; XeSS frame generation only: how readily it takes a frame for a scene change and
; interpolates none there, 0 to 1. Intel: "A higher threshold value increases the
; algorithm's sensitivity, causing it to more readily identify scene changes and disable
; interpolation ... Default value is 0.7." Re-read while the game runs.
xessFgSceneChangeThreshold=0.7

; For development, off by default: XeSS frame generation marks its generated frames,
; Intel's "purple boxes and vertical lines on the interpolated frame", and shows a black
; frame where an interpolation failed instead of the rendered one. Re-read while the game
; runs.
xessFgTagInterpolatedFrames=0
xessFgPresentFailedInterpolation=0

; XeSS frame generation only: the game's frames in a row without inputs (no packet, no
; depth or motion vectors, constants it would refuse) that it stays on for, 3 by default.
; Switched off, its input history is cleared and the frames after the switch on come with
; Intel's "too few frames" warning (an extra frame to activate); a frame without inputs is
; otherwise presented without generated frames. 0 = off at the first. Re-read while the
; game runs.
xessFgGraceFrames=3

; XeSS frame generation only: a frame's constants that Intel's library refuses -- a motion
; vector scale of 0 or not a number, a projection from a near plane, far plane or field of
; view that is not a positive number. skip, the default = the frame gets no inputs and
; counts against xessFgGraceFrames. fix = a scale of 0 becomes 1 (as OptiScaler does), a
; wrong projection still skips. pass = handed over as they are; its refusal switches XeSS
; frame generation off for two seconds. Re-read while the game runs.
xessFgBadConstants=skip

; XeSS frame generation only. 1 = XeSS frame generation is switched off for one Present and
; on again when the UI composition, the generated frames or the sync interval change while
; it generates -- OptiScaler does ("To prevent XeLL issues"). 0 = they change live, as
; Intel allows ("You can enable or disable UI composition at any time"), the default.
; Re-read while the game runs.
xessFgResetOnChange=0

; XeSS frame generation only: a history reset within this many Presents of the last one
; handed over is dropped (OptiScaler: 3). 0 = every reset is handed over, the default.
; Re-read while the game runs.
xessFgResetDebounce=0

; For measuring, 0 by default: what the cut-out surfaces' tests (grass, ferns) cost the
; rays. 1 decides their hits without reading their textures, 2 takes every surface as
; opaque. The picture is wrong with either. Re-read while the game runs.
rtCutoutTest=0

; Opacity Micromaps for the cut-out surfaces (grass, ferns), NVIDIA GPUs only, 0 by default:
; 1 = each cut-out mesh's triangles are baked into micromaps from their texture coordinates and
; the material texture, and the mesh's structure is built with them. A ray skips the
; transparent parts of a blade and stops at the opaque ones without the passes' test; the
; picture stays the same. The Ada generation (RTX 40) traces them in hardware, Ampere (RTX 30)
; in software. A driver without them and other GPUs trace as with 0; the log says so. The
; passes' pipelines are made with micromap support once it is 1, which costs every trace "a small
; penalty on traversal performance overall" (NVIDIA). 0 and 1 switch while the game runs,
; without building the structures again. rtOmmMaxSubdivision, 2 to 8, is the finest
; subdivision of a micromap (about one micro-triangle to a texel, 4^level of them at most; 6 is
; 1 KB a micromap); read when a mesh is baked. Re-read while the game runs.
rtOpacityMicromaps=0
rtOmmMaxSubdivision=6

; For measuring, 0 by default: 1 hands the sun's visibility on as its pass traced it,
; one ray a pixel, past the denoiser. The picture is noisy with it. Re-read while the
; game runs.
rtSunUnfiltered=0

; How many of the denoiser's five spatial steps filter the sun's visibility, and how many
; frames at most its temporal pass keeps of it (1 to 32). The rays draw the shadows of the
; blades of grass; more steps or frames smooth them away, fewer leave more noise.
; Re-read while the game runs.
rtSunAtrousSteps=0
rtSunHistory=4

; For measuring, 0 by default: what of the sun's light a cut-out surface (grass, ferns)
; lets through to what lies behind it, 0 to 1. Above 0 the grass loses its own shading.
; Re-read while the game runs.
rtFoliageTransmission=0

; The radiance cache of the raytraced indirect light, off by default: 1 keeps the light the
; rays find in a grid over the world, and a ray's path ends where it meets a part of the
; world the grid already knows, instead of bouncing on. Fewer rays a frame; the light comes
; from many frames' rays, so it follows a change some frames late. Its table holds
; 2^rtRadianceCacheEntries cells of 44 bytes, 16 to 22 (20: 46 MB of video memory). A cell
; is rtRadianceCacheCellPixels pixels across at its distance and never smaller than
; rtRadianceCacheMinCell metres; it averages at most rtRadianceCacheSamples rays' light and
; goes once no ray met it for rtRadianceCacheMaxAge frames. For checking:
; rtRadianceCacheDebug 1 shows the cache's light in place of the diffuse light, 2 each cell
; in a colour of its own. Re-read while the game runs.
rtRadianceCache=0
rtRadianceCacheEntries=20
rtRadianceCacheCellPixels=8
rtRadianceCacheMinCell=0.125
rtRadianceCacheSamples=256
rtRadianceCacheMaxAge=50
rtRadianceCacheDebug=0

; How the raytracing builds its meshes' acceleration structures, each for the meshes
; built after a change. Re-read while the game runs.
; rtBlasBatch: 1 = a frame's meshes copied first, then built back to back without
; barriers between them (NVIDIA's advice); 0 = mesh by mesh.
; rtBlasPool: 1 = the structures and the meshes' data in ranges of a few large buffers;
; 0 = buffers of their own per mesh.
; rtBlasBudget: the triangles of new meshes built in one frame, the rest in the next
; frames, which leaves them out of the picture until then. 0 = all at once.
; rtBlasCompaction: 0 = none; 1 = the structures compacted once built, for less video
; memory; 2 = built fast first and rebuilt for faster rays and compacted in later
; frames that build no new mesh, rtBlasRefineBudget triangles a frame.
; rtTlasFastTrace: 1 = the scene's structure built for faster rays; 0 = for a faster
; build.
rtBlasBatch=1
rtBlasPool=1
rtBlasBudget=0
rtBlasCompaction=2
rtBlasRefineBudget=65536
rtTlasFastTrace=0

; For comparison, NVIDIA GPUs only, 0 by default: 1 = new meshes' structures from RTX Mega
; Geometry's clusters of up to 256 triangles, all of a frame's in two calls. Meshes it
; does not fit, and other GPUs, are built as with 0. Re-read while the game runs.
rtMegaGeometry=0

; ------------------------------------------------- read when what they serve starts

; The raytracing and Ray Reconstruction on a Direct3D 12 queue of their own, so that
; their work does not wait behind frame generation's on the swapchain's queue. Read
; when KSP creates its swapchain.
rtOwnQueue=0

; Where nvngx_dlss.dll lies, if not next to KSP_x64.exe. DLSS needs NVIDIA's
; nvngx_dlss.dll, which "NVIDIA DLSS files" in ReDefinition's settings window
; downloads from NVIDIA's release. Empty = next to KSP_x64.exe only.
dlssDirectory=

; Where amd_fidelityfx_upscaler_dx12.dll lies, if not next to KSP_x64.exe. AMD's
; upscaler -- FSR 4 on a GPU that has it -- needs AMD's DLL, which games that use
; AMD's upscaler carry. Empty = next to KSP_x64.exe.
amdUpscalerDirectory=

; Where Intel's libxess.dll lies, for XeSS, if not next to KSP_x64.exe.
xessDirectory=

; Where NVIDIA's Streamline DLLs lie, if not next to KSP_x64.exe: the folder with
; sl.interposer.dll, its sl.*.dll plugins, nvngx_dlssg.dll and nvngx_dlssd.dll, which
; Ray Reconstruction through NGX (rrPath) takes from there too. Only Streamline
; 2.14.16, signed by NVIDIA, is loaded. Read when KSP creates its swapchain, at the
; start. Empty = next to KSP_x64.exe.
streamlineDirectory=

; Where Intel's libxess_fg.dll and libxell.dll lie, for XeSS frame generation, if not
; next to KSP_x64.exe. Read when KSP creates its swapchain, at the start. Empty = next
; to KSP_x64.exe.
xessFgDirectory=

; XeSS frame generation's UI mode, which its UI composition (xessFgUiComposition) takes:
; auto, the default, "Determine UI composition mode automatically, based on provided
; inputs", or one of Intel's others by name -- none, backbuffer_uitexture,
; hudless_uitexture, backbuffer_hudless, backbuffer_hudless_uitexture. The proxy hands
; it no UI texture, only the HUD-less copy. Read when KSP creates its swapchain.
xessFgUiMode=auto

; Intel's XeLL on an Intel GPU where XeSS frame generation does not run. 1 = XeLL is
; made, in low latency mode as lowLatency says, the default. 0 = XeLL is not made at
; all, and the latency brake lowers the latency as on any other GPU; Intel: "The
; application can disable XeLL when frame generation is disabled". XeSS frame generation
; always brings XeLL, which it requires. Read when KSP creates its swapchain.
xell=1

; XeLL's low latency boost, 0 by default. Intel's header: "Boost is not supported as of
; now." Read when KSP creates its swapchain.
xellLowLatencyBoost=0

; XeLL's frame limit (fgHalfRefreshLimit under XeSS frame generation) follows later
; changes of that setting and of the monitor's refresh rate: 1, the default. It is set again
; only when it differs, once the GPU is idle -- Intel: "application must ensure any GPU
; activity is finished before xellSetSleepMode is called". 0 = set once, when KSP creates its
; swapchain. Re-read while the game runs.
xellLimitLive=1

; Which frame latency waitable object KSP gets from XeSS frame generation's swapchain, when
; it asks for one. auto, the default, and 1 = a semaphore of the proxy's, released after each
; game Present, which never holds the game back; OptiScaler uses it for Unity games that
; otherwise stuck while loading, and KSP did with XeSS-FG's own (the first ResizeBuffers
; never returned to the game). 0 = XeSS-FG's own. Read when KSP creates its swapchain.
xessFgOwnWaitable=auto

; XeSS frame generation with a libxess_fg.dll older than 1.2.2 (XeSS SDK 2.1.1). 0 = not
; used, FSR's frame generation instead, the default: the proxy tags resources without a
; command list, which those versions refuse (Intel's issues 45, 47, 48 and 50). 1 = used
; anyway. Read when KSP creates its swapchain.
xessFgAllowOld=0

; For development, all off by default. AMD's debug checker on frame generation and
; the upscaler, its messages into the log ("validate application supplied inputs"):
; read when a context is made.
vendorDiagnostics=0
; Streamline's ImGUI plugin, which only NVIDIA's development DLLs show, read when
; KSP creates its swapchain. With it the GPU device was once removed while KSP
; loaded.
streamlineImgui=0
