// ReDefinition Atmospheres' registration with ReDefinition: the key of the forecast window in the Controls tab. It goes to
// GameData/ReDefinition/Atmospheres/Atmospheres.cfg, beside the mod, so that it is read only with the mod installed.
// The mod keeps no member for the key: ReDefinition keeps the binding, and the forecast window asks ReDefinition.Api.Keys whether it was
// pressed. Without ReDefinition the window opens from the launcher's button. The settings of the atmospheres themselves are in the
// mod's own window (PluginData/settings.cfg), and none of them is a key.
//
// The format: docs/modders/registering-a-mod.md in ReDefinition's repository.

MOD_SETTINGS
{
	name = atmospheres
	title = ReDefinition Atmospheres
	detect = ReDefinition.Atmospheres.AtmospheresStartup

	KEY
	{
		name = forecastWindow
		title = Forecast window
		tooltip = Opens or closes the weather forecast window.
		group = Mods
		default = None
	}
}
