// ReDefinition Atmospheres' registration with ReDefinition: the keys of the forecast window and the cloud viewer in the Controls tab. It goes to
// GameData/ReDefinition/Atmospheres/Atmospheres.cfg, beside the mod, so that it is read only with the mod installed.
// The mod keeps no member for a key: ReDefinition keeps the bindings, and the forecast window and the cloud viewer ask ReDefinition.Api.Keys
// whether one was pressed. None has a default binding. Without ReDefinition the windows open from their buttons. The settings of the atmospheres themselves are in the
// mod's own window (PluginData/settings.cfg), and none of them is a key.
//
// The format: docs/modders/registering-a-mod.md in ReDefinition's repository.

MOD_SETTINGS
{
	name = atmospheres
	title = ReDefinition Atmospheres
	detect = ReDefinition.Atmospheres.AtmospheresStartup

	KEY
	{
		name = forecastWindow
		title = Forecast window
		tooltip = Opens or closes the weather forecast window.
		group = Mods
		default = None
	}

	KEY
	{
		name = cloudViewer
		title = Cloud viewer
		tooltip = Opens or closes the cloud viewer in flight.
		group = Mods
		default = None
	}

	KEY
	{
		name = cloudViewerFlip
		title = Cloud viewer A/B
		tooltip = Flips the cloud viewer's option sets A and B.
		group = Mods
		default = None
	}

	KEY
	{
		name = cloudViewerCapture
		title = Cloud viewer picture
		tooltip = Takes a picture with the cloud viewer's sidecar file.
		group = Mods
		default = None
	}
}
