// A grip choice for every landing leg whose tyre friction KSP holds at its own
// (ModuleWheelBase with wheelType LEG and autoFrictionAvailable False), as the
// grip pads have one (src/Flight/ReDefinitionLegGrip.cs). Read by ModuleManager only.
@PART[*]:HAS[@MODULE[ModuleWheelBase]:HAS[#wheelType[LEG],#autoFrictionAvailable[False]],!MODULE[ReDefinitionLegGrip]]:FOR[ReDefinition]
{
	MODULE
	{
		name = ReDefinitionLegGrip
	}
}
