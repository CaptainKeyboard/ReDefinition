// Room for all of Kerbin's grass clumps Parallax places in view. Parallax appends them
// into buffers of a fixed size per level of detail (maxRenderableObjectsLOD0-2) and drops
// what does not fit; which clumps are dropped changes from frame to frame, so the grass
// flickers where the buffer is full. Measured over the launch pad (KscGrass's log,
// 2026-10-13): KerbinGrass's LOD2 at 15 429 of 15 000, its LOD1 at up to 790 of 1000.
// Twice the room for both; the buffers hold 64 bytes a clump. Read by ModuleManager only.
@ParallaxScatters:HAS[@Body:HAS[#name[Kerbin]]]:FOR[ReDefinition]
{
	@Body:HAS[#name[Kerbin]]
	{
		@Scatter:HAS[#name[KerbinGrass]]
		{
			@Optimizations
			{
				@maxRenderableObjectsLOD1 = 2000
				@maxRenderableObjectsLOD2 = 30000
			}
		}
	}
}
