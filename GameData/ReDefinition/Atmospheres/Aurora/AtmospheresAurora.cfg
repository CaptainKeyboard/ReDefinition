// ReDefinition Atmospheres: the aurora (package D38).
//
// The shell is drawn by the Atmospheres assembly (setting "aurora": Off, Auto, Shell2D, Volumetric). This file holds its two config
// parts: the body rule that switches it on for Kerbin, and the look constants that Tuning.Get reads (every key is optional; the compiled
// value is the default). Other bodies with an atmosphere take the same node in their own REDEFINITION_BODY (AURORA { enabled = true }).
// A mod that draws its own aurora layer on a body (an EVE layer with "aurora" in its name) takes that body over in Auto.

@REDEFINITION_BODY[Kerbin]:FINAL
{
	@AURORA
	{
		@enabled = true
	}
}

ATMO_TUNING
{
	// The brightness of the whole shell and the extra exposure scale (TUFX's auto exposure acts on it like on the rest of the scene).
	aurora.gain = 0.9
	aurora.exposureScale = 1

	// The curtains: fold of the ridges, height share where the colour turns red, the stripe texture span in metres, stripe contrast.
	aurora.foldPhase = 0.55
	aurora.redStart = 0.55
	aurora.rayTileM = 400000
	aurora.rayContrast = 0.5

	// The march: target step in metres, most steps, the horizon fade (degrees of elevation: zero below the start, full from the end),
	// the cap on the path factor, the drift of the pattern, the base of the layer as a share of the atmosphere's depth.
	aurora.stepM = 6000
	aurora.maxSteps = 14
	aurora.horizonStartDeg = 3
	aurora.horizonFullDeg = 10
	aurora.pathCap = 3
	aurora.driftPerS = 0.004
	aurora.baseShare = 0.786

	// The faint green ambient light (at most 2 % of the snow albedo, scaled by the setting Aurora Ambient Tint); 0 is off.
	aurora.ambientTint = 0

	// How many ridges the oval carries: 1 repeats the ridge across the oval (a second, dimmer band beside the first), 0 keeps one.
	aurora.ridgeRepeat = 1

	// Where the shell may draw. skyTest: 0 the camera's hardware depth buffer, 1 a copy of Depth, 2 a copy of ResolvedDepth, 3 a copy of
	// the global depth texture, 4 no test. event: 0 BeforeForwardAlpha (the sky and the clouds draw over the shell), 1 AfterForwardAlpha
	// (the shell draws over them). skyDepthRef and skyDepthTol (copy modes): a tolerance above 0 takes the copy's value within it of the
	// reference as sky, instead of the far value. The series K-W3b (start aurora) measures the modes and decides the defaults.
	aurora.skyTest = 0
	aurora.event = 0
	aurora.skyDepthRef = 0
	aurora.skyDepthTol = 0

	// Series and probes only: a forced activity (0 to 1; -1 is the model's own) and the strong event's share with it.
	aurora.forceActivity = -1
	aurora.forceEvent = 0
}
