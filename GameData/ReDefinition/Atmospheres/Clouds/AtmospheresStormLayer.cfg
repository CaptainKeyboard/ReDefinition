// The snow cloud of an Atmospheres storm cell as layers of EVE's volumetric clouds. EVE reads this file itself.
// With StockVolumetricClouds installed ModuleManager makes the node EVE_CLOUDS, otherwise EVE does not read it.
// Storm is the cloud: a volume from 500 m to 2300 m above sea level, and a layer2D for the orbit and map view.
// The OBJECT's altitude is only the radius of the 2D sphere above the body: the cloud's top (2300 m), where the 2D picture stands in for it.
// Snow is EVE's snow field and sound from the ground up.
// The maps and the 2D picture are placeholders that Atmospheres replaces at run time.
// Nothing here is another author's (master plan 46.3, the owner 2026-11-26). The noise, the march, the feature size, the fade, the edge hardness
// and the snow field are derived in the comments beside them (physics and literature); the cloud type, its density, its height and coverage
// curves and its colour are ours since this layer's first version (d35a07c0). Keys we have no derivation for, and keys the installed EVE shader
// does not read (phase functions, multipleScatteringBrightness, erosionDepth, skylightTintMultiplier, _Lambertian), are not set: EVE's own
// defaults apply. Measured so far: a before / after comparison of fps and pictures (PRUEFPROTOKOLL 327).
EVE_CLOUDS:NEEDS[StockVolumetricClouds]
{
	OBJECT
	{
		name = ReDefinition-Atmospheres-Storm
		body = Kerbin
		altitude = 2300
		speed = 0,0,0
		detailSpeed = 0,0,0
		speedMode = LinearSurface
		// No _DetailDist: the 2D layer has no detail texture, so the detail fade has nothing to fade.
		layer2D
		{
			macroCloudMaterial
			{
			}
		}
		layerRaymarchedVolumeV5
		{
			// The grey of the storm cell's base, ours since the first version of this layer (d35a07c0); no upward drift, sky light multiplier or render
			// order set: we have no derivation for them, so EVE's own defaults apply.
			color = 168, 170, 174, 255
			// The fade to the 2D layer (camera altitude, metres; acts in EVE's C# only): it starts where a 1 km thick layer still subtends about 1 degree
			// (parallax: 1 km / 0.0175 = 57 km above the layer's base region, the start taken at half that for the 2D layer to take over in time) and ends
			// below the 70 km atmosphere top. Both storm layers must agree (EVE uses the minimum).
			scaledFadeStartAltitude = 30000
			scaledFadeEndAltitude = 60000
			// The march (metres; step = min(base + factor x distance, max), EVE/RaymarchCloud): the base step resolves the noise (tile / 128 = 62 m for an
			// 8 km tile) and stays below half a mean free path (0.5 / 0.007 per m = 71 m); the factor keeps about one step per pixel footprint
			// (60 degrees / 1080 px = 1e-3 rad); the cap is tile / 32. The light march covers three mean free paths (3 / 0.007 = 430 m) in steps of at most
			// half a mean free path (an optical depth of 0.5 a step keeps the midpoint rule's error near 1 %): 3 / 0.5 = 6 steps.
			raymarchingSettings
			{
				lightMarchSteps = 6
				lightMarchDistance = 430
				baseStepSize = 60
				adaptiveStepSizeFactor = 0.001
				maxStepSize = 250
			}
			// The Worley noise (EVE/CloudNoiseGen): octaves k = 0..6 halve the wavelength from the tile to tile / 64, two voxels of the 128-voxel texture
			// (its Nyquist limit) at lacunarity 2 with one period per tile: 7 octaves; persistence 2^(-1/3) = 0.79 from the k^(-5/3) spectrum of cloud
			// liquid water (Davis et al. 1994); spherical 0 keeps the plain distance (the shader raises the squared distance to 0.5 + 0.5 x spherical:
			// Worley's F1 distance).
			noise
			{
				worley
				{
					octaves = 7
					periods = 1
					lacunarity = 2
					persistence = 0.79
					spherical = 0
				}
			}
			coverageMap
			{
				value = ReDefinition/Atmospheres/Clouds/StormCoverage
				type = AlphaMap
				alphaMask = ALPHAMAP_R
			}
			cloudTypes
			{
				Item
				{
					typeName = SnowCloud
					minAltitude = 500
					maxAltitude = 2300
					interpolateCloudHeights = true
					density = 0.007
					// A convective storm cell is 5 to 15 km wide (Houze, Cloud Dynamics): the noise's largest feature 8 km.
					baseNoiseTiling = 8000
					// The shader softens the noise threshold over a window of 1 - hardness (in noise units): a cloud's edge mixing zone is about a tenth of
					// a cloud element's size (entrainment at the edge, Wood 2012 review): hardness 0.9.
					noiseEdgeHardness = 0.9
					particleFieldDensity = 0
					dropletsDensity = 0
					wetSurfacesIntensity = 0
					lightningFrequency = 0
					ambientVolume = 0
					coverageCurve
					{
						key = 0 0 0 5
						key = 0.12 0.85 0 0
						key = 0.5 0.95 0 0
						key = 0.82 0.35 -3 -3
						key = 0.95 0 0 0
					}
					densityCurve
					{
						key = 0 1
					}
				}
			}
			lightVolumeSettings
			{
				useLightVolume = False
			}
		}
		settings
		{
			_Color = 255,255,255,255
			_UVNoiseStrength = 0
			_MainTex
			{
				value = ReDefinition/Atmospheres/Clouds/StormSwirl
				isClamped = True
			}
			_FlowMap
			{
			}
		}
	}
	OBJECT
	{
		name = ReDefinition-Atmospheres-Snow
		body = Kerbin
		altitude = 2300
		speed = 0,0,0
		detailSpeed = 0,0,0
		speedMode = LinearSurface
		layerRaymarchedVolumeV5
		{
			// The storm layer's fade (EVE uses the minimum of a body's layers).
			scaledFadeStartAltitude = 30000
			scaledFadeEndAltitude = 60000
			coverageMap
			{
				value = ReDefinition/Atmospheres/Clouds/StormCoverage
				type = AlphaMap
				alphaMask = ALPHAMAP_R
			}
			// An effects-only layer draws no cloud: one step longer than any ray through the shell (1e9 m), no light march.
			raymarchingSettings
			{
				adaptiveStepSizeFactor = 0
				baseStepSize = 1000000000
				maxStepSize = 1000000000
				lightMarchDistance = 0
				lightMarchSteps = 0
				fxOnlyLayer = True
			}
			cloudTypes
			{
				Item
				{
					typeName = AtmospheresSnow
					minAltitude = -1
					maxAltitude = 2300
					interpolateCloudHeights = false
					// No cloud here (density 0); a finite tiling keeps EVE's 1 / tiling finite (the storm's 8 km).
					baseNoiseTiling = 8000
					density = 0.0
					lightningFrequency = 0.0
					// The field is sized for the heaviest snow a storm cell makes (1 = all of it); the sound at full level for a blizzard's wind.
					particleFieldDensity = 1
					ambientVolume = 1
					coverageCurve
					{
						key = 0 1
					}
					densityCurve
					{
					}
				}
			}
			particleField
			{
				particleFieldConfig = ReDefinition-Atmospheres-snow
			}
			ambientSound
			{
				// Our own synthesised storm wind (tools/gen_eve_storm_assets.py; master plan 46.3 E4).
				soundName = ReDefinition/Atmospheres/Clouds/Sounds/ReDefinitionStormWind
			}
			noise
			{
			}
			lightVolumeSettings
			{
				useLightVolume = False
			}
		}
		settings
		{
			_FlowMap
			{
			}
		}
	}
}

// The snow of a storm cell (master plan 46.3; .local/work/eve-values-derivation.md section 6). A cell paints its coverage at up to 1, so the
// flakes thicken from the rim to the middle.
// Physical snow: aggregates of 3 mm (Garrett & Yuter 2014) fall at 0.8 m/s (0.4-1.2 m/s, Locatelli & Hobbs 1974); at 1 mm/h water equivalent
// and an aggregate density of 0.05 g/cm3 (Magono & Nakamura 1965) that is 490 flakes per m3, a projected area of 3.5e-3 per m (Koschmieder:
// visibility 3.912 / 3.5e-3 = 1.1 km). The owner (2026-11-26) chose visible snow: 100000 particles in a 30 m field (3.7 per m3) drawn 3.5 cm wide
// keep that projected area (3.7 x pi x 0.0175^2 = 3.5e-3 per m); the flake sheet fills only part of each quad, so the snow dims the view less
// than that. EVE's particleSize is the half width.
// Flakes follow the wind (response time 0.08 s: tangential factor 1) and wobble by 10-30 % of their fall speed (0.2).
// Onset from the cloud's optical depth: the storm type is dense from a coverage of 0.12 (its coverage curve) at about 0.007 per m over 1.8 km,
// an optical depth above 10, where precipitation sets in (Wood 2012); full at the curve's peak, 0.5.
EVE_PARTICLE_FIELD_CONFIG:NEEDS[StockVolumetricClouds]
{
	OBJECT
	{
		name = ReDefinition-Atmospheres-snow
		randomDirectionStrength = 0.2
		fieldParticleCount = 100000
		fieldSize = 30
		tangentialSpeed = 1
		// Fresh snow's visible albedo 0.9 (Warren 1982).
		color = 235, 235, 240, 255
		minCoverageThreshold = 0.12
		maxCoverageThreshold = 0.5
		fallSpeed = 0.8
		particleSize = 0.0175
		// Our own flake sheet, 4 x 4 cells: soft discs, six-fold dendrites, aggregates (tools/gen_eve_storm_assets.py; master plan 46.3 E4).
		particleSheetCount = 4,4
		particleTexture
		{
			value = ReDefinition/Atmospheres/Clouds/Textures/PluginData/ReDefinitionSnowFlakes
		}
	}
}
