// Candidate looks of the own clouds for the in-game cloud viewer's preset list (package CLOUDR1). Each CLOUD_LOOK sets tuning keys (the names the viewer lists, CloudKeyRegistry); a key a look does
// not name keeps the value it has, and 'Today' names every key of the new model at its default, so choosing it undoes any other look.
//   KEY        { key = <tuning key>; value = <number> }                       a global key
//   LAYER_KEY  { prefix = <per-layer key prefix ending in a dot>; layerEndsWith = <suffix of the layer's name>; value = <number> }
//                                                                              a per-layer key for every layer whose name ends with the suffix (Kerbin-cumulus ends with cumulus)
// The new model: the heap volume (round lobes in a cascade), a crisp rim, a cavity that darkens the creases, and a finer march (layers.gridFine multiplies the grid points of a span: the product's
// 48 become 96 or 128). Measured at 1920 x 1080 on an RTX A4500: the product's pass 6.1 ms, 96 points 8.6 ms, 128 points 10.1 ms.

CLOUD_LOOK
{
	name = Today
	description = The product's clouds: shape volume, no heap, layer water exponent, the product's march.
	LAYER_KEY { prefix = cloud.heap.layer.; layerEndsWith = cumulus; value = -1 }
	LAYER_KEY { prefix = cloud.edgePower.layer.; layerEndsWith = cumulus; value = 0 }
	LAYER_KEY { prefix = cloud.cavity.layer.; layerEndsWith = cumulus; value = -1 }
	KEY { key = layers.gridFine; value = 1 }
	KEY { key = cloud.heap.warp; value = 0.5 }
	KEY { key = cloud.noise.blend; value = 0 }
	KEY { key = cloud.firstHit; value = 0 }
}

CLOUD_LOOK
{
	name = New Model 96 Steps
	description = Heap volume, crisp rim and cavity on the cumulus layer, 96 grid points (about +2.5 ms at 1080p).
	LAYER_KEY { prefix = cloud.heap.layer.; layerEndsWith = cumulus; value = 1 }
	LAYER_KEY { prefix = cloud.edgePower.layer.; layerEndsWith = cumulus; value = 0.5 }
	LAYER_KEY { prefix = cloud.cavity.layer.; layerEndsWith = cumulus; value = 0.35 }
	KEY { key = layers.gridFine; value = 2 }
	KEY { key = cloud.heap.warp; value = 0.5 }
	KEY { key = cloud.noise.blend; value = 0 }
	KEY { key = cloud.firstHit; value = 0 }
}

CLOUD_LOOK
{
	name = New Model 128 Steps
	description = The same with 128 grid points (about +4 ms at 1080p).
	LAYER_KEY { prefix = cloud.heap.layer.; layerEndsWith = cumulus; value = 1 }
	LAYER_KEY { prefix = cloud.edgePower.layer.; layerEndsWith = cumulus; value = 0.5 }
	LAYER_KEY { prefix = cloud.cavity.layer.; layerEndsWith = cumulus; value = 0.35 }
	KEY { key = layers.gridFine; value = 2.6667 }
	KEY { key = cloud.heap.warp; value = 0.5 }
	KEY { key = cloud.noise.blend; value = 0 }
	KEY { key = cloud.firstHit; value = 0 }
}
