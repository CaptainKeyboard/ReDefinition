// ReDefinition Atmospheres: route the sampled footstep clips through Rocket Sound Enhancement's mixer as exterior sound.
//
// Rocket Sound Enhancement (RSE, KSPModStewards, GPL-3.0 plugin) lists extra clips in RSE_SETTINGS/CustomMixerRouting/AudioClips; a clip named
// there is routed to the Exterior, Interior or Focus channel and muffled by its muffler. This patch adds our twelve step clips as Exterior. It
// applies only where RSE is installed. The footsteps are the only sampled sounds of the weather audio; the wind and the snow are made on the
// audio thread and have no clip to route, so their muffling stays ours (setting audioMuffling: Auto, Own, Rse). With Own the step sources
// are taken out of RSE's mixer group at runtime, so that the own low-pass is the only muffler.
// [VERIFY] ModuleManager's handling of a value name that contains "/" inside a patch body is not confirmed against the MM cache of an
// install with RSE; the series row D33.rse_state reports 1 only when the patched node holds all twelve names.
@RSE_SETTINGS:NEEDS[RocketSoundEnhancement]:AFTER[RocketSoundEnhancement]
{
	@CustomMixerRouting
	{
		@AudioClips
		{
			ReDefinition/Atmospheres/Sounds/steps_snow_01 = Exterior
			ReDefinition/Atmospheres/Sounds/steps_snow_02 = Exterior
			ReDefinition/Atmospheres/Sounds/steps_snow_03 = Exterior
			ReDefinition/Atmospheres/Sounds/steps_snow_04 = Exterior
			ReDefinition/Atmospheres/Sounds/steps_snow_05 = Exterior
			ReDefinition/Atmospheres/Sounds/steps_snow_06 = Exterior
			ReDefinition/Atmospheres/Sounds/steps_snow_07 = Exterior
			ReDefinition/Atmospheres/Sounds/steps_snow_08 = Exterior
			ReDefinition/Atmospheres/Sounds/steps_snow_09 = Exterior
			ReDefinition/Atmospheres/Sounds/steps_snow_10 = Exterior
			ReDefinition/Atmospheres/Sounds/steps_snow_11 = Exterior
			ReDefinition/Atmospheres/Sounds/steps_snow_12 = Exterior
		}
	}
}
