// ReDefinition Atmospheres: Eve. Clouds only: a hot, dense air in which nothing falls to the ground and nothing lies on it.
// The clouds are the pack's two layers (clouds1, clouds2). They hold no cloud type that plays a role of ours, so the role discovery
// takes none of them and EVE draws them as the pack configured them; the pack has no particle field for Eve, and this file declares
// none. No cover node: with a precipitation type of None the body gets no ground cover.
REDEFINITION_BODY
{
	name = Eve
	enabled = true
	status = Auto

	PRECIP
	{
		TYPE
		{
			id = none
			kind = None
		}
	}

	CLOUDS
	{
		discover = Auto
	}

	FROST
	{
		// The air is far above the freezing point everywhere: no frost on the camera.
		enabled = false
	}
}
