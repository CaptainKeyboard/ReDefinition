// ReDefinition Atmospheres: Eve. Clouds only: a hot, dense air in which nothing falls to the ground and nothing lies on it.
// The pack's two layers on Eve (Eve-clouds1 with the types Floor and Pillar, Eve-clouds2 with Stratus and two unnamed types) both
// have a coverage map and a type map, and Eve-clouds2 holds a type of the stratus list, so the role discovery would take it: the
// node therefore sets discover = Off, EVE draws the pack's layers as the pack configured them and nothing is painted into them. The
// clouds our field gives the body are our own (the discovery finds no layer, so the effective cloudSource is ReDefinition). The pack has no
// particle field for Eve, and this file declares none. No cover node: with a precipitation type of None the body gets no ground cover.
REDEFINITION_BODY
{
	name = Eve
	enabled = true
	status = Auto

	PRECIP
	{
		TYPE
		{
			id = none
			kind = None
		}
	}

	CLOUDS
	{
		discover = Off
	}

	FROST
	{
		// The air is far above the freezing point everywhere: no frost on the camera.
		enabled = false
	}
}
