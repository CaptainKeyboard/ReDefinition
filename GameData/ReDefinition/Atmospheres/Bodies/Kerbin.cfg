// ReDefinition Atmospheres: the configuration of one body. A body without a node gets the generic default (the probes decide:
// atmosphere, surface, year, particle fields); a node only states what differs. The nodes are read after ModuleManager, so a patch
// changes them; there is no merge logic of our own. Example, a drier and warmer Kerbin:
//
//   @REDEFINITION_BODY[Kerbin]
//   {
//       @TEMPERATURE { @waterCelsius = 2 }
//       @PRECIP { @TYPE[snow] { @centreC = 2 } }
//       @SEASONS { @yearFactor = 0.5 }
//   }
//
// A node named * is the default for every body with an atmosphere that has no node of its own.
//
// Values marked [UNKNOWN] are starting values that the tuning of the weather simulation sets again.
REDEFINITION_BODY
{
	name = Kerbin
	enabled = true
	// Auto | Off | CoverOnly | Full. Auto: the probes decide (no atmosphere: Off, no surface: Off, outside the tested envelope: Broken).
	status = Auto

	SEASONS
	{
		// Orbit | Constant | None | Fixed (with phase)
		clock = Orbit
		// OrbitPeriod | ParentOrbitPeriod | Seconds (a moon follows its planet by default)
		yearSource = OrbitPeriod
		yearFactor = 1
		// The longest year in years of the home planet (0: no cap).
		yearCap = 3
		// Auto | None | degrees. Auto reads the rotation axis; an add-on that tilts the body shows there.
		tilt = Auto
		// The southern year against the northern one, as a share of the year.
		hemispherePhaseOffset = 0.5
		eccentricitySeason = false
	}

	TEMPERATURE
	{
		// Game: the target is sampled from the game's own air temperature.
		source = Game
		waterCelsius = 0
		wetBulbOffsetK = 0.7
		swing = Auto
		// A TARGET node replaces the sampled target: key0 = altitudeM temperatureK, key1 = ...
	}

	PRECIP
	{
		// The wet-bulb temperature in the centre: rain above, snow below.
		TYPE
		{
			id = snow
			kind = Snow
			centreC = 1.0
			widthC = 1.0
			coldSide = true
			field = snow-Kerbin
			look = SnowLook
		}
		TYPE
		{
			id = rain
			kind = Rain
			centreC = 1.0
			widthC = 1.0
			coldSide = false
			field = rain-Kerbin
			look = RainLook
		}
	}

	COVER
	{
		id = snow
		kind = Snow
		colour = 0.93, 0.95, 0.98
		roughness = 0.8
		// [UNKNOWN] the depth of a full cover
		maxDepthM = 0.5
		minLat = -90
		maxLat = 90
		maxSlope = 60
		noWater = true
		tracks = true
		tracksTauHours = 3
		driftAmount = 0.3
		driftStretch = 4
	}

	ICE
	{
		// Sub-grid look only: the freezing itself is the weather field's.
		floeSizeKm = 3
		leadFraction = 0.08
		roughness = 0.6
		permanent = false
		liquid = true
	}

	CELLS
	{
		// The fallback generator, used only when the simulation is not.
		sectorLengthKm = 100
		radiusMinKm = 5
		radiusMaxKm = 25
		driftMinMs = 1.5
		driftMaxMs = 4
		driftDeg = 90
		slotBodyDays = 4
		gate = Winter
		BAND
		{
			// [UNKNOWN] the bands
			id = polar
			fromLat = 55
			toLat = 90
			chance = 1.0
			types = Snow
		}
		BAND
		{
			id = temperate
			fromLat = 25
			toLat = 55
			chance = 0.6
			types = Snow, Rain
		}
	}

	SIM
	{
		gridLat = 64
		gridLon = 128
		levels = 16
		stepSeconds = 3600
		epochSteps = 666
		seaHeatCapacity = 1
		freezingPointC = 0
	}

	CLOUDS
	{
		// cloudSource = Ours | Eve | Both | None; absent: the player's setting decides.
		discover = Auto
		baseLayer = Kerbin-base-layer
		weatherLayers = Kerbin-Weather-1, Kerbin-weather-2
		snowTypeNames = Polar-snow, Snow
		stratusTypeNames = Stratus
	}

	LOOK
	{
		// visibilityMinM: the shortest visibility in the heaviest weather.
		visibilityMinM = 60
	}

	WIND
	{
		// [UNKNOWN] the strongest ordinary wind and a violent one, in m/s
		maxWind = 12
		violent = 25
		windOnLanded = true
		// The share of the wind at the ground and the height at which it is full.
		groundFactor = 0.1
		fullHeightM = 50
	}

	GAMEPLAY
	{
		solarLoss = 1
	}

	AURORA
	{
		enabled = false
	}

	LIGHT_MEDIUM
	{
		density = 1
	}

	FROST
	{
		enabled = true
		maxTemperatureK = 268
		strength = 1
	}

	FORECAST
	{
		stepSeconds = 3600
		horizonHours = 24
	}
}
