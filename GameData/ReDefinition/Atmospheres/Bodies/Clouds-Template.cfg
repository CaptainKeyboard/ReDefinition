// ReDefinition Atmospheres: the default layer set of the own cloud system (E40 Q8a). A body whose CLOUDS node has no LAYER node of its own (and no
// layers = none) draws this set, sized to the body: every height and every length is in depths of the body's troposphere (the GENERATOR's tropopauseM, else
// tropopauseDepthShare x the atmosphere's depth), so the same set fits a thin atmosphere and a deep one. Read by BodyRuleReaders.CloudLayers through
// CloudLayerTemplate.
//
// The numbers are Kerbin's authored set (Bodies/Clouds-Kerbin.cfg, which explains each of them) with its lengths divided by Kerbin's troposphere of 10.5 km;
// a test holds the two together. Kerbin keeps its own set: an authored set always wins.
//   innerDepths / outerDepths: the layer's altitudes in troposphere depths (instead of innerAltitudeM / outerAltitudeM);
//   noiseScaleDepths: the cell of the shape noise's finest octave in depths (instead of noiseScaleM);
//   lightCellWidthDepths: the cell width of the sun's diffusion in depths (instead of lightCellWidth);
//   cellPitchDepths: the pitch of the single clouds' lattice in depths (instead of cellPitch); cellBand stays in m (the outline's sharpness, not a size of the weather).
//   needs = liquid | ice: the layer exists only where the body's troposphere has a height where liquid water clouds form (between water's freezing point
//   - 40 K and its boiling point) or where ice forms (below the freezing point); a layer without the key always exists.
// Everything else is already relative: type bases and tops in shares of the layer, MESO and type patch sizes in troposphere depths or in the body's system
// wavelength, CLIMATE latitudes in the body's circulation cells; sigmaPerM and the light keys are the optics of water droplets and ice crystals.
//
// A body can opt out (CLOUDS { layers = none }), pick another template (layerTemplate = <name>), or change single layers of this one:
//   CLOUDS { layers = template  LAYER { name = cirrus  enabled = false }  LAYER { name = cumulus  sigmaPerM = 0.03 } }
// (a key replaces the template's, a TYPE replaces the template's TYPE of the same name, a MESO the template's MESO, enabled = false drops a layer or a type).
