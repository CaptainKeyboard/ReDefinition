// ReDefinition Atmospheres: the layer set of the own cloud system on Kerbin (package T10). A ModuleManager patch that adds LAYER nodes to the
// CLOUDS node of the body node in Kerbin.cfg; the other bodies follow with package E41. Read by BodyRuleReaders.CloudLayers.
//
// The values are our own, authored from real cloud physics, not from any pack:
//   Bases and tops: the WMO cloud classification (International Cloud Atlas) for the low (surface to 2 km), middle (2 to 7 km) and high
//   (5 to 13 km) levels. Stratus and fog lie below 2 km; cumulus humilis and mediocris have their base near 1 to 2 km and tops at 2 to
//   4 km; cumulus congestus reaches 5 to 8 km; cumulonimbus has its base below 2 km and reaches the tropopause (about 11 km); cirrus lies
//   at 8 to 12 km. The cumulus family and the cumulonimbus layer start at 1.7 km, the weather deck reaches 2.1 km.
//   Extinction at full density (sigmaPerM): liquid water clouds have an extinction of 0.02 to 0.1 per m (liquid water content 0.1 to
//   0.5 g per m3, droplet radius 8 to 10 um: sigma = 3 LWC / (2 rho_water r)), which gives vertical optical depths of 10 to 50 for a
//   stratus of 500 m, 20 to 250 for cumulus towers and 100 to 600 for cumulonimbus; the visibility in fog is 3.9 / sigma; ice clouds
//   (cirrus) have an optical depth of 0.03 to 3, here 0.3 for 1.6 km, sigma = 2e-4 per m.
//
// Five layers are designed for four visible at once: Kerbin-weather-rain and Kerbin-weather-snow share the group "weather" (the weather
// shows the one that fits the precipitation type of the place); the cumulus layer, the cumulonimbus layer and the cirrus layer are
// always candidates. A group member is chosen by CloudLayerSet.Select.
//
// coverage and noiseAmount are starting values [UNKNOWN] that the integration package (T09) tunes against the generator's maps; the
// profile keys are 'height density' pairs over the type's own height (0 at its base, 1 at its top).
@REDEFINITION_BODY[Kerbin]
{
	@CLOUDS
	{
		// The low weather deck of rain, thunder and fog, from the ground to 2.1 km (stratus, nimbostratus, fog).
		LAYER
		{
			name = Kerbin-weather-rain
			group = weather
			innerAltitudeM = 0
			outerAltitudeM = 2100
			sigmaPerM = 0.045
			kind = Weather
			coverage = 0.5
			edgeSoftness = 0.2
			shadowStrength = 1
			noiseAmount = 0.3
			noiseScaleM = 10000
			// The soft water content (E40 soft density): softnessScale is the factor on the owner's cloud softness (1: the setting itself), waterPower the exponent of the
			// water content in the density. Per type: baseGain / riseShare (the rise of the density with the height in the cloud) and densityScale (a factor on the type's
			// density, 1: none). [UNKNOWN] starting values; the weather deck is softer and flatter than a cumulus.
			softnessScale = 1.5
			waterPower = 2
			// The light response of the layer (E40 B3; factors on the global fit, 1 = none): lightMs the multiple-scattering brightness, lightPowder the darkening of thin edges,
			// lightAmbient the sky's fill. A stratus deck is flat and grey with a dark base: little multiple scattering, a weak sky fill. [UNKNOWN] starting values, judged on pictures.
			lightMs = 0.8
			lightPowder = 1
			lightAmbient = 0.75
				// What may draw this deck (WeatherDeckRule, E40): precipitation (level from 0.04 = the end of the band None, full from 0.20 = Light) draws Stratus
				// (type 0.5) and, as the level rises, Nimbostratus (type = level); fog draws only where the surface air is near saturation (dew-point spread within
				// 2.8 K = the aviation rule of thumb of 5 F, half width 1 K) and the wind is light; in fair weather the deck draws nothing and the cumulus layer
				// makes the sky. [UNKNOWN] starting values: deckFogSpreadBandK, deckFogWindMs, deckFogWindBandMs (fog needs light wind; advection fog a few m/s).
				// cloud.deckRule.Kerbin-weather-rain 0 gives the old rule back (type = precipitation level, the deck draws wherever its map passes).
				// deckRainFloor: wherever it rains the deck is at least this thick (reached at level 0.08), so that no rain falls from a clear sky.
				deckRule = 1
				deckRainFloor = 0.9
				deckFogSpreadK = 2.8
				deckFogSpreadBandK = 1
				deckFogWindMs = 5
				deckFogWindBandMs = 2
				deckPrecipFrom = 0.04
				deckPrecipFullAt = 0.2
				deckFogType = 0
				deckPrecipType = 0.5
			// Ground fog: a thin deck on the ground, visibility about 100 m at full density (3.9 / 0.045 / 0.9).
			TYPE
			{
				name = Fog
				baseShare = 0
				topShare = 0.1
				erosion = 0.2
				baseGain = 0.7
				densityScale = 1
				PROFILE
				{
					key0 = 0 0.9
					key1 = 0.7 0.5
					key2 = 1 0
				}
			}
			// Stratus: a flat grey deck of a few hundred metres, flat base, soft top.
			TYPE
			{
				name = Stratus
				// The light by height (E40 B3; factors on the direct light and on the sky's fill at the base and at the top, smooth between): a flat grey deck with a dark base, low contrast.
				baseLight = 0.7
				headLight = 0.9
				baseAmbient = 0.8
				headAmbient = 0.9
				baseShare = 0.1
				topShare = 0.5
				erosion = 0.15
				baseGain = 0.7
				// Full-column optical depth 5 (E40 B3, fitted to 0.045 x 840 m x 0.6 x 0.22): thin stratus lies at 0.5 to 5 (ISCCP, Rossow and Schiffer 1999: tau below 3.6 is thin cloud, the
				// disc of the sun still shows as a bright patch through tau 3 to 5); the rim of the soft cloud thins out to under 1.
				densityScale = 0.22
				PROFILE
				{
					key0 = 0 0
					key1 = 0.12 0.8
					key2 = 0.5 1
					key3 = 0.85 0.7
					key4 = 1 0
				}
			}
			// Nimbostratus: thick, dark, with rain beneath it, from near the ground to the top of the deck.
			TYPE
			{
				name = Nimbostratus
				// Thick and dark: the base is the darkest part of any rain deck (the pictures of e40-ty showed 0.5 / 0.7 nearly black).
				baseLight = 0.65
				headLight = 0.85
				baseAmbient = 0.8
				headAmbient = 0.9
				baseShare = 0.05
				topShare = 1
				erosion = 0.2
				baseGain = 0.7
				densityScale = 1
				PROFILE
				{
					key0 = 0 0.1
					key1 = 0.08 0.9
					key2 = 0.6 1
					key3 = 0.9 0.6
					key4 = 1 0
				}
			}
		}

		// The same deck for snow and cold: polar fog, stratus and a snow-bearing nimbostratus. It never shows with the rain deck.
		LAYER
		{
			name = Kerbin-weather-snow
			group = weather
			innerAltitudeM = 0
			outerAltitudeM = 2100
			sigmaPerM = 0.04
			kind = Weather
			coverage = 0.5
			edgeSoftness = 0.25
			shadowStrength = 1
			noiseAmount = 0.25
			noiseScaleM = 12000
			softnessScale = 1.5
			waterPower = 2
			lightMs = 0.8
			lightPowder = 1
			lightAmbient = 0.85
				// The same rule as the rain deck (polar fog, snow stratus, snow nimbus); see there.
				deckRule = 1
				deckRainFloor = 0.9
				deckFogSpreadK = 2.8
				deckFogSpreadBandK = 1
				deckFogWindMs = 5
				deckFogWindBandMs = 2
				deckPrecipFrom = 0.04
				deckPrecipFullAt = 0.2
				deckFogType = 0
				deckPrecipType = 0.5
			TYPE
			{
				name = Polar fog
				baseShare = 0
				topShare = 0.12
				erosion = 0.15
				baseGain = 0.7
				densityScale = 1
				PROFILE
				{
					key0 = 0 0.8
					key1 = 0.7 0.5
					key2 = 1 0
				}
			}
			TYPE
			{
				name = Snow stratus
				baseLight = 0.7
				headLight = 0.9
				baseAmbient = 0.85
				headAmbient = 0.95
				baseShare = 0.1
				topShare = 0.6
				erosion = 0.15
				baseGain = 0.7
				// Full-column optical depth about 5, as the rain deck's Stratus (0.04 x 1050 m x 0.6 x 0.2).
				densityScale = 0.2
				PROFILE
				{
					key0 = 0 0
					key1 = 0.15 0.8
					key2 = 0.55 1
					key3 = 0.9 0.6
					key4 = 1 0
				}
			}
			TYPE
			{
				name = Snow nimbus
				baseLight = 0.55
				headLight = 0.85
				baseAmbient = 0.75
				headAmbient = 0.95
				baseShare = 0.05
				topShare = 1
				erosion = 0.2
				baseGain = 0.7
				densityScale = 1
				PROFILE
				{
					key0 = 0 0.15
					key1 = 0.1 0.9
					key2 = 0.65 1
					key3 = 0.92 0.5
					key4 = 1 0
				}
			}
		}

		// The cumulus family from a base of 1.7 km to the tops of congestus at 7.4 km, and altocumulus in the middle level.
		LAYER
		{
			name = Kerbin-cumulus
			innerAltitudeM = 1700
			outerAltitudeM = 7400
			sigmaPerM = 0.05
			kind = Weather
			coverage = 0.35
			edgeSoftness = 0.15
			shadowStrength = 1
			// noiseScaleM is the cell of the shape volume's FINEST octave: the volume repeats after 16 of them and its strongest octave has two cells
			// per period (NoiseModel), so the cloud bodies are 4 to 8 times this number wide. 500 m gives cells of 2 to 4 km, the size of a
			// stratocumulus or cumulus field; the 5000 m this layer had gave bodies of 20 to 40 km in a layer 0.6 to 1.2 km thick, a sheet.
			// noiseAmount 1 lets the noise decide where a cloud stands and the map how much of the sky they fill (the share is map + coverage - 0.5);
			// at 0.35 the map alone closed the sky above 0.83 and emptied it below 0.47. Measured by the player series e40-fl.
			noiseAmount = 1
			noiseScaleM = 500
			softnessScale = 1
			waterPower = 2
			// Cumulus: the global fit (the multiple scattering of the bright heads and the powder darkening of the thin rim are what a cumulus has); the shaded base and the
			// bright head are per type (baseLight, headLight).
			lightMs = 1
			lightPowder = 1
			lightAmbient = 1
			// Which type shows where (E40 B3, L2 D1): the type value of the layer is its precipitation level (the generator's), and the table's first type is stratocumulus, so every fair day showed
			// stratocumulus. fairType is the type at no precipitation (0.5 = Cumulus humilis, the fair-weather cumulus); the type runs in a line from there to the last type at full precipitation
			// (light rain: between humilis and mediocris, moderate: mediocris, heavy: congestus). The altocumulus sheet is the second type, next to humilis, because the type map is filtered
			// between texels and a sheet beside humilis must not pass through the towers on its way: it is not a precipitation cloud, a rule picks it. Where the generator makes more cloud at
			// the sheet's height (5.2 km) than at humilis' height (2.3 km), by altoFrom to altoFullAt of the map value, the type map shows the sheet (0.25 = Altocumulus) instead.
			fairType = 0.5
			altoType = 0.25
			altoFrom = 0.05
			altoFullAt = 0.3
			// Stratocumulus: a low, lumpy sheet, tops at 2.3 km.
			TYPE
			{
				name = Stratocumulus
				// The light by height (E40 B3): a mild shade at the flat base, a slightly brighter top.
				baseLight = 0.8
				headLight = 1.1
				baseAmbient = 0.9
				headAmbient = 1
				baseShare = 0
				topShare = 0.11
				erosion = 0.3
				// Full-column optical depth 13 (0.05 x 627 m x 0.6 x 0.7): stratocumulus lies at 5 to 20 (ISCCP: tau 3.6 to 23 is the medium class, Rossow and Schiffer 1999; field
				// campaigns find a mean of about 10 to 15). The rest of the cumulus family is scaled by the same 0.7, congestus is left dense.
				densityScale = 0.7
				PROFILE
				{
					key0 = 0 0
					key1 = 0.15 0.9
					key2 = 0.6 1
					key3 = 1 0
				}
				// A flat base and a slightly lumpy top: the outline is the same from the base to half the height, then narrows a little.
				LIFT
				{
					key0 = 0 0
					key1 = 0.5 0
					key2 = 1 0.1
				}
			}
			// Altocumulus: a thin lumpy sheet in the middle level, 4.8 to 5.6 km.
			TYPE
			{
				name = Altocumulus
				baseShare = 0.54
				topShare = 0.68
				erosion = 0.4
				// Full-column optical depth 11 (0.05 x 800 m x 0.6 x 0.45): altocumulus is a translucent sheet, tau 3 to 12 (ISCCP medium class), the sun's disc shows through it.
				densityScale = 0.45
				PROFILE
				{
					key0 = 0 0
					key1 = 0.2 0.9
					key2 = 0.7 0.8
					key3 = 1 0
				}
				// Cells with gaps rather than a plate: the lift is small and lets the tops narrow.
				LIFT
				{
					key0 = 0 0
					key1 = 0.4 0
					key2 = 1 0.1
				}
			}
			// Cumulus humilis: fair-weather puffs, tops at 2.9 km.
			TYPE
			{
				name = Cumulus humilis
				// Hard-lit bright heads over a shaded flat base.
				baseLight = 0.75
				headLight = 1.25
				baseAmbient = 0.9
				headAmbient = 1
				baseShare = 0
				topShare = 0.21
				erosion = 0.45
				// Full-column optical depth 25: the centre of a fair-weather cumulus lies at 10 to 40 (liquid water path 50 to 300 g per m2, Rossow and Schiffer 1999), the soft rim
				// thins through 1 to 5 over the outer 0.2 of the water content.
				densityScale = 0.7
				PROFILE
				{
					key0 = 0 0
					key1 = 0.08 0.9
					key2 = 0.55 1
					key3 = 0.9 0.5
					key4 = 1 0
				}
				// A flat wide base, a domed top: the lift (in map units) is 0 over the lower third and grows to the top, so the heads are narrower than the base.
				LIFT
				{
					key0 = 0 0
					key1 = 0.3 0
					key2 = 0.7 0.08
					key3 = 1 0.2
				}
			}
			// Cumulus mediocris: tops at 4.4 km.
			TYPE
			{
				name = Cumulus mediocris
				baseLight = 0.7
				headLight = 1.25
				baseAmbient = 0.85
				headAmbient = 1
				baseShare = 0
				topShare = 0.47
				erosion = 0.5
				// Full-column optical depth 56: a growing cumulus is opaque in its core, as its towers (tau 50 to 100).
				densityScale = 0.7
				PROFILE
				{
					key0 = 0 0
					key1 = 0.06 0.9
					key2 = 0.5 1
					key3 = 0.85 0.6
					key4 = 1 0
				}
				// A cauliflower: the outline narrows from the lower quarter up, the towers are separate near the top.
				LIFT
				{
					key0 = 0 0
					key1 = 0.2 0
					key2 = 0.6 0.12
					key3 = 1 0.3
				}
			}
			// Cumulus congestus: towers to 7.4 km, the top of the layer.
			TYPE
			{
				name = Cumulus congestus
				baseLight = 0.65
				headLight = 1.25
				baseAmbient = 0.8
				headAmbient = 1
				baseShare = 0
				topShare = 1
				erosion = 0.55
				// Full-column optical depth 171, opaque (deep convective towers: tau above 100, ISCCP class "deep convection" starts at 23).
				densityScale = 1
				PROFILE
				{
					key0 = 0 0
					key1 = 0.04 0.9
					key2 = 0.45 1
					key3 = 0.8 0.7
					key4 = 1 0
				}
				// Towers: a wide cloud base, the lift grows fast so that the cores stand apart over the upper two thirds.
				LIFT
				{
					key0 = 0 0
					key1 = 0.15 0
					key2 = 0.5 0.15
					key3 = 1 0.38
				}
			}
		}

		// Cumulonimbus: base at 1.7 km, tops at the tropopause (11 km). Rare in the map, thick, the anvil spreads in the top third.
		LAYER
		{
			name = Kerbin-cumulonimbus
			innerAltitudeM = 1700
			outerAltitudeM = 11000
			sigmaPerM = 0.08
			kind = Weather
			coverage = 0.12
			edgeSoftness = 0.1
			shadowStrength = 1
			noiseAmount = 0.4
			noiseScaleM = 8000
			softnessScale = 1
			waterPower = 2
			// A storm cloud's base is dark: less sky fill than a fair-weather cumulus (the tower itself is lit like a cumulus).
			lightMs = 1
			lightPowder = 1
			lightAmbient = 0.8
				// A rain cloud is drawn only as far as it rains (WeatherDeckRule without fog and without a floor): the coverage is multiplied by the precipitation share (from level
				// 0.04, complete at 0.20), and the type value is the precipitation level (calvus below, incus above). The weather deck is what the rain itself guarantees.
				deckRule = 1
				deckFog = 0
				deckFogType = 0
				deckPrecipType = 0
				// Kept at 8000 m after the player series e40-fn (nadir view from 80 km, mean chord of the cloud along a row, 8 sites): where the map stands high (0.8) the
				// towers are 14 to 16 km wide at 8000 m (cumulonimbus cells are 10 to 30 km), 12 to 14 km at 5000 m, 7 to 9 km at 3000 m and 5 to 9 km at 1000 m; at the
				// map 0.66 and amount 0.4 only fragments of 1 to 2 km stand. A smaller scale makes smaller towers, not more cells of the right size.
			// Cumulonimbus calvus: a rounded top, no anvil yet, 8 km.
			TYPE
			{
				name = Cumulonimbus calvus
				// A dark rain-shaft base under a hard-lit white head.
				baseLight = 0.55
				headLight = 1.2
				baseAmbient = 0.7
				headAmbient = 1
				baseShare = 0
				topShare = 0.7
				erosion = 0.5
				riseShare = 0.3
				densityScale = 1
				PROFILE
				{
					key0 = 0 0.2
					key1 = 0.05 0.9
					key2 = 0.5 1
					key3 = 0.85 0.7
					key4 = 1 0
				}
				// A tower: the outline narrows from the base up to a round head.
				LIFT
				{
					key0 = 0 0
					key1 = 0.1 0
					key2 = 0.5 0.1
					key3 = 1 0.2
				}
			}
			// Cumulonimbus incus: the full anvil at the tropopause, wide and dense in the top third.
			TYPE
			{
				name = Cumulonimbus incus
				baseLight = 0.55
				headLight = 1.15
				baseAmbient = 0.7
				headAmbient = 1.05
				baseShare = 0
				topShare = 1
				erosion = 0.5
				riseShare = 0.3
				densityScale = 1
				PROFILE
				{
					key0 = 0 0.2
					key1 = 0.05 0.8
					key2 = 0.4 0.9
					key3 = 0.7 1
					key4 = 0.88 0.8
					key5 = 1 0
				}
				// A tower under a wide anvil: the lift narrows the stem over the lower two thirds and is gone at the top, where the cloud stands as wide as the map says.
				LIFT
				{
					key0 = 0 0
					key1 = 0.1 0
					key2 = 0.45 0.2
					key3 = 0.7 0.2
					key4 = 0.9 0
					key5 = 1 0
				}
			}
		}

		// Cirrus: ice crystals at 9 to 11 km, thin, a vertical optical depth of 0.3. Lit by the sky and one sun tap.
		LAYER
		{
			name = Kerbin-cirrus
			innerAltitudeM = 9000
			outerAltitudeM = 11000
			sigmaPerM = 0.0002
			kind = Cheap
			coverage = 0.3
			edgeSoftness = 0.35
			shadowStrength = 0.15
			noiseAmount = 0.5
			noiseScaleM = 3000
			// Fibres: the noise features are this many times longer along the planet's axis than across it (cirrus streaks along the flow, hooks and veils; 1 is isotropic).
			fibreStretch = 6
			// Thin sheets have no core: the water content enters the density linearly.
			softnessScale = 2
			waterPower = 1
			// Ice cloud is bright: the sky's fill (the only light term of a Cheap layer that this factor reaches) is raised.
			lightMs = 1
			lightPowder = 1
			lightAmbient = 1.3
			TYPE
			{
				name = Cirrus
				// Bright and thin: the sun reaches every part of it.
				baseLight = 1
				headLight = 1.15
				baseShare = 0.1
				topShare = 0.9
				erosion = 0.7
				// Full-column optical depth 0.5: visible cirrus lies at 0.03 to 3 (thin cirrus 0.03 to 0.3, opaque cirrus 0.3 to 3; Sassen and Cho 1992), most of the sky seen through it.
				densityScale = 2.5
				PROFILE
				{
					key0 = 0 0
					key1 = 0.35 0.9
					key2 = 0.65 0.8
					key3 = 1 0
				}
			}
			TYPE
			{
				name = Cirrostratus
				baseShare = 0.2
				topShare = 0.8
				erosion = 0.3
				// Full-column optical depth 0.4: a veil (cirrostratus) is 0.3 to 3 and still shows the sun with a halo; 0.4 is its thin end.
				densityScale = 4
				PROFILE
				{
					key0 = 0 0
					key1 = 0.3 0.7
					key2 = 0.7 0.7
					key3 = 1 0
				}
			}
		}
	}
}
