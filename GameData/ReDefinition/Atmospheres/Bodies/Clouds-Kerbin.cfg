// ReDefinition Atmospheres: the layer set of the own cloud system on Kerbin (package T10). A ModuleManager patch that adds LAYER nodes to the
// CLOUDS node of the body node in Kerbin.cfg; the other bodies follow with package E41. Read by BodyRuleReaders.CloudLayers.
//
// The values are our own, authored from real cloud physics, not from any pack:
//   Bases and tops: the WMO cloud classification (International Cloud Atlas) for the low (surface to 2 km), middle (2 to 7 km) and high
//   (5 to 13 km) levels. Stratus and fog lie below 2 km; cumulus humilis and mediocris have their base near 1 to 2 km and tops at 2 to
//   4 km; cumulus congestus reaches 5 to 8 km; cumulonimbus has its base below 2 km and reaches the tropopause (about 11 km); cirrus lies
//   at 8 to 12 km. The cumulus family and the cumulonimbus layer start at 1.7 km, the weather deck reaches 2.1 km.
//   Extinction at full density (sigmaPerM): liquid water clouds have an extinction of 0.02 to 0.1 per m (liquid water content 0.1 to
//   0.5 g per m3, droplet radius 8 to 10 um: sigma = 3 LWC / (2 rho_water r)), which gives vertical optical depths of 10 to 50 for a
//   stratus of 500 m, 20 to 250 for cumulus towers and 100 to 600 for cumulonimbus; the visibility in fog is 3.9 / sigma; ice clouds
//   (cirrus) have an optical depth of 0.03 to 3, here 0.3 for 1.6 km, sigma = 2e-4 per m.
//
// Five layers are designed for four visible at once: Kerbin-weather-rain and Kerbin-weather-snow share the group "weather" (the weather
// shows the one that fits the precipitation type of the place); the cumulus layer, the cumulonimbus layer and the cirrus layer are
// always candidates. A group member is chosen by CloudLayerSet.Select.
//
// coverage and noiseAmount are starting values [UNKNOWN] that the integration package (T09) tunes against the generator's maps; the
// profile keys are 'height density' pairs over the type's own height (0 at its base, 1 at its top).
@REDEFINITION_BODY[Kerbin]
{
	@CLOUDS
	{
		// The low weather deck of rain, thunder and fog, from the ground to 2.1 km (stratus, nimbostratus, fog).
		LAYER
		{
			name = Kerbin-weather-rain
			// The sky's light inside the clouds of every lit layer (E40 L6 light): the sky's source at a sample gets ambientMs / (1 + ambientDecay tau) more, tau the optical depth to the cloud's
			// top. ambientDecay 0.11 = the two-stream 0.75 (1 - g) of water droplets (g 0.85); ambientMs 3.5 = the multiple scattering's amplification of a source at the surface (the sun's light
			// has 3.97 from its octaves), taken so that a thick slab's top returns 0.9 to 1.0 of the two-stream reflection of the sky and its base 0.8 to 0.9 of the transmission
			// (light_slab_check.py table). 0 = the sky's light stops at the first optical depth (a sunlit cloud top then had 0.04 of a white card's radiance from the sky, the two-stream 0.30).
			ambientMs = 3.5
			ambientDecay = 0.11
			group = weather
			innerAltitudeM = 0
			outerAltitudeM = 2100
			sigmaPerM = 0.045
			kind = Weather
			coverage = 0.5
			edgeSoftness = 0.2
			shadowStrength = 1
			noiseAmount = 0.3
			noiseScaleM = 10000
			// A frontal deck follows its weather system (E40 L5 maps): breaks between the systems and ragged edges, the pattern's cell scaleSystems times the shortest wavelength of the body's
			// systems; rainKeep holds the cover from rainKeepFrom to rainKeepFullAt (the precipitation level), so the heavy-rain core stays closed.
			MESO
			{
				scaleSystems = 0.6
				octaves = 2
				amount = 1
				edge = 0.5
				shoulder = 3
				cells = 1
				stretch = 1
				rainKeep = 0.8
				rainKeepFrom = 0.4
				rainKeepFullAt = 0.8
				// Where it rains the pattern never leaves a clear sky: at least rainMin (below one half: no field) from rainMinFrom to rainMinFullAt (precipitation level).
				rainMin = 0.45
				rainMinFrom = 0.04
				rainMinFullAt = 0.08
				scatter = 1
				scatterDepths = 3
			}
			// The soft water content (E40 soft density): softnessScale is the factor on the owner's cloud softness (1: the setting itself), waterPower the exponent of the
			// water content in the density. Per type: baseGain / riseShare (the rise of the density with the height in the cloud) and densityScale (a factor on the type's
			// density, 1: none). [UNKNOWN] starting values; the weather deck is softer and flatter than a cumulus.
			softnessScale = 1.5
			waterPower = 2
			// The light response of the layer (lightAmbient, 1 = none): the deck has none. Its base is on the two-stream anchor (tools/weather_metrics/light_slab_check.py types:
			// stratus 1.01, nimbostratus 0.93 of it), so the model needs no factor there.
				// What may draw this deck (WeatherDeckRule, E40): precipitation (level from 0.04 = the end of the band None, full from 0.20 = Light) draws Stratus
				// (type 0.5) and, as the level rises, Nimbostratus (type = level); fog draws only where the surface air is near saturation (dew-point spread within
				// 2.8 K = the aviation rule of thumb of 5 F, half width 1 K) and the wind is light; in fair weather the deck draws nothing and the cumulus layer
				// makes the sky. [UNKNOWN] starting values: deckFogSpreadBandK, deckFogWindMs, deckFogWindBandMs (fog needs light wind; advection fog a few m/s).
				// cloud.deckRule.Kerbin-weather-rain 0 gives the old rule back (type = precipitation level, the deck draws wherever its map passes).
				// deckRainFloor: wherever it rains the deck is at least this thick (reached at level 0.08), so that no rain falls from a clear sky.
				deckRule = 1
				deckRainFloor = 0.9
				deckRainFloorFullAt = 0.7
				deckFogSpreadK = 2.8
				deckFogSpreadBandK = 1
				deckFogWindMs = 5
				deckFogWindBandMs = 2
				deckPrecipFrom = 0.04
				deckPrecipFullAt = 0.2
				deckFogType = 0
				deckPrecipType = 0.5
			// Ground fog: a thin deck on the ground, visibility about 100 m at full density (3.9 / 0.045 / 0.9).
			TYPE
			{
				name = Fog
				baseShare = 0
				topShare = 0.1
				erosion = 0.2
				baseGain = 0.7
				densityScale = 1
				PROFILE
				{
					key0 = 0 0.9
					key1 = 0.7 0.5
					key2 = 1 0
				}
			}
			// Stratus: a flat grey deck of a few hundred metres, flat base, soft top.
			TYPE
			{
				name = Stratus
				baseShare = 0.1
				topShare = 0.5
				erosion = 0.15
				baseGain = 0.7
				// Full-column optical depth 5 (E40 B3, fitted to 0.045 x 840 m x 0.6 x 0.22): thin stratus lies at 0.5 to 5 (ISCCP, Rossow and Schiffer 1999: tau below 3.6 is thin cloud, the
				// disc of the sun still shows as a bright patch through tau 3 to 5); the rim of the soft cloud thins out to under 1.
				densityScale = 0.22
				PROFILE
				{
					key0 = 0 0
					key1 = 0.12 0.8
					key2 = 0.5 1
					key3 = 0.85 0.7
					key4 = 1 0
				}
			}
			// Nimbostratus: thick, dark, with rain beneath it, from near the ground to the top of the deck.
			TYPE
			{
				name = Nimbostratus
				// Thick and dark by its optical depth alone (66): the base is 0.11 of a white card, the two-stream anchor 0.09.
				baseShare = 0.05
				topShare = 1
				erosion = 0.2
				baseGain = 0.7
				densityScale = 1
				PROFILE
				{
					key0 = 0 0.1
					key1 = 0.08 0.9
					key2 = 0.6 1
					key3 = 0.9 0.6
					key4 = 1 0
				}
			}
		}

		// The same deck for snow and cold: polar fog, stratus and a snow-bearing nimbostratus. It never shows with the rain deck.
		LAYER
		{
			name = Kerbin-weather-snow
			ambientMs = 3.5
			ambientDecay = 0.11
			group = weather
			innerAltitudeM = 0
			outerAltitudeM = 2100
			sigmaPerM = 0.04
			kind = Weather
			coverage = 0.5
			edgeSoftness = 0.25
			shadowStrength = 1
			noiseAmount = 0.25
			noiseScaleM = 12000
			// The same pattern as the rain deck (see there).
			MESO
			{
				scaleSystems = 0.6
				octaves = 2
				amount = 1
				edge = 0.5
				shoulder = 3
				cells = 1
				stretch = 1
				rainKeep = 0.8
				rainKeepFrom = 0.4
				rainKeepFullAt = 0.8
				// Where it rains the pattern never leaves a clear sky: at least rainMin (below one half: no field) from rainMinFrom to rainMinFullAt (precipitation level).
				rainMin = 0.45
				rainMinFrom = 0.04
				rainMinFullAt = 0.08
				scatter = 1
				scatterDepths = 3
			}
			softnessScale = 1.5
			waterPower = 2
				// The same rule as the rain deck (polar fog, snow stratus, snow nimbus); see there.
				deckRule = 1
				deckRainFloor = 0.9
				deckRainFloorFullAt = 0.7
				deckFogSpreadK = 2.8
				deckFogSpreadBandK = 1
				deckFogWindMs = 5
				deckFogWindBandMs = 2
				deckPrecipFrom = 0.04
				deckPrecipFullAt = 0.2
				deckFogType = 0
				deckPrecipType = 0.5
			TYPE
			{
				name = Polar fog
				baseShare = 0
				topShare = 0.12
				erosion = 0.15
				baseGain = 0.7
				densityScale = 1
				PROFILE
				{
					key0 = 0 0.8
					key1 = 0.7 0.5
					key2 = 1 0
				}
			}
			TYPE
			{
				name = Snow stratus
				baseShare = 0.1
				topShare = 0.6
				erosion = 0.15
				baseGain = 0.7
				// Full-column optical depth about 5, as the rain deck's Stratus (0.04 x 1050 m x 0.6 x 0.2).
				densityScale = 0.2
				PROFILE
				{
					key0 = 0 0
					key1 = 0.15 0.8
					key2 = 0.55 1
					key3 = 0.9 0.6
					key4 = 1 0
				}
			}
			TYPE
			{
				name = Snow nimbus
				baseShare = 0.05
				topShare = 1
				erosion = 0.2
				baseGain = 0.7
				densityScale = 1
				PROFILE
				{
					key0 = 0 0.15
					key1 = 0.1 0.9
					key2 = 0.65 1
					key3 = 0.92 0.5
					key4 = 1 0
				}
			}
		}

		// The cumulus family from a base of 1.7 km to the tops of congestus at 7.4 km, and altocumulus in the middle level.
		LAYER
		{
			name = Kerbin-cumulus
			ambientMs = 3.5
			ambientDecay = 0.11
			innerAltitudeM = 1700
			outerAltitudeM = 7400
			sigmaPerM = 0.05
			kind = Weather
			coverage = 0.35
			edgeSoftness = 0.15
			shadowStrength = 1
			// noiseScaleM is the cell of the shape volume's FINEST octave: the volume repeats after 16 of them and its strongest octave has two cells
			// per period (NoiseModel), so the cloud bodies are 4 to 8 times this number wide. 500 m gives cells of 2 to 4 km, the size of a
			// stratocumulus or cumulus field; the 5000 m this layer had gave bodies of 20 to 40 km in a layer 0.6 to 1.2 km thick, a sheet.
			// noiseAmount 1 lets the noise decide where a cloud stands and the map how much of the sky they fill (the share is map + coverage - 0.5);
			// at 0.35 the map alone closed the sky above 0.83 and emptied it below 0.47. Measured by the player series e40-fl.
			noiseAmount = 1
			noiseScaleM = 500
			// A convective cloud is a column: the air that rises in a cell is the same over the cloud's depth. With the noise as unrelated at every height as across (1), a cloud is a
			// blob at a random height, the tops are slivers and the bases are not under the heads (E40 L5 shape: CPU slices of the shape model and the type sheets). 0.5 makes the
			// features twice as long in the vertical, so a cell is one body from the base to its top, and the type's height-shaped threshold (LIFT) rounds it into a dome. 0.35 made
			// congestus pillars 5 km tall and 2 km wide with vertical flutes (type sheet, player).
			verticalScale = 0.5
			softnessScale = 1
			waterPower = 2
			// Cumulus: the global fit (the multiple scattering of the bright heads and the powder darkening of the thin rim are what a cumulus has); the shaded base follows from
			// the model (light_slab_check.py types: within 10 % of the two-stream anchor to optical depth 60, then the ambient floor), only the heads of the thick types carry
			// a factor (headLight).
			lightAmbient = 1
			// Which type shows where (E40 L3): each type has a CLIMATE (its weight over latitude, surface, humidity and precipitation) and the type at a place is drawn from these weights by a noise
			// of patches typePatchDepths troposphere depths wide (6.7 depths: about 70 km on Kerbin, whose troposphere is 10.5 km deep), so a region where two or three types are likely shows all of them, side by side. The types stand in the order of the type axis: stratocumulus,
			// humilis, mediocris, congestus, and a transition between two patches walks that axis, so it passes no other type. The altocumulus sheet is the last type and not on that walk: a rule
			// picks it (a share, cut hard where it passes about one half). Where the generator makes more cloud at the sheet's height (5.2 km) than at humilis' height (2.3 km), by altoFrom
			// to altoFullAt of the map value, the type map shows the sheet (1 = Altocumulus). fairType and rainType are the type at no and at full precipitation of a layer WITHOUT CLIMATE nodes
			// (the old rule: a line from fairType to rainType over the precipitation level) and the type where no weight is left here. The x of a LATITUDE curve is the body's circulation
			// coordinate: 0 at the equator, 1/3 at the edge of the first circulation cell, 2/3 at the edge of the second, 1 at the pole (30 and 60 degrees on Kerbin, so the plain latitude / 90).
			fairType = 0.25
			rainType = 0.75
			altoType = 1
			altoFrom = 0.05
			altoFullAt = 0.3
			typePatchDepths = 6.7
			typePatchBlend = 0.06
			// The cover's fields and clear gaps (E40 L3): the generator's map has features of 300 km and more and the noise in the shader cells of 2 to 4 km (the layer pass reads the global
			// map of 512 x 256 texels, so nothing finer than about 3 texels can come from the map); MESO adds the band between with a pattern of cloud and gap whose share is the map value
			// (a region keeps its mean cover). scaleDepths is the coarsest cell of the noise in depths of the body's troposphere (the mesoscale organisation of convection scales with the
			// depth it fills; 5.25 depths are 55 km on Kerbin, 10.5 km deep) and each further octave halves it; scaleKm instead sets the size in km. cells = 1 makes the gaps a network of lanes,
			// so the cloud breaks into separate cells of about that size whatever the cover (cells = 0: blobs; a region above one half is one sheet with holes); edge is the width of a field's edge in noise-rank units,
			// shoulder the power of the ramp from gap to core (1: linear), amount how far the map is replaced (1: wholly), rainKeep the share of the map that stays where it rains.
			MESO
			{
				scaleDepths = 5.25
				octaves = 2
				amount = 1
				edge = 0.3
				shoulder = 1
				cells = 1
				stretch = 1
				rainKeep = 0
				// The edge of a field thins out into scattered small cells (scatter 1: wholly; the ramp's value is the density of cells, so the cover of a region is the ramp's); a cell of the
				// scatter noise is scatterDepths depths of the troposphere wide (3 depths: 31 km on Kerbin).
				scatter = 1
				scatterDepths = 3
			}
			// Stratocumulus: a low, lumpy sheet, tops at 2.3 km.
			TYPE
			{
				name = Stratocumulus
				// Where the type is likely (E40 L3): stratocumulus fills the cool humid air over the sea at middle and high latitudes and does not stand over high ground or in rain.
				CLIMATE
				{
					weight = 1
					LATITUDE
					{
						key0 = 0 0.35
						key1 = 0.35 0.6
						key2 = 0.65 1
						key3 = 1 1
					}
					SURFACE
					{
						key0 = 0 1
						key1 = 0.5 0.35
						key2 = 1 0.15
					}
					HUMIDITY
					{
						key0 = 0 0.1
						key1 = 0.4 0.3
						key2 = 0.75 1
						key3 = 1 1
					}
					PRECIPITATION
					{
						key0 = 0 1
						key1 = 0.25 0.6
						key2 = 1 0.15
					}
				}
				// No light factor on the direct light (E40 look round 2): the model's base (0.27 of a white card) and top (0.56) sit on the two-stream anchors (0.29, 0.42 to 0.56) as they are.
				baseAmbient = 0.9
				headAmbient = 1
				baseShare = 0
				topShare = 0.11
				erosion = 0.3
				// Full-column optical depth 13 (0.05 x 627 m x 0.6 x 0.7): stratocumulus lies at 5 to 20 (ISCCP: tau 3.6 to 23 is the medium class, Rossow and Schiffer 1999; field
				// campaigns find a mean of about 10 to 15). The rest of the cumulus family is scaled by the same 0.7, congestus is left dense.
				densityScale = 0.7
				PROFILE
				{
					key0 = 0 0
					key1 = 0.15 0.9
					key2 = 0.6 1
					key3 = 1 0
				}
				// A flat base and a slightly lumpy top: the outline is the same from the base to half the height, then narrows a little.
				LIFT
				{
					key0 = 0 0
					key1 = 0.5 0
					key2 = 1 0.1
				}
			}
			// Cumulus humilis: fair-weather puffs, tops at 2.9 km.
			TYPE
			{
				name = Cumulus humilis
				// Fair-weather cumulus: everywhere that is not raining, most over land in the tropics and middle latitudes, fewer towards the poles.
				CLIMATE
				{
					weight = 1
					LATITUDE
					{
						key0 = 0 1
						key1 = 0.55 1
						key2 = 1 0.45
					}
					SURFACE
					{
						key0 = 0 0.6
						key1 = 0.5 1
						key2 = 1 0.8
					}
					HUMIDITY
					{
						key0 = 0 0.4
						key1 = 0.3 1
						key2 = 1 0.8
					}
					PRECIPITATION
					{
						key0 = 0 1
						key1 = 0.35 0.45
						key2 = 1 0.05
					}
				}
				// The model alone has the base at 0.96 and the top at 1.07 of the two-stream anchor (light_slab_check.py types): no light factor.
				baseAmbient = 0.9
				headAmbient = 1
				baseShare = 0
				topShare = 0.21
				erosion = 0.45
				// Full-column optical depth 25: the centre of a fair-weather cumulus lies at 10 to 40 (liquid water path 50 to 300 g per m2, Rossow and Schiffer 1999), the soft rim
				// thins through 1 to 5 over the outer 0.2 of the water content.
				densityScale = 0.7
				PROFILE
				{
					key0 = 0 0
					key1 = 0.08 0.9
					key2 = 0.55 1
					key3 = 0.9 0.5
					key4 = 1 0
				}
				// A flat wide base, a domed top: the lift (in map units) is 0 over the lower third and grows to the top, so the heads are narrower than the base.
				LIFT
				{
					key0 = 0 0
					key1 = 0.3 0
					key2 = 0.7 0.08
					key3 = 1 0.2
				}
			}
			// Cumulus mediocris: tops at 4.4 km.
			TYPE
			{
				name = Cumulus mediocris
				// Growing cumulus: moist air over land and the warm belt, in light rain, rarer towards the poles.
				CLIMATE
				{
					weight = 1
					LATITUDE
					{
						key0 = 0 1
						key1 = 0.6 0.8
						key2 = 1 0.15
					}
					SURFACE
					{
						key0 = 0 0.55
						key1 = 0.5 1
						key2 = 1 1
					}
					HUMIDITY
					{
						key0 = 0 0.1
						key1 = 0.35 0.6
						key2 = 0.7 1
						key3 = 1 1
					}
					PRECIPITATION
					{
						key0 = 0 0.45
						key1 = 0.2 1
						key2 = 0.65 1
						key3 = 1 0.5
					}
				}
				// The model alone has the base at 0.91 and the top at 0.90 of the two-stream anchor at optical depth 59 (light_slab_check.py types): no light factor.
				baseAmbient = 0.85
				headAmbient = 1
				baseShare = 0
				topShare = 0.47
				erosion = 0.5
				// Full-column optical depth 56: a growing cumulus is opaque in its core, as its towers (tau 50 to 100).
				densityScale = 0.7
				PROFILE
				{
					key0 = 0 0
					key1 = 0.06 0.9
					key2 = 0.5 1
					key3 = 0.85 0.6
					key4 = 1 0
				}
				// A cauliflower: the outline narrows from the lower quarter up, the towers are separate near the top.
				LIFT
				{
					key0 = 0 0
					key1 = 0.2 0
					key2 = 0.6 0.12
					key3 = 1 0.3
				}
			}
			// Cumulus congestus: towers to 7.4 km, the top of the layer.
			TYPE
			{
				name = Cumulus congestus
				// Towers: the humid tropics, over land and high ground, where it rains; none near the poles.
				CLIMATE
				{
					weight = 1
					LATITUDE
					{
						key0 = 0 1
						key1 = 0.4 0.8
						key2 = 0.7 0.15
						key3 = 1 0
					}
					SURFACE
					{
						key0 = 0 0.45
						key1 = 0.5 1
						key2 = 1 1
					}
					HUMIDITY
					{
						key0 = 0 0
						key1 = 0.4 0.15
						key2 = 0.75 1
						key3 = 1 1
					}
					PRECIPITATION
					{
						key0 = 0 0.05
						key1 = 0.2 0.5
						key2 = 0.5 1
						key3 = 1 1
					}
				}
				// The base follows from the model (the ambient floor, not the sun, lights it at optical depth 178). The sun's light at the top of a thick cloud is 0.82 of the two-stream's
				// (the octaves of the multiple scattering thin out with the depth the sun's light has to cross; the sky's light is now in the model, E40 L6 light): the head factor takes
				// that back, 1 / 0.82 = 1.2 (light_slab_check.py types: 1.2 puts the top of a thick type at 0.9 of the anchor of the sun and the sky together; the incus keeps its 1.15).
				headLight = 1.2
				baseAmbient = 0.8
				headAmbient = 1
				baseShare = 0
				topShare = 1
				erosion = 0.55
				// Full-column optical depth 171, opaque (deep convective towers: tau above 100, ISCCP class "deep convection" starts at 23).
				densityScale = 1
				PROFILE
				{
					key0 = 0 0
					key1 = 0.04 0.9
					key2 = 0.45 1
					key3 = 0.8 0.7
					key4 = 1 0
				}
				// Towers: a wide cloud base, the lift grows fast so that the cores stand apart over the upper two thirds. The height of a top over a core is the noise's swing divided by the
				// lift's slope there, so a shallow slope turns the shape noise's fine octaves (0.5 to 1 km wide, +-0.1) into spikes of a kilometre: the slope must steepen towards the top (E40 L5 shape).
				LIFT
				{
					key0 = 0 0
					key1 = 0.15 0
					key2 = 0.5 0.17
					key3 = 0.8 0.33
					key4 = 1 0.5
				}
			}
			// Altocumulus: a thin lumpy sheet in the middle level, 4.8 to 5.6 km. The last type: the mid-level rule picks it, and its weight (CLIMATE) multiplies that rule's share.
			TYPE
			{
				name = Altocumulus
				CLIMATE
				{
					weight = 1
					LATITUDE
					{
						key0 = 0 0.6
						key1 = 0.5 1
						key2 = 1 0.7
					}
				}
				baseShare = 0.54
				topShare = 0.68
				erosion = 0.4
				// Full-column optical depth 11 (0.05 x 800 m x 0.6 x 0.45): altocumulus is a translucent sheet, tau 3 to 12 (ISCCP medium class), the sun's disc shows through it.
				densityScale = 0.45
				PROFILE
				{
					key0 = 0 0
					key1 = 0.2 0.9
					key2 = 0.7 0.8
					key3 = 1 0
				}
				// Cells with gaps rather than a plate: the lift is small and lets the tops narrow.
				LIFT
				{
					key0 = 0 0
					key1 = 0.4 0
					key2 = 1 0.1
				}
			}
		}

		// Cumulonimbus: base at 1.7 km, tops at the tropopause (11 km). Rare in the map, thick, the anvil spreads in the top third.
		LAYER
		{
			name = Kerbin-cumulonimbus
			ambientMs = 3.5
			ambientDecay = 0.11
			// Separate storm cells rather than a plate (E40 L3); where it rains the cover stays (rainKeep 1).
			MESO
			{
				scaleDepths = 5.7
				octaves = 2
				amount = 1
				edge = 0.3
				shoulder = 1
				cells = 1
				stretch = 1
				rainKeep = 0.5
				scatter = 1
				scatterDepths = 3
			}
			innerAltitudeM = 1700
			outerAltitudeM = 11000
			sigmaPerM = 0.08
			kind = Weather
			coverage = 0.12
			edgeSoftness = 0.1
			shadowStrength = 1
			noiseAmount = 0.4
			noiseScaleM = 5000
			// The same column coherence as the cumulus layer, less: the storm cells are 10 to 30 km wide in a layer 9 km deep, already nearly as tall as wide.
			verticalScale = 0.6
			softnessScale = 1
			waterPower = 2
			// A storm cloud's base is dark: less sky fill than a fair-weather cumulus (the tower itself is lit like a cumulus).
			lightAmbient = 0.8
				// A rain cloud is drawn only as far as it rains (WeatherDeckRule without fog and without a floor): the coverage is multiplied by the precipitation share (from level
				// 0.04, complete at 0.20), and the type value is the precipitation level (calvus below, incus above). The weather deck is what the rain itself guarantees.
				deckRule = 1
				deckFog = 0
				deckFogType = 0
				deckPrecipType = 0
				// E40 L2 D1 took 5000 m (amount stays 0.4: the closed-share test pins the cover at map 0.66) for separate towers. The 8000 m numbers, from the player series e40-fn (nadir view from 80 km, mean chord of the cloud along a row, 8 sites): where the map stands high (0.8) the
				// towers are 14 to 16 km wide at 8000 m (cumulonimbus cells are 10 to 30 km), 12 to 14 km at 5000 m, 7 to 9 km at 3000 m and 5 to 9 km at 1000 m; at the
				// map 0.66 and amount 0.4 only fragments of 1 to 2 km stand. A smaller scale makes smaller towers, not more cells of the right size.
			// Cumulonimbus calvus: a rounded top, no anvil yet, 8 km.
			TYPE
			{
				name = Cumulonimbus calvus
				// A dark rain-shaft base (the model's own: sun light of the base falls with the depth, the ambient floor remains) under a hard-lit white head (the top of a
				// thick cloud's direct light is 0.82 of its two-stream anchor: the head factor takes that back, see the congestus type).
				headLight = 1.2
				baseAmbient = 0.7
				headAmbient = 1
				baseShare = 0
				topShare = 0.7
				erosion = 0.5
				riseShare = 0.3
				densityScale = 1
				PROFILE
				{
					key0 = 0 0.2
					key1 = 0.05 0.9
					key2 = 0.5 1
					key3 = 0.85 0.7
					key4 = 1 0
				}
				// A tower: the outline narrows from the base up to a round head. The lift is in map units and the map is the cell's strength, so the strongest cell (map 1) can reach a
				// height only where the lift stays within the headroom the layer leaves it: coverage 0.12 plus the noise's +-0.2. The former 0.25 and 0.45 were out of reach for any cell
				// (CPU sections of the shape model: the tower stayed under a third of its height at map 1); at 0.12 and 0.28 a cell at map 0.9 stands to about the middle and one at map 1 to the head.
				LIFT
				{
					key0 = 0 0
					key1 = 0.1 0
					key2 = 0.5 0.12
					key3 = 1 0.28
				}
			}
			// Cumulonimbus incus: the full anvil at the tropopause, wide and dense in the top third.
			TYPE
			{
				name = Cumulonimbus incus
				headLight = 1.15
				baseAmbient = 0.7
				headAmbient = 1.05
				baseShare = 0
				topShare = 1
				erosion = 0.5
				riseShare = 0.3
				densityScale = 1
				PROFILE
				{
					key0 = 0 0.2
					key1 = 0.05 0.8
					key2 = 0.4 0.9
					key3 = 0.7 1
					key4 = 0.88 0.8
					key5 = 1 0
				}
				// A tower under a wide anvil: the lift narrows the stem over the lower two thirds and is gone at the top, where the cloud stands as wide as the map says.
				LIFT
				{
					key0 = 0 0
					key1 = 0.1 0
					key2 = 0.45 0.18
					key3 = 0.7 0.18
					key4 = 0.9 0
					key5 = 1 0
				}
			}
		}

		// Cirrus: ice crystals at 9 to 11 km, thin, a vertical optical depth of 0.3. Lit by the sky and one sun tap.
		LAYER
		{
			name = Kerbin-cirrus
			innerAltitudeM = 9000
			outerAltitudeM = 11000
			sigmaPerM = 0.0002
			kind = Cheap
			coverage = 0.3
			edgeSoftness = 0.35
			shadowStrength = 0.15
			noiseAmount = 0.5
			noiseScaleM = 3000
			// Fibres: the noise features are this many times longer along the layer's wind than across it (cirrus streaks along the flow; 1 is isotropic). The axis is the horizontal
			// direction of the wind at the layer's middle height at the camera (the pole where the air is still), turned to it over 20 s.
			fibreStretch = 6
			// Thin sheets have no core: the water content enters the density linearly.
			softnessScale = 2
			waterPower = 1
			// Ice cloud is bright: the sky's fill (the only light term of a Cheap layer that this factor reaches) is raised.
			lightAmbient = 1.3
			// Ice crystals scatter the sun far more to the sides and back than the water drop's phase function of the global fit (which is nearly dark at the 100 to 140 degrees of a
			// view from above): this share of the single scattering goes equally in all directions, and lightPlateau adds a side and back plateau of that many times the isotropic phase
			// to the lobes while the forward lobe stays (the shape follows Baran et al. 2001, who hold an ice crystal's phase constant beyond 95 degrees; the level 0.5 is [UNKNOWN], judged
			// on the sweep, the water drop's own phase being 0.17 times the isotropic one at 120 degrees). The sweep on the cirrus sheet (the cloud's radiance added to the picture, relative to the white card, from above / from the ground): lightIsotropy 0.5
			// 0.143 / 0.374; lightIsotropy 1 0.198 / 0.184 (the forward lobe is gone: the sheet is half as bright toward the sun for a third more from above); isotropy 0.5 with
			// lightPlateau 0.4 0.204 / 0.427 and with 0.7 0.249 / 0.468. Shipped, 0.5 without the type's former head factor 1.15: 0.204 / 0.414, a veil from above 43 % brighter and the
			// sheet toward the sun 11 % brighter, not dimmer.
			lightIsotropy = 0.5
			lightPlateau = 0.5
			typePatchDepths = 10.5
			// Bands of fibres and clear gaps along the wind (E40 L3): the pattern is stretched along a parallel.
			MESO
			{
				scaleDepths = 5.7
				octaves = 2
				amount = 1
				edge = 0.35
				shoulder = 1
				cells = 1
				stretch = 2.5
				rainKeep = 0
				scatter = 1
				scatterDepths = 3
			}
			TYPE
			{
				name = Cirrus
				// Fibres everywhere; fewer where the air below rains (the veil of a front is the other type).
				CLIMATE
				{
					weight = 1
					PRECIPITATION
					{
						key0 = 0 1
						key1 = 0.3 0.45
						key2 = 1 0.15
					}
				}
				// Bright and thin: the sun reaches every part of it (the ice phase above is what makes it bright; the former head factor 1.15 is gone).
				baseLight = 1
				baseShare = 0.1
				topShare = 0.9
				erosion = 0.7
				// Full-column optical depth 0.5: visible cirrus lies at 0.03 to 3 (thin cirrus 0.03 to 0.3, opaque cirrus 0.3 to 3; Sassen and Cho 1992), most of the sky seen through it.
				densityScale = 2.5
				PROFILE
				{
					key0 = 0 0
					key1 = 0.35 0.9
					key2 = 0.65 0.8
					key3 = 1 0
				}
			}
			TYPE
			{
				name = Cirrostratus
				// The high veil of a front: where it rains below, in moist air, and more at middle latitudes than in the tropics.
				CLIMATE
				{
					weight = 1
					LATITUDE
					{
						key0 = 0 0.3
						key1 = 0.5 1
						key2 = 1 0.8
					}
					HUMIDITY
					{
						key0 = 0 0.2
						key1 = 0.6 1
						key2 = 1 1
					}
					PRECIPITATION
					{
						key0 = 0 0.25
						key1 = 0.3 1
						key2 = 1 1
					}
				}
				baseShare = 0.2
				topShare = 0.8
				erosion = 0.3
				// Full-column optical depth 0.4: a veil (cirrostratus) is 0.3 to 3 and still shows the sun with a halo; 0.4 is its thin end.
				densityScale = 4
				PROFILE
				{
					key0 = 0 0
					key1 = 0.3 0.7
					key2 = 0.7 0.7
					key3 = 1 0
				}
			}
		}
	}
}
