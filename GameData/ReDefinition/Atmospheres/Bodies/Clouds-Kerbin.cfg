// ReDefinition Atmospheres: the layer set of the own cloud system on Kerbin (package T10). A ModuleManager patch that adds LAYER nodes to the
// CLOUDS node of the body node in Kerbin.cfg; the other bodies follow with package E41. Read by BodyRuleReaders.CloudLayers.
//
// The values are our own, authored from real cloud physics, not from any pack:
//   Bases and tops: the WMO cloud classification (International Cloud Atlas) for the low (surface to 2 km), middle (2 to 7 km) and high
//   (5 to 13 km) levels. Stratus and fog lie below 2 km; cumulus humilis and mediocris have their base near 1 to 2 km and tops at 2 to
//   4 km; cumulus congestus reaches 5 to 8 km; cumulonimbus has its base below 2 km and reaches the tropopause (about 11 km); cirrus lies
//   at 8 to 12 km. The cumulus family and the cumulonimbus layer start at 1.7 km, the low stratiform weather layer reaches 2.1 km.
//   Extinction at full density (sigmaPerM): liquid water clouds have an extinction of 0.02 to 0.1 per m (liquid water content 0.1 to
//   0.5 g per m3, droplet radius 8 to 10 um: sigma = 3 LWC / (2 rho_water r)), which gives vertical optical depths of 10 to 50 for a
//   stratus of 500 m, 20 to 250 for cumulus towers and 100 to 600 for cumulonimbus; the visibility in fog is 3.9 / sigma; ice clouds
//   (cirrus) have an optical depth of 0.03 to 3, here 0.3 for 1.6 km, sigma = 2e-4 per m.
//
// Five layers are designed for four visible at once: Kerbin-weather-rain and Kerbin-weather-snow share the group "weather" (the weather
// shows the one that fits the precipitation type of the place); the cumulus layer, the cumulonimbus layer and the cirrus layer are
// always candidates. A group member is chosen by CloudLayerSet.Select.
//
// A map value is the share of the sky a layer closes (the noise decides where, the runtime shifts cloud.coverageShift* still act): coverage has no effect on a layer with noise;
// a layer without noise (noiseAmount 0) keeps coverage as its threshold; noiseAmount above 0 switches the soft density on. The profile keys are 'height density' pairs over the type's own height (0 at its base, 1 at its top).
@REDEFINITION_BODY[Kerbin]
{
	@CLOUDS
	{
		// The height scale (tuning key cloud.heightScale, CloudHeightScale; owner 2026-11-23): the metre lengths of this file were written for Earth's troposphere of 11 km (see the head);
		// with the scale on they are multiplied by the body's measured troposphere (8.8 km on Kerbin) times heightFactor (with the viewer's cloud.heightFactor) over this reference.
		heightReferenceM = 11000
		heightFactor = 1
		// The colour of the air between the camera and a cloud (E40 H1 aerial perspective): the pass works it out from the body's own air (Scatterer's atmosphere node of Kerbin where Scatterer is loaded, the body's data otherwise), the radiance of the air along the ray a far cloud stands on is the colour it fades into and nothing here is needed for it. The keys below belong to the law of before (tuning key cloud.aerialPerspectiveSky 0; E40 T1 tint). The extinction of the air is blue by itself (the pass's aerial perspective takes Scatterer's coefficients, blue about
		// 5.7 times red); the light the air in-scatters is blue only in so far as the sky is. aerialPerspectiveBlue is how blue the colour is that a cloud FAR away fades into (the exponent of the Rayleigh
		// coefficient's ratio to its mean per channel; 0.35 reproduces the colour of Scatterer's horizon, 0.57 / 0.73 / 0.82 at the pass's sun); aerialPerspectiveNearBlue is how blue the in-scatter is over a
		// SHORT path (0: the sun's own colour, which a path of a few kilometres in-scatters before the air has had the length to take the red and green out of the light behind it). The pass
		// blends the two by the blue channel's extinction along the ray, so a cloud at the horizon keeps the horizon's colour and a layer a few kilometres overhead does not get the horizon's
		// blue on top of the blue its extinction already adds. Both 0 to 1; aerialPerspectiveBlue = aerialPerspectiveNearBlue is the single colour of before.
		aerialPerspectiveBlue = 0.35
		aerialPerspectiveNearBlue = 0
		// An optional gain per channel on the colour a far cloud fades into (E40 FL far, an artistic knob; 1 is none and the default, and the colour from the air needs none: at start 61's sun it is
		// within 0.03 of Scatterer's horizon on Kerbin, 0.66 / 0.78 / 0.82: game start 61, the frame without our clouds, row 740 of 960, the sky just above the horizon). For the law of before the
		// Rayleigh power law left green 0.13 short of that horizon, and a gain of 1.35 / 1.48 / 1.17 (the horizon's radiance over the law's) put a far cloud on it.
		// The gain multiplies the radiance, so the colour keeps following the sun and the air; a gain of 1 on all three is the same as leaving the keys out. Each 0.1 to 4. Example, no gain:
		// (aerialPerspectiveTintR / aerialPerspectiveTintG / aerialPerspectiveTintB)
		// aerialPerspectiveTintR = 1
		// aerialPerspectiveTintG = 1
		// aerialPerspectiveTintB = 1
		// The height of a cloud's base varies over the sky (E40 HKEYS, HeightTuning; the player's switches cloudBaseVariation and cloudBasePhysics turn the parts on and off). A body may set the numbers; a key
		// that is not there is the value below, which is what Kerbin always had, so a body without the keys draws the same clouds. Base from the air: the base lies heightLclMPerK metres higher for each kelvin of
		// dew-point spread (125 is the Espy relation of the lifting condensation level, Lawrence 2005), measured from the spread heightReferenceSpreadK at which the type table's base applies as it is (0: the
		// mean spread of the body's humidity map, so the table's base is the body's average), and the physics moves the base by at most heightPhysicsMaxM either way. Base from the place: a low-frequency
		// offset of standard deviation heightVariationM and wavelength heightWavelengthM on the ground, and the trend heightSizeTrendM for a neighbourhood of radius heightSizeRadiusM that is fully covered against an
		// uncovered one (negative: larger clouds sit lower). All in metres, kelvin or metres per kelvin; each key has its range and is brought into it with a warning.
		heightLclMPerK = 125
		heightReferenceSpreadK = 0
		heightPhysicsMaxM = 500
		heightVariationM = 110
		heightWavelengthM = 12000
		heightSizeTrendM = -220
		heightSizeRadiusM = 40000
		// The lower boundary of a cloud is ragged (the player's switch baseRagged): it moves by up to heightRaggedM at an erosion of 0.5 in lumps of heightRaggedScaleM, and no cloud gets thinner than
		// heightMinThicknessM where a raised base pushes the top up with it.
		heightRaggedM = 110
		heightRaggedScaleM = 220
		heightMinThicknessM = 120
		// The tops of convective clouds follow the updraft of their cell (the player's switch cloudTopFromUpdraft): a top moves by heightTopGainMPerMs for each m/s of updraft above heightReferenceUpdraftMs, by at most
		// heightTopMaxM either way, with a random share of heightTopJitterM. These are the numbers of every layer that has no topReach; a layer that names topReach (below) takes its own gain, reference and maximum, relative
		// to its thickness, and the jitter stays the body's.
		heightTopGainMPerMs = 120
		heightReferenceUpdraftMs = 1.2
		heightTopMaxM = 1200
		heightTopJitterM = 40
		// The low stratiform weather layer of rain, thunder and fog, from the ground to 2.1 km (stratus, nimbostratus, fog).
		LAYER
		{
			name = Kerbin-weather-rain
			// The sky's light inside the clouds of every lit layer (E40 L6 light): the sky's source at a sample gets ambientMs / (1 + ambientDecay tau) more, tau the optical depth to the cloud's
			// top. ambientDecay 0.11 = the two-stream 0.75 (1 - g) of water droplets (g 0.85); ambientMs 3.5 = the multiple scattering's amplification of a source at the surface (the sun's light
			// has 3.97 from its octaves), taken so that a thick slab's top returns 0.9 to 1.0 of the two-stream reflection of the sky and its base 0.8 to 0.9 of the transmission
			// (light_slab_check.py table). 0 = the sky's light stops at the first optical depth (a sunlit cloud top then had 0.04 of a white card's radiance from the sky, the two-stream 0.30).
			ambientMs = 3.5
			ambientDecay = 0.11
			// The sun's diffusion in the clouds of every lit layer follows the cell (E40 LM2, CloudLightMath.CellDiffusion): the incidence of the sun on the lit surface, the far depth along
			// the chord of an ellipsoid of the type's height and this width, the side losses over it (tools/weather_metrics/light_mc_cell.py against the photon walks). A layer is a slab:
			// 20 km. 0 = the slab-fitted diffusion term of before.
			lightCellWidth = 20000
			group = weather
			innerAltitudeM = 0
			outerAltitudeM = 2100
			sigmaPerM = 0.045
			kind = Weather
			coverage = 0.5
			edgeSoftness = 0.2
			shadowStrength = 1
			noiseAmount = 0.3
			noiseScaleM = 10000
			// A frontal low stratiform layer follows its weather system (E40 L5 maps): breaks between the systems and ragged edges, the pattern's cell scaleSystems times the shortest wavelength of the body's
			// systems; rainKeep holds the cover from rainKeepFrom to rainKeepFullAt (the precipitation level), so the heavy-rain core stays closed.
			MESO
			{
				scaleSystems = 0.6
				octaves = 2
				amount = 1
				edge = 0.5
				shoulder = 3
				cells = 1
				stretch = 1
				rainKeep = 0.8
				rainKeepFrom = 0.4
				rainKeepFullAt = 0.8
				// Where it rains the pattern never leaves a clear sky: at least rainMin (below one half: no field) from rainMinFrom to rainMinFullAt (precipitation level).
				rainMin = 0.45
				rainMinFrom = 0.04
				rainMinFullAt = 0.08
				scatter = 1
				scatterDepths = 3
			}
			// The tops of a cell follow its updraft (E40 L6 shape): the most a top moves is topReach of the layer's thickness (1200 m of the 2.1 km layer, the number the tops had before it was
			// a layer's), it stands at the type table's top at topRefMs and has moved by the whole reach at topFullMs.
			topReach = 0.5714
			topRefMs = 1.2
			topFullMs = 11.2
			// The soft water content (E40 soft density): softnessScale is the factor on the owner's cloud softness (1: the setting itself), waterPower the exponent of the
			// water content in the density. Per type: baseGain / riseShare (the rise of the density with the height in the cloud) and densityScale (a factor on the type's
			// density, 1: none). [UNKNOWN] starting values; the low stratiform weather layer is softer and flatter than a cumulus.
			softnessScale = 1.5
			waterPower = 2
			// The light response of the layer (lightAmbient, 1 = none): the layer has none. Its base is on the two-stream anchor (tools/weather_metrics/light_slab_check.py types:
			// stratus 1.01, nimbostratus 0.93 of it), so the model needs no factor there.
				// What may draw this layer (WeatherLowStratiformRule, E40): precipitation (level from 0.04 = the end of the band None, full from 0.20 = Light) draws Stratus
				// (type 0.5) and, as the level rises, Nimbostratus (type = level); fog draws only where the surface air is near saturation (dew-point spread within
				// 2.8 K = the aviation rule of thumb of 5 F, half width 1 K) and the wind is light; in fair weather the layer draws nothing and the cumulus layer
				// makes the sky. [UNKNOWN] starting values: lowStratiformFogSpreadBandK, lowStratiformFogWindMs, lowStratiformFogWindBandMs (fog needs light wind; advection fog a few m/s).
				// cloud.lowStratiformRule.Kerbin-weather-rain 0 gives the old rule back (type = precipitation level, the layer draws wherever its map passes).
				// lowStratiformRainFloor: wherever it rains the layer is at least this thick (reached at level 0.08), so that no rain falls from a clear sky.
				lowStratiformRule = 1
				lowStratiformRainFloor = 0.9
				lowStratiformRainFloorFullAt = 0.7
				lowStratiformFogSpreadK = 2.8
				lowStratiformFogSpreadBandK = 1
				lowStratiformFogWindMs = 5
				lowStratiformFogWindBandMs = 2
				lowStratiformPrecipFrom = 0.04
				lowStratiformPrecipFullAt = 0.2
				lowStratiformFogType = 0
				lowStratiformPrecipType = 0.5
			// Ground fog: a thin layer on the ground, visibility about 100 m at full density (3.9 / 0.045 / 0.9).
			TYPE
			{
				name = Fog
				baseShare = 0
				topShare = 0.1
				erosion = 0.2
				baseGain = 0.7
				densityScale = 1
				PROFILE
				{
					key0 = 0 0.9
					key1 = 0.7 0.5
					key2 = 1 0
				}
			}
			// Stratus: a flat grey layer of a few hundred metres, flat base, soft top.
			TYPE
			{
				name = Stratus
				baseShare = 0.1
				topShare = 0.5
				erosion = 0.15
				baseGain = 0.7
				// M2c: the variety undulatus (long, nearly parallel waves of the top). 0.2 of the thickness at the default wavelength (1 x the layer's depth): soft long swells of a
				// closed deck without holes, as in the Vodno photo (owner 2026-11-24: "so dass es echt und richtig aussieht"; K-T2 perfNpic2560dlssqundulatusform, PRUEFPROTOKOLL 201).
				undulatusAmount = 0.2
				// Full-column optical depth about 26 (0.045 x 840 m x 0.6 x 1; light_slab_check.py types): in the ISCCP cloud classification the low class "stratus" is the optically
				// thickest one, tau 23 to 379 (below 3.6 it is "cumulus", 3.6 to 23 "stratocumulus"; https://isccp.giss.nasa.gov/cloudtypes.html, the figure GIFS/Dcloudtypes.gif).
				// Until 2026-11-24 this read 0.22 (tau 5) from a misreading of that classification, which left a closed deck mid-grey from above (PRUEFPROTOKOLL 218, 222).
				densityScale = 1
				PROFILE
				{
					key0 = 0 0
					key1 = 0.12 0.8
					key2 = 0.5 1
					key3 = 0.85 0.7
					key4 = 1 0
				}
			}
			// Nimbostratus: thick, dark, with rain beneath it, from near the ground to the top of the layer.
			TYPE
			{
				name = Nimbostratus
				// Thick and dark by its optical depth alone (66): the base is 0.11 of a white card, the two-stream anchor 0.09.
				baseShare = 0.05
				topShare = 1
				erosion = 0.2
				baseGain = 0.7
				densityScale = 1
				PROFILE
				{
					key0 = 0 0.1
					key1 = 0.08 0.9
					key2 = 0.6 1
					key3 = 0.9 0.6
					key4 = 1 0
				}
			}
		}

		// The same low stratiform layer for snow and cold: polar fog, stratus and a snow-bearing nimbostratus. It never shows with the low stratiform rain layer.
		LAYER
		{
			name = Kerbin-weather-snow
			ambientMs = 3.5
			ambientDecay = 0.11
			lightCellWidth = 20000
			group = weather
			innerAltitudeM = 0
			outerAltitudeM = 2100
			sigmaPerM = 0.04
			kind = Weather
			coverage = 0.5
			edgeSoftness = 0.25
			shadowStrength = 1
			noiseAmount = 0.25
			noiseScaleM = 12000
			// The same pattern as the low stratiform rain layer (see there).
			MESO
			{
				scaleSystems = 0.6
				octaves = 2
				amount = 1
				edge = 0.5
				shoulder = 3
				cells = 1
				stretch = 1
				rainKeep = 0.8
				rainKeepFrom = 0.4
				rainKeepFullAt = 0.8
				// Where it rains the pattern never leaves a clear sky: at least rainMin (below one half: no field) from rainMinFrom to rainMinFullAt (precipitation level).
				rainMin = 0.45
				rainMinFrom = 0.04
				rainMinFullAt = 0.08
				scatter = 1
				scatterDepths = 3
			}
			topReach = 0.5714
			topRefMs = 1.2
			topFullMs = 11.2
			softnessScale = 1.5
			waterPower = 2
				// The same rule as the low stratiform rain layer (polar fog, snow stratus, snow nimbostratus); see there.
				lowStratiformRule = 1
				lowStratiformRainFloor = 0.9
				lowStratiformRainFloorFullAt = 0.7
				lowStratiformFogSpreadK = 2.8
				lowStratiformFogSpreadBandK = 1
				lowStratiformFogWindMs = 5
				lowStratiformFogWindBandMs = 2
				lowStratiformPrecipFrom = 0.04
				lowStratiformPrecipFullAt = 0.2
				lowStratiformFogType = 0
				lowStratiformPrecipType = 0.5
			TYPE
			{
				name = Polar fog
				baseShare = 0
				topShare = 0.12
				erosion = 0.15
				baseGain = 0.7
				densityScale = 1
				PROFILE
				{
					key0 = 0 0.8
					key1 = 0.7 0.5
					key2 = 1 0
				}
			}
			TYPE
			{
				name = Snow stratus
				baseShare = 0.1
				topShare = 0.6
				erosion = 0.15
				baseGain = 0.7
				// M2c: the variety undulatus, as the low stratiform rain layer's Stratus.
				undulatusAmount = 0.2
				// Full-column optical depth about 28, in the ISCCP stratus class (tau 23 to 379) as the low stratiform rain layer's Stratus (0.04 x 1050 m x 0.6 x 1).
				densityScale = 1
				PROFILE
				{
					key0 = 0 0
					key1 = 0.15 0.8
					key2 = 0.55 1
					key3 = 0.9 0.6
					key4 = 1 0
				}
			}
			TYPE
			{
				name = Snow nimbostratus
				baseShare = 0.05
				topShare = 1
				erosion = 0.2
				baseGain = 0.7
				densityScale = 1
				PROFILE
				{
					key0 = 0 0.15
					key1 = 0.1 0.9
					key2 = 0.65 1
					key3 = 0.92 0.5
					key4 = 1 0
				}
			}
		}

		// The cumulus family from a base of 1.7 km to the tops of congestus at 7.4 km, and altocumulus in the middle level.
		LAYER
		{
			name = Kerbin-cumulus
			ambientMs = 3.5
			ambientDecay = 0.11
			// A cumulus cell is about as wide as a mediocris is high (E40 LM2).
			lightCellWidth = 2000
			// Single clouds (cloud.cells, CloudCells.cginc): the map (a texel of 7.4 km) says how much of a region is cloud, the cells put that share down as clouds on a lattice of this pitch.
			// 3000 m: in a fair sky (share below 0.25) only share / 0.25 of the cells hold a cloud, 1.7 km across on average (1.0 to 2.3 km; real fair-weather cumulus are 0.5 to 2 km wide);
			// above that every cell holds one and they grow until they merge into a closed cloud layer at a share of 0.8 (the map's own value takes over there).
			cellPitch = 3000
			// Each single cloud is a body with a sharp surface (CloudCells.cginc CellBody, after Schneider's Nubis): a half ellipsoid over the type's flat base whose surface the bulges move
			// by up to cellBulge of its shorter semi-axis, the heads on the heads (cellFine, the gain of two finer octaves at 0.37 and 0.137 of the size) in the same proportion, and the
			// share rises over cellBand m at the surface (the outline's sharpness, the same on every body). The look the owner chose on 2026-11-17 (crisp cauliflower over a flat base).
			cellBulge = 0.5
			cellBand = 10
			cellFine = 1
			innerAltitudeM = 1700
			outerAltitudeM = 7400
			sigmaPerM = 0.05
			kind = Weather
			coverage = 0.35
			edgeSoftness = 0.15
			shadowStrength = 1
			// noiseScaleM is the cell of the shape volume's FINEST octave: the volume repeats after 16 of them and its strongest octave has two cells
			// per period (NoiseModel), so the cloud bodies are 4 to 8 times this number wide. 250 m gives cells of 1 to 2 km, the size of the cells of a fair-weather
			// cumulus field (real fields: cells of 0.5 to 2 km with gaps of the same size); the 500 m before gave 2 to 4 km, and a field seen from above had half the cells per area
			// (autocorrelation length of the cloud mask 1.0 to 1.2 km against 0.6 to 0.7 km now, player series e40-s1; True Volumetric Clouds' frame 0.4 km). The cell is the layer's
			// (one noise per layer), so the tall types, which want wider cells, get theirs from a wider smoothing of the volume (their shapeSmoothing), not from a scale of their own.
			// noiseAmount 1 lets the noise decide where a cloud stands and the map how much of the sky they fill (player series e40-fl); coverage has no effect on this layer.
			noiseAmount = 1
			noiseScaleM = 250
			// A convective cloud is a column: the air that rises in a cell is the same over the cloud's depth. With the noise as unrelated at every height as across (1), a cloud is a
			// blob at a random height, the tops are slivers and the bases are not under the heads (E40 L5 shape: CPU slices of the shape model and the type sheets). 0.5 makes the
			// features twice as long in the vertical, so a cell is one body from the base to its top, and the type's height-shaped threshold (LIFT) rounds it into a dome. 0.35 made
			// congestus pillars 5 km tall and 2 km wide with vertical flutes (type sheet, player). With the cell at 250 m, 0.35 keeps the share of the sky a map value asks for (the column cover
			// seen from 40 km up, player series e40-s1: +0.02, 0 and +0.01 at three sites against the 500 m cell at 0.5; 0.5 gave +0.03 to +0.04, 0.2 pillars of congestus).
			verticalScale = 0.35
			// The top of a column is where the shape noise crosses the type's rising threshold, so it stands higher by the noise's swing over the threshold's slope, and the volume's fine octaves
			// (cone-shaped Worley peaks among them) became spires a kilometre tall and a few hundred metres wide (E40 L6 shape: CPU renders of the model, type sheets). shapeSmoothing is the
			// width in noise scales the shape volume is averaged over before it is read (its mip chain, equalised again at every level); the cauliflower of the surface comes from the erosion.
			// It is the type's number (a flat sheet wants the volume's fine octaves for its lumps, a tower does not): one scale is 500 m here. The layer's own is the default of a type without one.
			shapeSmoothing = 0
			// The tops follow the updraft of the cell: 1200 m at an updraft of 11.2 m/s of 5.7 km (0.2105), the numbers the tops had when they were the body's (E40 L6 shape).
			topReach = 0.2105
			topRefMs = 1.2
			topFullMs = 11.2
			// The rim of the soft water content is softness (the owner's setting, 0.5) x softnessScale wide in units of the noise's swing. 1 faded every cumulus over hundreds of metres:
			// seen from the ground at 1.5 to 3 km the clouds were cotton wool, while a real cumulus has a sharp outline (CELLS, player with the game's maps, 2026-11-17: 0.3 gives
			// the outline; the cover meaning keeps the share of the sky the map asks for).
			softnessScale = 0.3
			waterPower = 2
			// Cumulus: the global fit (the multiple scattering of the bright heads and the powder darkening of the thin rim are what a cumulus has); the shaded base follows from
			// the model (light_slab_check.py types). The types carry no factor on the direct light: the cell diffusion (lightCellWidth, E40 LM2) has the incidence of the sun on the
			// cloud's surface that the factor 1.25 of E40 ML light made up for (a surface facing the sun read at 0.7 to 0.85 of a photon walk through a sunlit cell, now 0.9 to 1.05;
			// tools/weather_metrics/light_mc_cell.py), and the tops of the types are on the two-stream anchor without it (0.89 to 0.92 of a white card at 45 degrees).
			lightAmbient = 1
			// Which type shows where (E40 L3): each type has a CLIMATE (its weight over latitude, surface, humidity and precipitation) and the type at a place is drawn from these weights by a noise
			// of patches typePatchDepths troposphere depths wide (6.7 depths: about 70 km on Kerbin, whose troposphere is 10.5 km deep), so a region where two or three types are likely shows all of them, side by side. The types stand in the order of the type axis: stratocumulus,
			// humilis, mediocris, congestus, and a transition between two patches walks that axis, so it passes no other type. The altocumulus sheet is the last type and not on that walk: a rule
			// picks it (a share, cut hard where it passes about one half). Where the generator makes more cloud at the sheet's height (5.2 km) than at humilis' height (2.3 km), by altoFrom
			// to altoFullAt of the map value, the type map shows the sheet (1 = Altocumulus). fairType and rainType are the type at no and at full precipitation of a layer WITHOUT CLIMATE nodes
			// (the old rule: a line from fairType to rainType over the precipitation level) and the type where no weight is left here. The x of a LATITUDE curve is the body's circulation
			// coordinate: 0 at the equator, 1/3 at the edge of the first circulation cell, 2/3 at the edge of the second, 1 at the pole (30 and 60 degrees on Kerbin, so the plain latitude / 90).
			fairType = 0.25
			rainType = 0.75
			altoType = 1
			altoFrom = 0.05
			altoFullAt = 0.3
			typePatchDepths = 6.7
			typePatchBlend = 0.06
			// The cover's fields and clear gaps (E40 L3): the generator's map has features of 300 km and more and the noise in the shader cells of 2 to 4 km (the layer pass reads the global
			// map of 512 x 256 texels, so nothing finer than about 3 texels can come from the map); MESO adds the band between with a pattern of cloud and gap whose share is the map value
			// (a region keeps its mean cover). scaleDepths is the coarsest cell of the noise in depths of the body's troposphere (the mesoscale organisation of convection scales with the
			// depth it fills; 5.25 depths are 55 km on Kerbin, 10.5 km deep) and each further octave halves it; scaleKm instead sets the size in km. cells = 1 makes the gaps a network of lanes,
			// so the cloud breaks into separate cells of about that size whatever the cover (cells = 0: blobs; a region above one half is one sheet with holes); edge is the width of a field's edge in noise-rank units,
