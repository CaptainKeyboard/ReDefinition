// ReDefinition Atmospheres: Duna. A thin CO2 air, no water cycle: what falls is dust, and what lies on the ground is dust.
// The weather generator lifts dust where the wind passes its threshold (GENERATOR dust = On); the cloud types of the layer
// ReDefinition-Atmospheres-Duna (Clouds/Clouds-Duna.cfg) are one dust deck, so every precipitation level draws the Dust type.
// Values marked [UNKNOWN] are starting values that the tuning of the weather simulation sets again.
//
// Not set here, by decision of the owner still open (master plan Q7): a dust season around perihelion. SEASONS.eccentricitySeason
// is the switch the season clock offers for it; it stays false, so dust can rise in any season until the owner confirms the gate.
// Not set here, planned later: CO2 frost caps at the poles (a cover kind of its own is not in the schema yet).
REDEFINITION_BODY
{
	name = Duna
	enabled = true
	status = Auto

	PRECIP
	{
		// Dust falls at any temperature: the type does not depend on the wet-bulb temperature.
		TYPE
		{
			id = dust
			kind = Dust
			centreC = -273.15
			widthC = 1.0
			coldSide = false
			field = dust-Duna
			look = DustLook
		}
	}

	COVER
	{
		id = dust
		kind = Dust
		colour = 0.50, 0.42, 0.33
		roughness = 0.9
		// [UNKNOWN] a full cover is a film, not a drift
		maxDepthM = 0.05
		minLat = -90
		maxLat = 90
		maxSlope = 45
		noWater = true
		tracks = true
		// Dust settles and is lifted again slowly: the tracks last long.
		tracksTauHours = 48
		// Strong wind moves the cover: more drift, stretched along the wind.
		driftAmount = 0.6
		driftStretch = 8
	}

	GENERATOR
	{
		// Dust is lifted by the wind where it passes the threshold of the body (Auto: the generator's own number for the pressure).
		dust = On
	}

	CLOUDS
	{
		discover = Auto
		// The cloud type of the dust deck, by name, in our layer and in the pack's dust storm layer. [UNKNOWN] the pack's names:
		// the list holds the two spellings the plan expects; the discovery line of the first start prints the layers it took.
		// No weatherLayers list: the layers with a dust type are found by role.
		dustTypeNames = dust, Dust
	}

	LOOK
	{
		// [UNKNOWN] the visibility in the heaviest dust, in metres
		visibilityMinM = 40
		// Linear colours. The frame composer multiplies the fog and the veils by a brightness that follows the sun's elevation, so the
		// haze is ochre and dims toward the evening with the light of the sun at Duna; it does not read the sky colour of the scene.
		fogColour = 0.78, 0.62, 0.47
		veilGroundColour = 0.80, 0.64, 0.48
		veilSkyColour = 0.62, 0.48, 0.36
		flakeColour = 0.70, 0.56, 0.42
	}

	WIND
	{
		// [UNKNOWN] the strongest ordinary wind and a violent one, in m/s (master plan: Duna wind up to 30 m/s)
		maxWind = 30
		violent = 50
		windOnLanded = true
	}

	LIGHT_MEDIUM
	{
		density = 1
		scatterColour = 0.80, 0.60, 0.42
		// Dust scatters light: how much of the dust density counts as scattering medium.
		dustScatter = 1
	}

	FROST
	{
		// A dry air: no frost on the camera, whatever the temperature.
		enabled = false
	}
}
