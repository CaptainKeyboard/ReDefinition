// ReDefinition Atmospheres: Laythe. An ocean world: rain or snow by temperature, clouds from the generator, cover on land only.
// The year is Jool's (a moon follows its planet's orbit period by default, SEASONS.yearSource), capped like every year by
// SEASONS.yearCap (three years of the home planet unless the node says otherwise). The layer ReDefinition-Atmospheres-Laythe
// (Clouds/Clouds-Laythe.cfg) carries the three snow cloud types; the pack's snow field is snow-Laythe, the rain is drawn by our own
// renderer because the pack has no rain field for Laythe.
// Values marked [UNKNOWN] are starting values that the tuning of the weather simulation sets again.
REDEFINITION_BODY
{
	name = Laythe
	enabled = true
	status = Auto

	SEASONS
	{
		clock = Orbit
		yearSource = ParentOrbitPeriod
	}

	PRECIP
	{
		TYPE
		{
			id = snow
			kind = Snow
			centreC = 1.0
			widthC = 1.0
			coldSide = true
			field = snow-Laythe
			look = SnowLook
		}
		TYPE
		{
			id = rain
			kind = Rain
			centreC = 1.0
			widthC = 1.0
			coldSide = false
			look = RainLook
		}
	}

	COVER
	{
		id = snow
		kind = Snow
		colour = 0.93, 0.95, 0.98
		roughness = 0.8
		// [UNKNOWN] the depth of a full cover
		maxDepthM = 0.5
		minLat = -90
		maxLat = 90
		maxSlope = 60
		// The ocean carries no cover: snow lies on land only.
		noWater = true
		tracks = true
		tracksTauHours = 3
	}

	CLOUDS
	{
		// All the layers of Laythe by altitude, with the roles by type name (snow: Polar-snow, Snow; stratus: Stratus).
		discover = Auto
	}
}
