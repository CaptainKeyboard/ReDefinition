// EVE Redux (MIT) in the build with raymarched volumetric clouds: its cloud
// quality settings as ReDefinition bundles them. How a value reaches its node, its
// statics and the light volume is its behaviour's; the clouds are rebuilt once a
// frame after a change, as EveCompatibility does it -- a renderer still rendering
// in the frame would set itself up again just before it is destroyed. The map view
// fade is read as the clouds draw and needs no rebuild.
//
// Without the raymarched build, or without the members to save with, EVE is left
// alone, its button included -- as without one of its three required settings:
// a quality object of another shape.
//
// The format: docs/modders/registering-a-mod.md in ReDefinition's repository.

REDEFINITION_MOD
{
	name = eve
	title = EVE
	detect = Atmosphere.RaymarchedCloudsQualityManager
	saving = InModFiles
	button = EVEManager
	window = EVEManager.GlobalEVEManager.DrawMainWindow
	tab = Planets
	behaviour = Eve

	BUILD
	{
		name = volumetric
		has = Atmosphere.RaymarchedCloudsQualityManager
	}
	DEFAULTS
	{
		build = volumetric
		version = 3.2.2.0
	}

	// From the fewest pixels rendered to every pixel, against the order of its enum:
	// x1 on the right.
	SETTING
	{
		name = temporalUpscaling
		required = True
		member = Atmosphere.RaymarchedCloudsQualityManager.temporalUpscaling
		after = Atmosphere.DeferredRaymarchedVolumetricCloudsRenderer.ReinitAll
		title = Volumetric cloud upscaling
		tooltip = EVE renders the volumetric clouds a fraction of their pixels per frame and builds them up over several frames.\nx1 renders every pixel every frame: sharpest and slowest. Higher renders fewer.
		takesEffect = Live
		kind = Quality
		row = Planets
		order = 10
		choices = x32, x16, x12, x9, x8, x6, x4, x3, x2, x1
		default = x9
	}
	SETTING
	{
		name = renderCloudsInReflectionProbes
		required = True
		member = Atmosphere.RaymarchedCloudsQualityManager.renderCloudsInReflectionProbes
		after = Atmosphere.DeferredRaymarchedVolumetricCloudsRenderer.ReinitAll
		title = Clouds in reflections
		tooltip = The volumetric clouds show in KSP's reflection probes.
		takesEffect = Live
		kind = Quality
		default = True
	}
	SETTING
	{
		name = mapViewCloudFade
		required = True
		member = Atmosphere.RaymarchedCloudsQualityManager.mapViewCloudFade
		title = Fade clouds in the map view
		tooltip = 2D cloud layers and their shadows fade as the map view approaches a planet.
		takesEffect = Live
		kind = Taste
		default = True
	}

	// The rest of the quality object, for the reset and the profiles. Of it the window
	// shows the two sound volumes, a matter of play rather than of quality.
	SETTING
	{
		name = nonTiling3DNoise
		member = Atmosphere.RaymarchedCloudsQualityManager.nonTiling3DNoise
		after = Atmosphere.DeferredRaymarchedVolumetricCloudsRenderer.ReinitAll
		optional = this build of EVE does not have it among its cloud quality settings
		takesEffect = Live
		kind = Quality
		default = True
	}
	// The static is spelt with a capital S, the object's field not.
	SETTING
	{
		name = screenshotModeDenoisingIterations
		member = Atmosphere.RaymarchedCloudsQualityManager.screenShotModeDenoisingIterations
		optional = this build of EVE does not have it among its cloud quality settings
		takesEffect = Live
		default = 8
	}
	SETTING
	{
		name = ambientVolume
		member = Atmosphere.RaymarchedCloudsQualityManager.ambientVolume
		optional = this build of EVE does not have it among its cloud quality settings
		title = Cloud ambience volume
		tooltip = The wind, rain and snowstorm sounds in EVE's volumetric clouds. KSP's master and ambience volume turn them down further only below half.
		takesEffect = Live
		kind = Other
		row = Planets
		order = 12
		min = 0
		max = 1
		whole = False
		default = 1
	}
	SETTING
	{
		name = lightningVolume
		member = Atmosphere.RaymarchedCloudsQualityManager.lightningVolume
		optional = this build of EVE does not have it among its cloud quality settings
		title = Thunder volume
		tooltip = The thunder of EVE's lightning, from the next strike on. KSP's master and ambience volume turn it down further only below half.
		takesEffect = Live
		kind = Other
		row = Planets
		order = 14
		min = 0
		max = 1
		whole = False
		default = 1
	}
	SETTING
	{
		name = lightVolumeSettings.horizontalResolution
		member = Atmosphere.RaymarchedCloudsQualityManager.lightVolumeSettings.horizontalResolution
		after = Atmosphere.DeferredRaymarchedVolumetricCloudsRenderer.ReinitAll
		optional = this build of EVE does not have it in its light volume settings
		takesEffect = Live
		kind = Quality
		default = 224
	}
	SETTING
	{
		name = lightVolumeSettings.verticalResolution
		member = Atmosphere.RaymarchedCloudsQualityManager.lightVolumeSettings.verticalResolution
		after = Atmosphere.DeferredRaymarchedVolumetricCloudsRenderer.ReinitAll
		optional = this build of EVE does not have it in its light volume settings
		takesEffect = Live
		kind = Quality
		default = 32
	}
	SETTING
	{
		name = lightVolumeSettings.stepCount
		member = Atmosphere.RaymarchedCloudsQualityManager.lightVolumeSettings.stepCount
		after = Atmosphere.DeferredRaymarchedVolumetricCloudsRenderer.ReinitAll
		optional = this build of EVE does not have it in its light volume settings
		takesEffect = Live
		kind = Quality
		default = 50
	}
	SETTING
	{
		name = lightVolumeSettings.directLightTimeSlicing
		member = Atmosphere.RaymarchedCloudsQualityManager.lightVolumeSettings.directLightTimeSlicing
		after = Atmosphere.DeferredRaymarchedVolumetricCloudsRenderer.ReinitAll
		optional = this build of EVE does not have it in its light volume settings
		takesEffect = Live
		kind = Quality
		default = 12
	}
	SETTING
	{
		name = lightVolumeSettings.ambientLightTimeSlicing
		member = Atmosphere.RaymarchedCloudsQualityManager.lightVolumeSettings.ambientLightTimeSlicing
		after = Atmosphere.DeferredRaymarchedVolumetricCloudsRenderer.ReinitAll
		optional = this build of EVE does not have it in its light volume settings
		takesEffect = Live
		kind = Quality
		default = 32
	}
	SETTING
	{
		name = lightVolumeSettings.timewarpRateMultiplier
		member = Atmosphere.RaymarchedCloudsQualityManager.lightVolumeSettings.timewarpRateMultiplier
		after = Atmosphere.DeferredRaymarchedVolumetricCloudsRenderer.ReinitAll
		optional = this build of EVE does not have it in its light volume settings
		takesEffect = Live
		kind = Quality
		default = 3
	}

	// Volumetric Clouds' Readme, step 3: "Use my TUFX profile or your profile of
	// choice with ambient occlusion enabled". Judged as TUFX renders a
	// name: its loaded profile of that name, or its empty one where it has none.
	REQUIRES
	{
		setting = tufx.profileFlight
		check = TufxAmbientOcclusion
		fix = Blackrack_TUFX
		whenInstalled = tufx
		reason = Volumetric Clouds' author asks for a TUFX profile with ambient occlusion in flight -- the author's own, or another one with it.
	}

	// What each graphics profile sets over the defaults: quality settings only. High
	// is the defaults; a block for it names only what High raises beyond them. The
	// clouds stay in the reflection probe in every tier: at KSP's refresh Low -- which
	// Deferred's cap holds, and every profile sets where that cap is off -- the probe
	// renders at most one of its faces a frame (FlightReflectionProbe,
	// ReflectionProbeTimeSlicingMode.IndividualFaces).
	PROFILE
	{
		name = low
		temporalUpscaling = x16
	}
	PROFILE
	{
		name = medium
		temporalUpscaling = x12
	}
	PROFILE
	{
		name = ultra
		temporalUpscaling = x6
	}
	PROFILE
	{
		name = max
		temporalUpscaling = x4
	}
}
