// Firefly (GPL-3.0, MirageDev): its settings as ReDefinition bundles them.
//
// Its settings are ModSettings.I, a dictionary of ConfigFields filled from the
// ATMOFX_SETTINGS node after ModuleManager's pass. Its window's "Save overrides to
// file" writes them to GameData/Firefly/ModSettings.cfg
// (SettingsManager.SaveModSettings), and a value set here is saved the same way.
// Read through its indexer, as its own code reads them (AtmoFxModule): the
// strength and the trail length every frame, the bow shock with the effect's
// material properties, the particles when a vessel's effects are built. What a
// path cannot say -- its window's text, its keys -- is its behaviour's.
//
// hdr_override, which forces the cameras' HDR as its camera manager starts, is
// bundled for the reset only and not shown: the upscaler picks its shader set by
// the camera's HDR when it attaches.
//
// The format: docs/modders/registering-a-mod.md in ReDefinition's repository.

MOD_SETTINGS
{
	name = firefly
	title = Firefly
	detect = Firefly.ModSettings
	version = 1.0.6.0
	save = Firefly.SettingsManager.Instance.SaveModSettings
	button = Firefly
	window = Firefly.GUI.FireflyWindow.Draw
	tab = Effects
	behaviour = Firefly

	SETTING
	{
		name = strength_base
		member = Firefly.ModSettings.I[strength_base]
		title = Re-entry glow strength
		tooltip = How bright the plasma of re-entry glows.
		takesEffect = Live
		kind = Taste
		min = 500
		max = 5000
		whole = True
		default = 2800
	}
	SETTING
	{
		name = length_mult
		member = Firefly.ModSettings.I[length_mult]
		title = Re-entry trail length
		tooltip = How far the plasma trail streams behind the craft.
		takesEffect = Live
		kind = Taste
		min = 0.25
		max = 3
		whole = False
		default = 1
	}
	// Firefly's "disable_" switches show the other way round: on is on.
	SETTING
	{
		name = bowshock
		member = Firefly.ModSettings.I[disable_bowshock]
		invert = True
		title = Bow shock
		tooltip = The glowing shock front ahead of the craft.
		takesEffect = Live
		kind = Taste
		default = True
	}
	SETTING
	{
		name = particles
		member = Firefly.ModSettings.I[disable_particles]
		invert = True
		title = Re-entry particles
		tooltip = Sparks and embers. Takes effect when a vessel's effects are built.
		kind = Quality
		row = Effects
		order = 20
		default = True
	}
	SETTING
	{
		name = hdr_override
		member = Firefly.ModSettings.I[hdr_override]
		default = True
	}

	// What each graphics profile sets over the defaults: quality settings only. High
	// is the defaults; a block for it names only what High raises beyond them.
	PROFILE
	{
		name = low
		particles = False
	}
}
