// Waterfall (CC BY-NC-SA 4.0): its settings as ReDefinition bundles them. Its
// toolbar button is its effect editor's, an authoring tool, and stays.
//
// The format: docs/modders/registering-a-mod.md in ReDefinition's repository.

MOD_SETTINGS
{
	name = waterfall
	title = Waterfall
	detect = Waterfall.Settings
	version = 0.11.0.0

	// Decided as an effect is built -- WaterfallLight sets its light from it,
	// ModuleWaterfallFX leaves the distortion out while it is off -- so a change
	// shows with the next vessel or scene at the latest.
	SETTING
	{
		name = EnableLights
		member = Waterfall.Settings.EnableLights
		title = Engine plume lights
		tooltip = Engine plumes light up what is around them. Costs frame rate with many engines.
		kind = Quality
		row = Effects
		order = 30
		default = True
	}
	SETTING
	{
		name = EnableDistortion
		member = Waterfall.Settings.EnableDistortion
		title = Heat distortion
		tooltip = The air shimmers behind hot exhausts.
		kind = Quality
		row = Effects
		order = 40
		default = True
	}

	// The rest of what its loader reads, for the reset.
	SETTING
	{
		name = AtmosphereDensityExponent
		member = Waterfall.Settings.AtmosphereDensityExponent
		kind = Taste
		default = 0.512
	}
	SETTING
	{
		name = MinimumEffectIntensity
		member = Waterfall.Settings.MinimumEffectIntensity
		default = 0.005
	}
	SETTING
	{
		name = MinimumLightIntensity
		member = Waterfall.Settings.MinimumLightIntensity
		default = 0.05
	}
	SETTING
	{
		name = EnableLegacyBlendModes
		member = Waterfall.Settings.EnableLegacyBlendModes
		default = False
	}
	SETTING
	{
		name = ForceAllControllersAwake
		member = Waterfall.Settings.ForceAllControllersAwake
		default = False
	}
	SETTING
	{
		name = RandomControllersAwake
		member = Waterfall.Settings.RandomControllersAwake
		default = True
	}
	SETTING
	{
		name = ShowEffectEditor
		member = Waterfall.Settings.ShowEffectEditor
		default = False
	}
	SETTING
	{
		name = DebugModules
		member = Waterfall.Settings.DebugModules
		default = False
	}
	SETTING
	{
		name = DebugLoading
		member = Waterfall.Settings.DebugLoading
		default = False
	}
	SETTING
	{
		name = DebugSettings
		member = Waterfall.Settings.DebugSettings
		default = False
	}
	SETTING
	{
		name = DebugEffects
		member = Waterfall.Settings.DebugEffects
		default = False
	}
	SETTING
	{
		name = DebugModifiers
		member = Waterfall.Settings.DebugModifiers
		default = False
	}
	SETTING
	{
		name = DebugParticles
		member = Waterfall.Settings.DebugParticles
		default = False
	}
	SETTING
	{
		name = DebugMode
		member = Waterfall.Settings.DebugMode
		default = False
	}
	SETTING
	{
		name = DebugUIMode
		member = Waterfall.Settings.DebugUIMode
		default = False
	}

	// Its render queues, and the depth they are sorted over (ModuleWaterfallFX
	// divides the queue depth by it): its materials take them as they are made.
	SETTING
	{
		name = TransparentQueueBase
		member = Waterfall.Settings.TransparentQueueBase
		takesEffect = Restart
		default = 3000
	}
	SETTING
	{
		name = DistortQueue
		member = Waterfall.Settings.DistortQueue
		takesEffect = Restart
		default = 3002
	}
	SETTING
	{
		name = QueueDepth
		member = Waterfall.Settings.QueueDepth
		takesEffect = Restart
		default = 750
	}
	SETTING
	{
		name = SortedDepth
		member = Waterfall.Settings.SortedDepth
		takesEffect = Restart
		default = 1000
	}

	// What each graphics profile sets over the defaults: quality settings only. High
	// is the defaults; a block for it names only what High raises beyond them. Its
	// distortion stays on in every tier: one copy of the screen a frame, the named
	// GrabPass its distortion shader shares, while an engine runs.
	PROFILE
	{
		name = low
		EnableLights = False
	}
}
