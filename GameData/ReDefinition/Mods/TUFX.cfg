// TUFX (GPL-3.0 except where noted): its scene profiles as ReDefinition bundles
// them. Where a choice is kept and applied is its behaviour's. The main menu's
// choice is in its configuration, every other scene's in the loaded save, and a
// choice for the game is set into every save as it loads. Following a choice made
// in its own window is its behaviour's too. The profiles' contents, which its window edits, are
// authoring, not a player's setting, and stay its own. Its button is made through
// ToolbarControl, as "TUFX". Without one of its seven scenes it is not bundled
// (required).
//
// The format: docs/modders/registering-a-mod.md in ReDefinition's repository.

MOD_SETTINGS
{
	name = tufx
	title = TUFX
	detect = TUFX.TexturesUnlimitedFXLoader
	version = 1.1.1.0
	saving = PerSave
	toolbarControl = TUFX
	window = TUFX.ConfigurationGUI.updateWindow
	tab = Effects
	behaviour = Tufx

	// With Volumetric Clouds: its author's profile, with ambient occlusion and no
	// antialiasing, in every scene (its Readme: "Use my TUFX profile ... select the
	// profile ingame from TUFX menu").
	DEFAULTS
	{
		build = volumetric
		profileFlight = Blackrack_TUFX
		profileMap = Blackrack_TUFX
		profileInternal = Blackrack_TUFX
		profileEditor = Blackrack_TUFX
		profileSpaceCenter = Blackrack_TUFX
		profileTrackingStation = Blackrack_TUFX
		profileMainMenu = Blackrack_TUFX
	}
	// And every graphics profile sets it there: Volumetric Clouds is made with its
	// ambient occlusion.
	ALL_PROFILES
	{
		build = volumetric
		profileFlight = Blackrack_TUFX
		profileMap = Blackrack_TUFX
		profileInternal = Blackrack_TUFX
		profileEditor = Blackrack_TUFX
		profileSpaceCenter = Blackrack_TUFX
		profileTrackingStation = Blackrack_TUFX
		profileMainMenu = Blackrack_TUFX
	}

	SETTING
	{
		name = profileFlight
		required = True
		title = Profile in flight
		tooltip = TUFX's post-processing profile. In the scene it is for it changes at once, elsewhere when that scene is shown.
		takesEffect = Live
		kind = Taste
		default = Default-Flight
	}
	SETTING
	{
		name = profileMap
		required = True
		title = Profile in the map view
		tooltip = TUFX's post-processing profile. In the scene it is for it changes at once, elsewhere when that scene is shown.
		takesEffect = Live
		kind = Taste
		default = Default-Tracking
	}
	SETTING
	{
		name = profileInternal
		required = True
		title = Profile in IVA
		tooltip = TUFX's post-processing profile. In the scene it is for it changes at once, elsewhere when that scene is shown.
		takesEffect = Live
		kind = Taste
		default = Default-Internal
	}
	SETTING
	{
		name = profileEditor
		required = True
		title = Profile in the editors
		tooltip = TUFX's post-processing profile. In the scene it is for it changes at once, elsewhere when that scene is shown.
		takesEffect = Live
		kind = Taste
		default = Default-Editor
	}
	SETTING
	{
		name = profileSpaceCenter
		required = True
		title = Profile in the space centre
		tooltip = TUFX's post-processing profile. In the scene it is for it changes at once, elsewhere when that scene is shown.
		takesEffect = Live
		kind = Taste
		default = Default-KSC
	}
	SETTING
	{
		name = profileTrackingStation
		required = True
		title = Profile in the tracking station
		tooltip = TUFX's post-processing profile. In the scene it is for it changes at once, elsewhere when that scene is shown.
		takesEffect = Live
		kind = Taste
		default = Default-Tracking
	}
	// Kept in its configuration, for the game as a whole.
	SETTING
	{
		name = profileMainMenu
		required = True
		title = Profile in the main menu
		tooltip = TUFX's post-processing profile. In the scene it is for it changes at once, elsewhere when that scene is shown.
		takesEffect = Live
		kind = Taste
		perSave = False
		default = Default-MainMenu
	}
	// Whether TUFX shows its button: its Start asks it as the game starts, before
	// ModuleManagerPostLoad has read its configuration into it (TexturesUnlimitedFXLoader,
	// 1.1.1, decompiled), so it always holds its initialiser then.
	SETTING
	{
		name = ShowToolbarButton
		leftOut = TUFX 1.1.1 asks it before its configuration is read, so its value there never takes effect
	}
}
