// Deferred (GPL-3.0, Ghassen Lahmar): its settings as ReDefinition bundles them.
//
// Its settings are the instance its main-menu add-on loads in Start from the
// Deferred node (Deferred.settings), and nothing ever writes them to disk: what is
// set here is set again at every start, and what the reset sets holds for the run.
// At every scene load it sets up the screen-space reflections from them
// (OnSceneLoaded, HandleCameras) and hands the ambient values to its shaders as
// globals, which show at once when set. It has no toolbar button. Without either of
// its two reflection switches, it is not bundled (required).
//
// The format: docs/modders/registering-a-mod.md in ReDefinition's repository.

MOD_SETTINGS
{
	name = deferred
	title = Deferred
	detect = Deferred.Deferred
	version = 1.3.5.0

	SETTING
	{
		name = useScreenSpaceReflections
		required = True
		member = Deferred.Deferred.settings.useScreenSpaceReflections
		title = Screen-space reflections
		tooltip = Shiny surfaces reflect what is on screen.
		kind = Quality
		row = ShadowsAndReflections
		order = 70
		default = True
	}
	// Deferred has no window and no file of its own: set from here at every
	// start, by the profiles and the reset -- no row shows it.
	SETTING
	{
		name = useHalfResolutionScreenSpaceReflections
		required = True
		member = Deferred.Deferred.settings.useHalfResolutionScreenSpaceReflections
		title = Reflections at half resolution
		tooltip = Screen-space reflections traced at half resolution: faster, softer.
		kind = Quality
		default = True
	}

	// For the reset, not shown: its ambient light and dithered transparency, the
	// look a visual pack decides; its SMAA in the editors, which every profile
	// switches off (ALL_PROFILES); the keys of its debug window.
	SETTING
	{
		name = ambientBrightness
		member = Deferred.Deferred.settings.ambientBrightness
		shaderGlobal = deferredAmbientBrightness
		takesEffect = Live
		kind = Taste
		default = 0.9
	}
	SETTING
	{
		name = ambientTint
		member = Deferred.Deferred.settings.ambientTint
		shaderGlobal = deferredAmbientTint
		takesEffect = Live
		kind = Taste
		default = 0.7
	}
	SETTING
	{
		name = useDitheredTransparency
		member = Deferred.Deferred.settings.useDitheredTransparency
		kind = Taste
		default = False
	}
	SETTING
	{
		name = useSmaaInEditors
		member = Deferred.Deferred.settings.useSmaaInEditors
		default = True
	}
	// Its window opens on both modifiers and the key together
	// (Deferred.Update: GetKey(guiModifierKey1) && GetKey(guiModifierKey2) &&
	// GetKey(guiKey)), so one modifier goes into both members (modifiers = all).
	KEY
	{
		name = guiKey
		member = Deferred.Deferred.settings.guiKey
		modifier1 = Deferred.Deferred.settings.guiModifierKey1
		modifier2 = Deferred.Deferred.settings.guiModifierKey2
		modifiers = all
		title = Deferred's window
		tooltip = Opens Deferred's own window. Deferred needs at least one modifier with the key.
		takesEffect = Live
		order = 30
		default = LeftControl+LeftAlt+D
	}

	// With a cap on, Deferred writes KSP's own GameSettings at every scene load
	// (HandleStockProbe), KSP saves those, and switching the cap off again does
	// not raise what it lowered; KSP's reflection settings here follow the caps
	// its config file holds (KspBehaviour). A cap set for one run would leave that
	// lowering for good.
	SETTING
	{
		name = capReflectionProbeRefreshRate
		leftOut = Deferred lowers KSP's own reflection settings with it, which KSP saves -- left to its config, which KSP's reflection settings here follow
	}
	SETTING
	{
		name = capReflectionProbeResolution
		leftOut = Deferred lowers KSP's own reflection settings with it, which KSP saves -- left to its config, which KSP's reflection settings here follow
	}

	// What every graphics profile sets: its SMAA in the editors off, which smooths
	// the image before the upscaler receives it.
	ALL_PROFILES
	{
		useSmaaInEditors = False
	}

	// What each graphics profile sets over the defaults: quality settings only. High
	// is the defaults; a block for it names only what High raises beyond them.
	PROFILE
	{
		name = low
		useScreenSpaceReflections = False
	}
	PROFILE
	{
		name = ultra
		useHalfResolutionScreenSpaceReflections = False
	}
	PROFILE
	{
		name = max
		useHalfResolutionScreenSpaceReflections = False
	}
}
