// Parallax Continued (All Rights Reserved, Gameslinx): its settings as ReDefinition
// bundles them.
//
// Its global settings are the static ConfigLoader.parallaxGlobalSettings, read
// once while the game loads and saved by its window's Save button
// (ParallaxSettings.SaveSettings) -- as a value set here is. Its groups are
// structs, written back whole. After a change it does what its window does:
// tessellation and its range through UpdateTerrainMaterials, the blending and
// ambient occlusion through UpdateTerrainKeywords, the smooth planet shadows and
// their steps through UpdateScaledShadowMaterialSettings -- once a frame however
// many settings ask. Light shadows take effect when a part's light starts, planet
// shadows from afar when the scaled system is set up. Scatter density and distance
// are baked into every scatter: their behaviour bakes them again as the next scene
// is asked for.
//
// The format: docs/modders/registering-a-mod.md in ReDefinition's repository.

REDEFINITION_MOD
{
	name = parallax
	title = Parallax
	detect = Parallax.ConfigLoader
	// Its settings groups but the debug and object pool ones, which some builds lack:
	// without one, its settings object is of another shape, and nothing of it can be
	// trusted. A single member missing goes alone.
	needs = Parallax.ConfigLoader.parallaxGlobalSettings.terrainGlobalSettings, Parallax.ConfigLoader.parallaxGlobalSettings.scatterGlobalSettings, Parallax.ConfigLoader.parallaxGlobalSettings.lightingGlobalSettings, Parallax.ConfigLoader.parallaxGlobalSettings.scaledGlobalSettings
	version = 1.0.0.0
	save = Parallax.ConfigLoader.parallaxGlobalSettings.SaveSettings
	button = ParallaxContinued
	window = Parallax.ToolbarMenu.DrawWindow
	tab = Planets

	SETTING
	{
		name = maxTessellation
		member = Parallax.ConfigLoader.parallaxGlobalSettings.terrainGlobalSettings.maxTessellation
		after = Parallax.ToolbarMenu.UpdateTerrainMaterials
		title = Terrain tessellation
		tooltip = How finely Parallax subdivides the terrain up close. Lower is faster.
		takesEffect = Live
		kind = Quality
		min = 1
		max = 64
		whole = True
		default = 64
	}
	SETTING
	{
		name = maxTessellationRange
		member = Parallax.ConfigLoader.parallaxGlobalSettings.terrainGlobalSettings.maxTessellationRange
		after = Parallax.ToolbarMenu.UpdateTerrainMaterials
		title = Tessellation distance
		tooltip = How far out the terrain is subdivided. Cheap on its own; how cheap depends on the edge length Parallax uses.
		takesEffect = Live
		kind = Quality
		min = 10
		max = 200
		whole = True
		default = 30
	}
	// In steps of a hundredth, as Parallax's own free-text float field allows: the
	// useful range is narrow and 1.5 lies in it.
	SETTING
	{
		name = tessellationEdgeLength
		member = Parallax.ConfigLoader.parallaxGlobalSettings.terrainGlobalSettings.tessellationEdgeLength
		after = Parallax.ToolbarMenu.UpdateTerrainMaterials
		title = Tessellation detail falloff
		tooltip = How quickly the close-up terrain detail falls off with distance. Lower is finer and costs more; Parallax advises against going below 1. Its own default is 4.
		takesEffect = Live
		kind = Quality
		min = 1
		max = 16
		whole = False
		default = 4
	}
	SETTING
	{
		name = advancedTextureBlending
		member = Parallax.ConfigLoader.parallaxGlobalSettings.terrainGlobalSettings.advancedTextureBlending
		after = Parallax.ToolbarMenu.UpdateTerrainKeywords
		title = Height-based texture blending
		tooltip = Blends the terrain's textures by their height maps rather than straight across. Costs very little.
		takesEffect = Live
		kind = Quality
		default = True
	}
	SETTING
	{
		name = ambientOcclusion
		member = Parallax.ConfigLoader.parallaxGlobalSettings.terrainGlobalSettings.ambientOcclusion
		after = Parallax.ToolbarMenu.UpdateTerrainKeywords
		title = Terrain ambient occlusion
		tooltip = The shading baked into the terrain textures, where rock meets ground. Costs very little.
		takesEffect = Live
		kind = Quality
		default = True
	}
	SETTING
	{
		name = densityMultiplier
		member = Parallax.ConfigLoader.parallaxGlobalSettings.scatterGlobalSettings.densityMultiplier
		behaviour = ParallaxScatter
		title = Scatter density
		tooltip = How many rocks, trees and grass Parallax places. 2 doubles them, 0.5 halves them.
		kind = Quality
		row = Planets
		order = 80
		min = 0.1
		max = 3
		whole = False
		default = 1
	}
	SETTING
	{
		name = rangeMultiplier
		member = Parallax.ConfigLoader.parallaxGlobalSettings.scatterGlobalSettings.rangeMultiplier
		behaviour = ParallaxScatter
		title = Scatter distance
		tooltip = How far out the scatter is drawn. 2 doubles the distance -- four times the objects.
		kind = Quality
		min = 0.25
		max = 3
		whole = False
		default = 1
	}
	// Not baked into the scatters like the two above: Parallax hands it to the
	// scatter shader as the distribution is set up (ScatterData.SetDistributionVars).
	SETTING
	{
		name = fadeOutStartRange
		member = Parallax.ConfigLoader.parallaxGlobalSettings.scatterGlobalSettings.fadeOutStartRange
		title = Scatter fade-out start
		tooltip = How far out, as a share of the scatter distance, rocks and grass start to fade instead of vanishing at a hard edge. Parallax's own default is 0.8.
		kind = Quality
		min = 0.1
		max = 1
		whole = False
		default = 0.8
	}
	SETTING
	{
		name = lightShadows
		member = Parallax.ConfigLoader.parallaxGlobalSettings.lightingGlobalSettings.lightShadows
		title = Shadows from part lights
		tooltip = Part lights cast shadows. Costs frame rate with many lights.
		kind = Quality
		default = True
	}
	SETTING
	{
		name = lightShadowsQuality
		member = Parallax.ConfigLoader.parallaxGlobalSettings.lightingGlobalSettings.lightShadowsQuality
		title = Part light shadow quality
		tooltip = Resolution of the part lights' shadows.
		kind = Quality
		choices = Low, Medium, High, VeryHigh
		default = Medium
	}
	SETTING
	{
		name = scaledSpaceShadows
		member = Parallax.ConfigLoader.parallaxGlobalSettings.scaledGlobalSettings.scaledSpaceShadows
		title = Planet self-shadows from afar
		tooltip = Mountains cast shadows on their planet seen from orbit.
		takesEffect = Restart
		kind = Quality
		default = True
	}
	SETTING
	{
		name = smoothScaledSpaceShadows
		member = Parallax.ConfigLoader.parallaxGlobalSettings.scaledGlobalSettings.smoothScaledSpaceShadows
		after = Parallax.ToolbarMenu.UpdateScaledShadowMaterialSettings
		title = Smooth planet shadows from afar
		tooltip = Softens the planet shadows seen from orbit, at no cost. If they flicker, switch it off or raise the steps.
		takesEffect = Live
		kind = Quality
		default = True
	}
	SETTING
	{
		name = scaledRaymarchedShadowStepCount
		member = Parallax.ConfigLoader.parallaxGlobalSettings.scaledGlobalSettings.scaledRaymarchedShadowStepCount
		after = Parallax.ToolbarMenu.UpdateScaledShadowMaterialSettings
		title = Planet shadow quality from afar
		tooltip = Steps for the planet shadows seen from orbit. More is finer and costs more.
		takesEffect = Live
		kind = Quality
		min = 8
		max = 256
		whole = True
		default = 48
	}

	// Which of its scatter objects are solid, as its window's tooltip names the
	// levels (installed DLL, ToolbarMenu): a scatter collides where its own level is
	// at least this one, and -1 switches colliders off (ConfigLoader). Parallax
	// reads it as the game loads -- its window marks it "Restart Required". A matter
	// of play, not of quality: no profile sets it.
	SETTING
	{
		name = collisionLevel
		member = Parallax.ConfigLoader.parallaxGlobalSettings.scatterGlobalSettings.collisionLevel
		title = Scatter collisions
		tooltip = Which of Parallax's rocks, trees and grass are solid. Moderate CPU cost.\nHuge: only huge objects. Large: large ones and up. Most: most objects, Parallax's default.\nSmall: small rocks too. All: grass and foliage too.\nTakes effect after a restart.
		takesEffect = Restart
		row = Planets
		order = 100
		choices = -1, 4, 3, 2, 1, 0
		labels = Off, Huge, Large, Most, Small, All
		default = 2
	}

	// The rest of its settings file, for the reset -- not shown.
	SETTING
	{
		name = colliderLookaheadTime
		member = Parallax.ConfigLoader.parallaxGlobalSettings.scatterGlobalSettings.colliderLookaheadTime
		default = 0
	}
	SETTING
	{
		name = loadTexturesImmediately
		member = Parallax.ConfigLoader.parallaxGlobalSettings.scaledGlobalSettings.loadTexturesImmediately
		default = False
	}
	SETTING
	{
		name = wireframeTerrain
		member = Parallax.ConfigLoader.parallaxGlobalSettings.debugGlobalSettings.wireframeTerrain
		optional = this build of Parallax has no settings group debugGlobalSettings
		default = False
	}
	SETTING
	{
		name = suppressCriticalMessages
		member = Parallax.ConfigLoader.parallaxGlobalSettings.debugGlobalSettings.suppressCriticalMessages
		optional = this build of Parallax has no settings group debugGlobalSettings
		takesEffect = Live
		default = False
	}
	SETTING
	{
		name = cachedColliderCount
		member = Parallax.ConfigLoader.parallaxGlobalSettings.objectPoolSettings.cachedColliderCount
		optional = this build of Parallax has no settings group objectPoolSettings
		takesEffect = Restart
		default = 1000
	}

	// What Parallax needs of KSP's settings while it is installed. Its
	// ConfigLoader.CheckSettings (installed DLL, decompiled) shows an error popup
	// unless the terrain detail preset is the list's last, and warns in a popup
	// above 256 for the reflections; its installation instructions, steps 10 and 11,
	// ask for the highest terrain detail and reflections "Minimum (NOT off!)". It
	// removes KSP's scatter on Eeloo only and never reads PLANET_SCATTER: elsewhere
	// both are drawn.
	REQUIRES
	{
		setting = ksp.terrainDetail
		highest = True
		lock = True
		reason = Parallax needs KSP's highest terrain detail -- otherwise it shows an installation error at every start.
	}
	REQUIRES
	{
		setting = ksp.PLANET_SCATTER
		equals = False
		lock = True
		reason = Parallax brings its own scatter -- KSP's would be drawn beside it for nothing.
	}
	REQUIRES
	{
		setting = ksp.REFLECTION_PROBE_TEXTURE_RESOLUTION
		atMost = 1
		reason = Parallax warns at every start about reflection resolutions above 256.
	}
	REQUIRES
	{
		setting = ksp.REFLECTION_PROBE_REFRESH_MODE
		atLeast = 1
		reason = Parallax's installation asks for reflections at their minimum, not off.
	}

	// What each graphics profile sets over the defaults: quality settings only. High
	// is the defaults; a block for it names only what High raises beyond them.
	PROFILE
	{
		name = low
		maxTessellation = 16
		tessellationEdgeLength = 8
		maxTessellationRange = 20
		densityMultiplier = 0.5
		rangeMultiplier = 0.6
		lightShadows = False
		lightShadowsQuality = Low
		scaledRaymarchedShadowStepCount = 24
	}
	PROFILE
	{
		name = medium
		maxTessellation = 32
		tessellationEdgeLength = 6
		densityMultiplier = 0.75
		rangeMultiplier = 0.8
		lightShadowsQuality = Low
		scaledRaymarchedShadowStepCount = 32
	}
	PROFILE
	{
		name = ultra
		tessellationEdgeLength = 3
		maxTessellationRange = 50
		densityMultiplier = 1.5
		rangeMultiplier = 1.25
		lightShadowsQuality = High
		scaledRaymarchedShadowStepCount = 64
	}
	PROFILE
	{
		name = max
		tessellationEdgeLength = 2
		maxTessellationRange = 80
		densityMultiplier = 2
		rangeMultiplier = 1.5
		lightShadowsQuality = VeryHigh
		scaledRaymarchedShadowStepCount = 96
	}
}
