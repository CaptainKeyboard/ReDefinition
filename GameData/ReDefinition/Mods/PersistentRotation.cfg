// Persistent Rotation Upgraded (GPL-3.0, Markus Appel, linuxgurugamer): its settings as
// ReDefinition bundles them. Its source read at tag 1.9.2.1.
//
// Its interface lives in flight only: Interface, a flight add-on with a static
// instance, keeps whether its window shows (disabled, which its toolbar button
// toggles) and saves it with its window's places to PluginData/Config.cfg
// (SaveGUI, also as the flight scene ends). Data, likewise a flight add-on, keeps
// the default reference body per save with the vessels' data (Data.Save, at every
// game save). Its toolbar button, which only toggles the window, is hidden
// (ToolbarHides): the window's row stands here instead. Its default is the row's
// value, inverted into disabled: shown, as disabled starts false.
//
// Left out: the visibility mode, which its Awake ignores -- it makes its toolbar
// button in every mode -- and the windows' places, which are its own.
//
// The format: docs/modders/registering-a-mod.md in ReDefinition's repository.

MOD_SETTINGS
{
	name = persistentrotation
	title = Persistent Rotation
	detect = PersistentRotation.Interface
	version = 1.9.2.1
	ready = PersistentRotation.Interface.instance
	save = PersistentRotation.Interface.instance.SaveGUI

	SETTING
	{
		name = window
		member = PersistentRotation.Interface.instance.disabled
		invert = True
		title = Persistent Rotation window
		tooltip = Shows Persistent Rotation's window in flight, where each vessel's rotation and momentum are kept through time warp.
		takesEffect = Live
		row = Gameplay
		order = 120
		section = Flight
		default = True
		bundled = False
	}
	SETTING
	{
		name = defaultReference
		member = PersistentRotation.Data.instance.defaultReferenceMode
		title = Default reference body
		tooltip = What a vessel keeps its rotation against when Persistent Rotation first meets it: None keeps it fixed in space, Dynamic against the body it orbits. Its window picks another for each vessel.
		takesEffect = Live
		row = Gameplay
		order = 121
		section = Flight
		choices = NONE, DYNAMIC
		labels = None, Dynamic
		default = NONE
		bundled = False
	}
	SETTING
	{
		name = visibilityMode
		leftOut = Its Awake makes the toolbar button in every mode; ReDefinition hides that button.
	}
}
