// Scatterer (GPL-3.0, Ghassen Lahmar): its main settings as ReDefinition bundles
// them. How a value reaches its running object, its node and its file is its
// behaviour's; the effects read these as they are built (SkyNode, OceanNode,
// ProlandManager): from the next scene on. Every field its file keeps is bundled --
// the ones not shown for the reset and the profiles, its TAA and SMAA among them,
// which every profile switches off (ALL_PROFILES) and HostStack takes at run time
// while a profile is chosen. A build without one of the settings with a title that are not
// optional is not the shape these were read from, and Scatterer is not bundled
// (required); the rest go alone.
//
// The format: docs/modders/registering-a-mod.md in ReDefinition's repository.

MOD_SETTINGS
{
	name = scatterer
	title = Scatterer
	detect = Scatterer.Scatterer
	saving = InModFiles
	button = scatterer
	window = Scatterer.GUIhandler.DrawScattererWindow
	tab = Planets
	behaviour = Scatterer

	// Volumetric Clouds' build has its raymarched light shafts among its main
	// settings; the public build has not (both decompiled).
	BUILD
	{
		name = volumetric
		has = Scatterer.MainSettingsReadWrite.useRaymarchedCloudGodrays
	}
	BUILD
	{
		name = public
		has = Scatterer.MainSettingsReadWrite
	}
	// Scatterer 0.878, the public release: the settings' own defaults.
	DEFAULTS
	{
		build = public
		version = 0.878.0.0
	}
	// Scatterer 0.908, as Volumetric Clouds ships it.
	DEFAULTS
	{
		build = volumetric
		version = 0.908.0.0
		oceanPixelLights = True
		taaStationaryBlending = 0.75
		useDithering = False
		m_fourierGridSize = 256
		oceanScreenSpaceReflections = True
		useRaymarchedCloudGodrays = True
		useRaymarchedTerrainGodrays = False
		raymarchedGodraysStepCount = 50
		raymarchedGodraysScreenshotDenoisingIterations = 10
	}

	SETTING
	{
		name = useOceanShaders
		required = True
		title = Ocean
		tooltip = Scatterer's ocean: waves, reflections and refraction.\nOff: KSP's own water.
		kind = Quality
		row = Planets
		order = 30
		default = True
	}
	SETTING
	{
		name = oceanFoam
		required = True
		title = Foam
		tooltip = Foam on the crests of the waves.
		kind = Quality
		default = True
	}
	SETTING
	{
		name = oceanTransparencyAndRefractions
		required = True
		title = Transparency and refraction
		tooltip = See into the water, bent by the waves.
		kind = Quality
		default = True
	}
	SETTING
	{
		name = oceanSkyReflections
		required = True
		title = Sky reflections
		tooltip = The sky mirrored on the water.
		kind = Quality
		default = True
	}
	SETTING
	{
		name = oceanCaustics
		required = True
		title = Caustics
		tooltip = Rippling light on the sea floor.
		kind = Quality
		default = True
	}
	SETTING
	{
		name = oceanLightRays
		required = True
		title = Underwater light rays
		tooltip = Shafts of light below the surface.
		kind = Quality
		default = True
	}
	SETTING
	{
		name = shadowsOnOcean
		required = True
		title = Shadows on the ocean
		tooltip = Craft and terrain cast shadows on the water.
		kind = Quality
		default = True
	}
	SETTING
	{
		name = oceanPixelLights
		required = True
		title = Lights on the ocean
		tooltip = Part lights shine on the water. Costs frame rate with many lights.
		kind = Quality
		default = False
	}
	SETTING
	{
		name = underwaterLightDimming
		required = True
		title = Darker under water
		tooltip = Light fades with depth.
		kind = Taste
		default = True
	}
	SETTING
	{
		name = m_fourierGridSize
		required = True
		title = Wave detail
		tooltip = The resolution of the wave simulation. Higher is finer and slower.
		kind = Quality
		choices = 32, 64, 128, 256, 512
		default = 128
	}
	SETTING
	{
		name = oceanMeshResolution
		required = True
		title = Ocean mesh resolution
		tooltip = Scatterer's resolution setting for the ocean's surface mesh.
		kind = Quality
		min = 2
		max = 16
		whole = True
		default = 6
	}
	SETTING
	{
		name = oceanScreenSpaceReflections
		optional = only Volumetric Clouds' build of Scatterer has it
		title = Screen-space reflections on the ocean
		tooltip = The ocean reflects what is on screen -- craft, coast and clouds.\nNeeds Deferred: Scatterer registers its ocean with Deferred's screen-space reflections (OceanRenderer.RegisterOrUnregisterSSR, DeferredReflectionHandler), and does nothing without it.
		kind = Quality
		default = False
	}
	SETTING
	{
		name = fullLensFlareReplacement
		required = True
		title = Sun flare
		tooltip = Scatterer's flare around the sun, in place of KSP's.
		kind = Taste
		row = Effects
		order = 50
		default = True
	}
	SETTING
	{
		name = sunlightExtinction
		required = True
		title = Sunlight through the atmosphere
		tooltip = Sunlight dims and reddens on its way through the atmosphere, towards sunset most.
		kind = Taste
		default = True
	}
	// Named although Scatterer does not save it: its behaviour drops it, and its
	// name is then in the log and in the check. Its [Persistent] mark is commented out
	// in 0.908; `optional`, so a build without the field leaves it out without a word.
	SETTING
	{
		name = quarterResScattering
		optional = True
		title = Scattering at quarter resolution
		tooltip = Scatterer works the atmosphere's light out for a quarter of the pixels: faster, a little softer.
		kind = Quality
	}
	SETTING
	{
		name = useDithering
		required = True
		title = Dithering
		tooltip = Breaks up colour banding in the sky and the sea.
		kind = Taste
		default = True
	}
	SETTING
	{
		name = useLowResolutionAtmosphere
		required = True
		title = Atmosphere tables at low resolution
		tooltip = Scatterer works its atmosphere out into smaller lookup tables: quicker to build and lighter on memory.\nIts own label offers this for machines where the sky washes out to white.
		default = False
	}
	SETTING
	{
		name = disableAmbientLight
		required = True
		title = No ambient light in scaled space
		tooltip = On: Scatterer takes KSP's ambient light out of the scaled view, so the unlit side of a planet stays dark.\nOff: KSP's own ambient light there stays as it is.
		kind = Taste
		default = True
	}
	SETTING
	{
		name = useLegacyTerrainGodrays
		required = True
		title = Legacy light shafts over the terrain
		tooltip = Scatterer's older light shafts over the ground.\nNeeds the long-distance terrain shadows, a shadow resolution set here rather than KSP's own, DirectX 11 and KSP's unified camera; without those it does nothing.
		default = False
	}
	SETTING
	{
		name = integrateWithEVEClouds
		required = True
		title = Atmospheric light on EVE's clouds
		tooltip = EVE's clouds take Scatterer's atmospheric light and colour.
		kind = Taste
		default = True
	}
	SETTING
	{
		name = useRaymarchedCloudGodrays
		optional = only Volumetric Clouds' build of Scatterer has it
		title = Light shafts through clouds
		tooltip = Sunbeams through gaps in EVE's volumetric clouds.
		kind = Quality
		row = Planets
		order = 20
		default = False
	}
	SETTING
	{
		name = raymarchedGodraysStepCount
		optional = only Volumetric Clouds' build of Scatterer has it
		title = Light shaft quality
		tooltip = Steps per light shaft. More is smoother and slower.
		kind = Quality
		min = 10
		max = 100
		whole = True
		default = 50
	}
	SETTING
	{
		name = useEclipses
		required = True
		title = Eclipses
		tooltip = Planets and moons darken the atmosphere of what they eclipse.
		kind = Quality
		default = True
	}
	SETTING
	{
		name = useRingShadows
		required = True
		title = Ring shadows
		tooltip = Planetary rings cast their shadow.
		kind = Quality
		default = True
	}
	SETTING
	{
		name = terrainShadows
		required = True
		title = Long-distance terrain shadows
		tooltip = Scatterer's shadow setup: terrain shadows far into the distance.
		kind = Quality
		row = ShadowsAndReflections
		order = 20
		default = False
	}
	SETTING
	{
		name = unifiedCamShadowsDistance
		required = True
		title = Terrain shadow distance
		tooltip = How far the long-distance terrain shadows reach, in metres.
		kind = Quality
		min = 5000
		max = 200000
		whole = True
		default = 50000
	}
	SETTING
	{
		name = unifiedCamShadowResolutionOverride
		required = True
		title = Terrain shadow resolution
		tooltip = Resolution of the long-distance shadow map. KSP's own is the game's shadow setting.
		kind = Quality
		choices = 0, 2048, 4096, 8192, 16384
		labels = KSP's own, 2048, 4096, 8192, 16384
		default = 8192
	}

	// Every other field its file keeps, not shown -- but for the waves' pull on
	// vessels, a matter of play.
	SETTING
	{
		name = autosavePlanetSettingsOnSceneChange
		default = False
	}
	SETTING
	{
		name = overrideNearClipPlane
		default = False
	}
	SETTING
	{
		name = nearClipPlane
		default = 0.21
	}
	SETTING
	{
		name = oceanCraftWaveInteractions
		required = True
		title = Waves move vessels
		tooltip = Scatterer's waves lift and rock floating vessels. Needs Scatterer's ocean and DirectX 11.
		kind = Other
		row = Planets
		order = 35
		default = True
	}
	// The public build's only.
	SETTING
	{
		name = oceanCraftWaveInteractionsOverrideWaterCrashTolerance
		optional = True
		default = True
	}
	SETTING
	{
		name = buoyancyCrashToleranceMultOverride
		optional = True
		default = 3.6
	}
	SETTING
	{
		name = oceanCraftWaveInteractionsOverrideDrag
		optional = True
		default = True
	}
	SETTING
	{
		name = oceanCraftWaveInteractionsOverrideRecoveryVelocity
		default = True
	}
	SETTING
	{
		name = waterMaxRecoveryVelocity
		default = 5
	}
	SETTING
	{
		name = showMenuOnStart
		default = False
	}
	SETTING
	{
		name = d3d11ShadowFix
		default = True
	}
	// Volumetric Clouds' build's only.
	SETTING
	{
		name = useRaymarchedTerrainGodrays
		optional = True
		kind = Quality
		default = False
	}
	SETTING
	{
		name = raymarchedGodraysScreenshotDenoisingIterations
		optional = True
		default = 10
	}
	SETTING
	{
		name = useSubpixelMorphologicalAntialiasing
		default = True
	}
	SETTING
	{
		name = smaaQuality
		default = 2
	}
	SETTING
	{
		name = useTemporalAntiAliasing
		default = True
	}
	SETTING
	{
		name = taaStationaryBlending
		default = 0.9
	}
	SETTING
	{
		name = taaMotionBlending
		default = 0.65
	}
	SETTING
	{
		name = taaJitterSpread
		default = 0.8
	}
	SETTING
	{
		name = taaSharpness
		default = 0.28
	}
	SETTING
	{
		name = disableTaaBelowFrameRateThreshold
		default = 26
	}
	SETTING
	{
		name = scatteringTonemapper
		kind = Taste
		default = 2
	}
	SETTING
	{
		name = unifiedCamShadowNormalBiasOverride
		default = 0
	}
	SETTING
	{
		name = unifiedCamShadowBiasOverride
		default = 0
	}
	SETTING
	{
		name = unifiedCamShadowCascadeSplitsOverride
		default = 0.0015,0.015,0.15
	}
	SETTING
	{
		name = dualCamShadowsDistance
		kind = Quality
		default = 50000
	}
	SETTING
	{
		name = dualCamShadowNormalBiasOverride
		default = 0.72
	}
	SETTING
	{
		name = dualCamShadowBiasOverride
		default = 0.5
	}
	SETTING
	{
		name = dualCamShadowResolutionOverride
		kind = Quality
		default = 0
	}
	SETTING
	{
		name = dualCamShadowCascadeSplitsOverride
		default = 0.005,0.025,0.125
	}

	// What every graphics profile sets, whatever its tier: Scatterer's own
	// antialiasing off. The upscaler antialiases the image; Scatterer's TAA jitters
	// the cameras a second time, and its SMAA smooths the image before the upscaler
	// receives it.
	// Scatterer builds both as a scene loads, so from the next scene on.
	ALL_PROFILES
	{
		useTemporalAntiAliasing = False
		useSubpixelMorphologicalAntialiasing = False
	}

	// What each graphics profile sets over the defaults: quality settings only. High
	// is the defaults; a block for it names only what High raises beyond them.
	// A step only where it saves frame time. What Scatterer's own lower presets
	// switch off but costs little at Low stays on in every tier (0.908's code,
	// decompiled): foam, an FFT of three more buffers and two foam maps with their
	// mipmaps a frame, all at the wave grid's size, 64 at Low (OceanWhiteCaps);
	// caustics, a pass on the sun's shadow mask below 6 km; underwater light rays,
	// drawn under water only; ring shadows, Kopernicus' rings only; eclipses, a branch
	// in the atmosphere shaders and one more material on the planets seen from afar,
	// where a body can cast one (SkyNode); shadows on the ocean, passes at half
	// resolution (OceanCommandBuffer); Volumetric Clouds' lights on the ocean, whose
	// cost its deferred ocean "removes" (its changelog, 3.0.0). Transparency and
	// refraction copy the screen for each of Scatterer's cameras in the public build
	// (OceanRenderingHook, in its repository), and stay on; Volumetric Clouds' build
	// traces them "using an SSR-like method" (the same changelog), and Low switches
	// them off there. Its screen-space reflections on the ocean are traced along with
	// Deferred's, at Deferred's resolution, half by default: off below High.
	PROFILE
	{
		name = low
		m_fourierGridSize = 64
		oceanMeshResolution = 8
	}
	PROFILE
	{
		name = low
		build = volumetric
		oceanTransparencyAndRefractions = False
		oceanScreenSpaceReflections = False
		useRaymarchedCloudGodrays = False
	}
	PROFILE
	{
		name = medium
		build = public
		m_fourierGridSize = 64
	}
	PROFILE
	{
		name = medium
		build = volumetric
		m_fourierGridSize = 128
		oceanScreenSpaceReflections = False
		useRaymarchedCloudGodrays = False
	}
	PROFILE
	{
		name = ultra
		oceanMeshResolution = 4
		terrainShadows = True
		unifiedCamShadowsDistance = 25000
		unifiedCamShadowResolutionOverride = 4096
		dualCamShadowsDistance = 30000
	}
	PROFILE
	{
		name = ultra
		build = volumetric
		useRaymarchedTerrainGodrays = True
	}
	PROFILE
	{
		name = max
		oceanMeshResolution = 4
		terrainShadows = True
	}
	PROFILE
	{
		name = max
		build = public
		m_fourierGridSize = 256
	}
	PROFILE
	{
		name = max
		build = volumetric
		useRaymarchedTerrainGodrays = True
	}
}
