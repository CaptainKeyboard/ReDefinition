// KSP's own graphics settings (KSP 1.12.5, decompiled) as ReDefinition bundles them:
// its graphics screen without the resolution and full screen, which belong to the
// monitor. What follows a change, the terrain detail preset, and what another mod
// holds for itself are its behaviour's.
//
// The format: docs/modders/registering-a-mod.md in ReDefinition's repository.

MOD_SETTINGS
{
	name = ksp
	title = KSP
	detect = GameSettings
	version = 1.12.5
	save = GameSettings.SaveSettings
	behaviour = Ksp

	// KSP keeps Unity's own level names (Fastest ... Fantastic, read from its
	// build's quality settings).
	SETTING
	{
		name = QUALITY_PRESET
		member = GameSettings.QUALITY_PRESET
		title = Render quality
		tooltip = Unity's quality level KSP renders with: it sets the shadow distance and resolution among others. Lower levels cost less and lose shadow detail.
		takesEffect = Live
		kind = Quality
		row = General
		order = 10
		choices = 0, 1, 2, 3, 4, 5
		labels = Fastest, Fast, Simple, Good, Beautiful, Fantastic
		default = 5
	}
	// Lowest on the left: KSP counts its mipmap limit the other way.
	SETTING
	{
		name = TEXTURE_QUALITY
		member = GameSettings.TEXTURE_QUALITY
		title = Texture quality
		tooltip = Lower drops the finest mipmap levels: less video memory, softer textures.
		takesEffect = Live
		kind = Quality
		row = General
		order = 20
		choices = 3, 2, 1, 0
		labels = Eighth, Quarter, Half, Full
		default = 1
	}
	// Deferred sets Unity's count to at least 64 at every scene load
	// (Deferred.OnSceneLoaded, from its source).
	SETTING
	{
		name = LIGHT_QUALITY
		member = GameSettings.LIGHT_QUALITY
		title = Pixel light count
		tooltip = How many lights shine per pixel on forward-rendered surfaces. Deferred raises it to at least 64 at every scene change and lights most surfaces regardless.
		takesEffect = Live
		kind = Quality
		min = 0
		max = 64
		whole = True
		default = 8
	}
	// Next to frame generation, whose tooltip asks for them.
	SETTING
	{
		name = SYNC_VBL
		member = GameSettings.SYNC_VBL
		title = V-Sync
		tooltip = Waits for the monitor's refresh before showing a frame.\nWith frame generation: on for even frames, on a fixed refresh rate and with G-Sync or FreeSync alike.\nOff: in full screen frames can tear, with G-Sync and FreeSync too.
		takesEffect = Live
		row = General
		order = 30
		choices = 0, 1, 2
		labels = Off, Every refresh, Every second refresh
		default = 1
	}
	// KSP's own choices (VideoSettings: "Default", which is no limit, and 60 ... 180
	// FPS); KSP's own reset sets 120 (GameSettings).
	SETTING
	{
		name = FRAMERATE_LIMIT
		member = GameSettings.FRAMERATE_LIMIT
		title = Frame limit
		tooltip = The most frames per second KSP renders.
		takesEffect = Live
		row = General
		order = 40
		choices = -1, 60, 80, 100, 120, 140, 180
		labels = None, 60, 80, 100, 120, 140, 180
		default = 120
	}
	SETTING
	{
		name = SHADOWS_QUALITY
		member = GameSettings.SHADOWS_QUALITY
		title = Shadow cascades
		tooltip = More cascades keep shadows sharp near the camera, at some cost.
		takesEffect = Live
		kind = Quality
		row = ShadowsAndReflections
		order = 10
		choices = 0, 2, 4
		default = 4
	}
	SETTING
	{
		name = CELESTIAL_BODIES_CAST_SHADOWS
		member = GameSettings.CELESTIAL_BODIES_CAST_SHADOWS
		title = Planets cast shadows
		tooltip = Terrain and planets cast shadows. KSP's own scatter takes it at once, the terrain from the next scene on, and the planets seen from afar at the next start of KSP.
		kind = Quality
		default = True
	}
	SETTING
	{
		name = terrainDetail
		title = Terrain detail
		tooltip = How finely KSP subdivides a planet's surface. Parallax's author recommends High. A change can move the ground slightly under landed vessels.
		kind = Quality
		row = Planets
		order = 50
		default = Default
	}
	// No default: KSP's own reset leaves it as it is, and no code of KSP assigns one.
	SETTING
	{
		name = TERRAIN_SHADER_QUALITY
		member = GameSettings.TERRAIN_SHADER_QUALITY
		title = Terrain shader quality
		tooltip = The shaders KSP draws the terrain with. Ultra applies to some planets only, and with Parallax it is what turns tessellation on.
		kind = Quality
		choices = 0, 1, 2, 3
		labels = Low, Medium, High, Ultra
	}
	SETTING
	{
		name = PLANET_SCATTER
		member = GameSettings.PLANET_SCATTER
		title = Terrain scatter
		tooltip = KSP's own rocks and trees on the ground. Parallax brings its own.
		kind = Quality
		default = False
	}
	SETTING
	{
		name = PLANET_SCATTER_FACTOR
		member = GameSettings.PLANET_SCATTER_FACTOR
		title = Terrain scatter density
		tooltip = How many of KSP's own rocks and trees are placed.
		kind = Quality
		min = 0
		max = 1
		whole = False
		default = 0.5
	}
	// Firefly sets it to its lowest itself (its AssetLoader).
	SETTING
	{
		name = AERO_FX_QUALITY
		member = GameSettings.AERO_FX_QUALITY
		leftOutWith = firefly
		title = Aerodynamic FX
		tooltip = KSP's own re-entry and mach effects.
		kind = Quality
		row = Effects
		order = 10
		choices = 0, 1, 2, 3
		labels = Minimal, Very low, Low, Normal
		default = 3
	}
	SETTING
	{
		name = SURFACE_FX
		member = GameSettings.SURFACE_FX
		title = Surface FX
		tooltip = Dust and spray kicked up by engines close to the ground.
		kind = Quality
		default = True
	}
	SETTING
	{
		name = REFLECTION_PROBE_REFRESH_MODE
		member = GameSettings.REFLECTION_PROBE_REFRESH_MODE
		title = Reflection refresh
		tooltip = How often KSP renders the scene into its reflection probe.
		takesEffect = Live
		kind = Quality
		choices = 0, 1, 2, 3
		labels = Off, Low, Medium, Every frame
		default = 0
	}
	SETTING
	{
		name = REFLECTION_PROBE_TEXTURE_RESOLUTION
		member = GameSettings.REFLECTION_PROBE_TEXTURE_RESOLUTION
		title = Reflection resolution
		tooltip = The size of KSP's reflection probe.
		takesEffect = Live
		kind = Quality
		choices = 0, 1, 2, 3, 4
		labels = 128, 256, 512, 1024, 2048
		default = 1
	}

	// The rest of KSP's graphics screen (its fields in sharedassets3.assets), for the
	// reset: not shown, set as its own screen sets them.
	SETTING
	{
		name = ANTI_ALIASING
		member = GameSettings.ANTI_ALIASING
		default = 2
	}
	SETTING
	{
		name = AMBIENTLIGHT_BOOSTFACTOR
		member = GameSettings.AMBIENTLIGHT_BOOSTFACTOR
		kind = Taste
		default = 0
	}
	SETTING
	{
		name = AMBIENTLIGHT_BOOSTFACTOR_MAPONLY
		member = GameSettings.AMBIENTLIGHT_BOOSTFACTOR_MAPONLY
		kind = Taste
		default = 0
	}
	SETTING
	{
		name = AMBIENTLIGHT_BOOSTFACTOR_EDITONLY
		member = GameSettings.AMBIENTLIGHT_BOOSTFACTOR_EDITONLY
		kind = Taste
		default = 0
	}
	SETTING
	{
		name = FALLBACK_UNDERWATER_MODE
		member = GameSettings.FALLBACK_UNDERWATER_MODE
		default = 1
	}
	SETTING
	{
		name = HIGHLIGHT_FX
		member = GameSettings.HIGHLIGHT_FX
		default = True
	}
	SETTING
	{
		name = INFLIGHT_HIGHLIGHT
		member = GameSettings.INFLIGHT_HIGHLIGHT
		default = True
	}
	SETTING
	{
		name = PART_HIGHLIGHTER_BRIGHTNESSFACTOR
		member = GameSettings.PART_HIGHLIGHTER_BRIGHTNESSFACTOR
		default = 1
	}
	SETTING
	{
		name = CONIC_PATCH_DRAW_MODE
		member = GameSettings.CONIC_PATCH_DRAW_MODE
		default = 3
	}
	SETTING
	{
		name = CONIC_PATCH_LIMIT
		member = GameSettings.CONIC_PATCH_LIMIT
		default = 3
	}
	SETTING
	{
		name = ORBIT_FADE_STRENGTH
		member = GameSettings.ORBIT_FADE_STRENGTH
		default = 1
	}
	SETTING
	{
		name = ORBIT_FADE_DIRECTION_INV
		member = GameSettings.ORBIT_FADE_DIRECTION_INV
		default = False
	}
	SETTING
	{
		name = ALWAYS_SHOW_TARGET_APPROACH_MARKERS
		member = GameSettings.ALWAYS_SHOW_TARGET_APPROACH_MARKERS
		default = False
	}
	SETTING
	{
		name = COMMNET_LOWCOLOR_BRIGHTNESSFACTOR
		member = GameSettings.COMMNET_LOWCOLOR_BRIGHTNESSFACTOR
		default = 0.5
	}

	// V-Sync while DLSS frame generation runs, as NVIDIA's DLSS-G programming guide
	// has it (22.1, 22.2): every refresh at most, and none with a build of DLSS-G
	// that does not support V-Sync. Judged while ReDefinition's frame generation is
	// on and DLSS presents it (KspBehaviour.Check); any value passes otherwise.
	REQUIRES
	{
		setting = ksp.SYNC_VBL
		check = DlssFrameGenerationEveryRefresh
		fix = 1
		reason = While DLSS frame generation runs, V-Sync shows every refresh at most -- NVIDIA supports no other interval with it.
	}
	REQUIRES
	{
		setting = ksp.SYNC_VBL
		check = DlssFrameGenerationVSync
		fix = 0
		reason = Where DLSS frame generation runs in a build that does not support V-Sync, V-Sync is off.
	}

	// What each graphics profile sets over the defaults: quality settings only. High
	// is the defaults; a block for it names only what High raises beyond them. Surface
	// FX stay on in every tier: the dust engines raise near the ground, only while they
	// fire (ModuleSurfaceFX).
	PROFILE
	{
		name = low
		QUALITY_PRESET = 4
		TEXTURE_QUALITY = 1
		LIGHT_QUALITY = 4
		SHADOWS_QUALITY = 2
		terrainDetail = Low
		TERRAIN_SHADER_QUALITY = 2
		AERO_FX_QUALITY = 2
		REFLECTION_PROBE_REFRESH_MODE = 1
		REFLECTION_PROBE_TEXTURE_RESOLUTION = 0
	}
	PROFILE
	{
		name = medium
		TEXTURE_QUALITY = 0
		terrainDetail = Default
		TERRAIN_SHADER_QUALITY = 3
		REFLECTION_PROBE_REFRESH_MODE = 1
	}
	PROFILE
	{
		name = high
		TEXTURE_QUALITY = 0
		terrainDetail = High
		TERRAIN_SHADER_QUALITY = 3
		REFLECTION_PROBE_REFRESH_MODE = 1
	}
	PROFILE
	{
		name = ultra
		TEXTURE_QUALITY = 0
		LIGHT_QUALITY = 16
		terrainDetail = High
		TERRAIN_SHADER_QUALITY = 3
		REFLECTION_PROBE_REFRESH_MODE = 1
	}
	PROFILE
	{
		name = max
		TEXTURE_QUALITY = 0
		LIGHT_QUALITY = 32
		terrainDetail = High
		TERRAIN_SHADER_QUALITY = 3
		REFLECTION_PROBE_REFRESH_MODE = 1
	}
}
