// Distant Object Enhancement /L (SKL 1.0 or GPL-2.0): its settings as ReDefinition
// bundles them. Kept per save by the mod: a choice here is for the game, set into
// every save as it loads. Committing its switches, its window's copy of the
// settings, its fonts and its hooks are its behaviour's.
//
// Its window opens from here through Advanced, for what the settings window does
// not show: the flares' look, the sky darkening's values, the names' size and font.
// Its debug mode and toolbar switches are bundled for the reset only. What
// useToolbar asks for, a button on Blizzy's toolbar, stays there as every mod's
// does; its launcher button, where it has one, is hidden. Left out: the situations
// its flares show in, a list its Load never reads back.
//
// The format: docs/modders/registering-a-mod.md in ReDefinition's repository.

MOD_SETTINGS
{
	name = distantobject
	title = Distant Object
	detect = DistantObject.Settings
	// Its settings groups: without one, its settings object is of another shape, where
	// nothing is safe to set. A single member missing goes alone.
	needs = DistantObject.Settings.DistantFlare, DistantObject.Settings.FlyOver, DistantObject.Settings.DistantVessel, DistantObject.Settings.SkyboxBrightness
	version = 2.2.1.7 /L
	saving = PerSave
	save = DistantObject.Settings.Instance.Save
	button = DistantObject
	window = DistantObject.SettingsGui.mainGUI
	tab = Effects
	behaviour = DistantObject

	SETTING
	{
		name = flaresEnabled
		member = DistantObject.Settings.Instance.DistantFlare.flaresEnabled
		title = Flares for planets and vessels
		tooltip = Planets and vessels too far away to see show as points of light. Cheap: a sprite for each.
		takesEffect = Live
		kind = Taste
		row = Effects
		order = 60
		default = True
	}
	SETTING
	{
		name = flareBrightness
		member = DistantObject.Settings.Instance.DistantFlare.flareBrightness
		title = Flare brightness
		tooltip = How bright the flares of planets and vessels shine.
		takesEffect = Live
		kind = Taste
		min = 0
		max = 1
		whole = False
		default = 1
	}
	SETTING
	{
		name = flareSize
		member = DistantObject.Settings.Instance.DistantFlare.flareSize
		title = Flare size
		tooltip = How large the flares are drawn.
		takesEffect = Live
		kind = Taste
		min = 0.5
		max = 1.5
		whole = False
		default = 1
	}
	SETTING
	{
		name = showNames
		member = DistantObject.Settings.Instance.DistantFlare.showNames
		title = Names on flares
		tooltip = Pointing at a flare shows the name of its planet or vessel. Not in the map view, and only with the flares on.
		takesEffect = Live
		kind = Other
		row = Effects
		order = 65
		default = True
	}
	SETTING
	{
		name = ignoreDebrisFlare
		member = DistantObject.Settings.Instance.DistantFlare.ignoreDebrisFlare
		title = No flares for debris
		tooltip = Debris gets no flare of its own.
		takesEffect = Live
		kind = Taste
		default = False
	}
	SETTING
	{
		name = debrisBrightness
		member = DistantObject.Settings.Instance.DistantFlare.debrisBrightness
		title = Debris flare brightness
		tooltip = How bright the flares of debris shine, as a share of other vessels' flares.
		takesEffect = Live
		kind = Taste
		min = 0
		max = 1
		whole = False
		default = 0.15
	}
	SETTING
	{
		name = flareSaturation
		member = DistantObject.Settings.Instance.DistantFlare.flareSaturation
		title = Flare colour
		tooltip = How much of its planet's colour a flare shows: 0 is white, 1 its full colour.
		kind = Taste
		min = 0
		max = 1
		whole = False
		default = 1
	}
	SETTING
	{
		name = textSize
		member = DistantObject.Settings.Instance.FlyOver.textSize
		title = Name size
		tooltip = How large the name shown on pointing at a flare is, before KSP's UI scale.
		takesEffect = Live
		min = 8
		max = 64
		whole = True
		default = 14
	}
	SETTING
	{
		name = fontName
		member = DistantObject.Settings.Instance.FlyOver.fontName
		title = Name font
		tooltip = The font of the name shown on pointing at a flare, among the fonts KSP has loaded.
		default = Arial
	}
	SETTING
	{
		name = renderVessels
		member = DistantObject.Settings.Instance.DistantVessel.renderVessels
		title = Draw distant vessels
		tooltip = Vessels beyond physics range but within reach are drawn as their full models.\nBy default the targeted one only; Ultra and Max, or Distant Object's own window, draw all of them, at a cost that grows with their number.
		takesEffect = Live
		kind = Quality
		row = Effects
		order = 70
		default = True
	}
	SETTING
	{
		name = renderMode
		member = DistantObject.Settings.Instance.DistantVessel.renderMode
		title = Distant vessels drawn
		tooltip = Target only draws just the vessel you target; All draws every vessel in range; All, kept also takes a vessel up for drawing the moment it leaves physics range.
		takesEffect = Live
		kind = Quality
		choices = RenderTargetOnly, RenderAll, RenderAllDontForget
		labels = Target only, All, All\, kept
		default = RenderTargetOnly
	}
	SETTING
	{
		name = maxDistance
		member = DistantObject.Settings.Instance.DistantVessel.maxDistance
		title = Distant vessel range
		tooltip = How far out distant vessels are drawn, in metres -- up to Distant Object's own limit of 750 km.
		takesEffect = Live
		kind = Quality
		min = 2500
		max = 750000
		whole = True
		default = 750000
	}
	SETTING
	{
		name = ignoreDebris
		member = DistantObject.Settings.Instance.DistantVessel.ignoreDebris
		title = Leave out debris
		tooltip = Debris is not drawn. It is usually most of what is in orbit.
		takesEffect = Live
		kind = Quality
		default = False
	}
	SETTING
	{
		name = changeSkybox
		member = DistantObject.Settings.Instance.SkyboxBrightness.changeSkybox
		title = Darken the sky near bright bodies
		tooltip = The stars fade while a bright planet or the sun is in view, as a camera's exposure would.
		takesEffect = Live
		kind = Taste
		default = True
	}
	SETTING
	{
		name = maxBrightness
		member = DistantObject.Settings.Instance.SkyboxBrightness.maxBrightness
		title = Sky brightness
		tooltip = How bright the stars in the sky are at most.
		takesEffect = Live
		kind = Taste
		min = 0
		max = 1
		whole = False
		default = 0.25
	}
	// As CommonUtils uses them: angular sizes are a body's apparent radius in
	// degrees; the angle is the one between the sun and the camera, seen from the
	// planet. Ranges as its own window's.
	SETTING
	{
		name = minimumSignificantBodySize
		member = DistantObject.Settings.Instance.SkyboxBrightness.minimumSignificantBodySize
		title = Sky darkening: smallest body
		tooltip = How large a planet or the sun must look, in degrees, to darken the sky at all.
		takesEffect = Live
		kind = Taste
		min = 1
		max = 180
		whole = False
		default = 1
	}
	SETTING
	{
		name = referenceBodySize
		member = DistantObject.Settings.Instance.SkyboxBrightness.referenceBodySize
		title = Sky darkening: size for full effect
		tooltip = How large a planet must look, in degrees, to darken the sky fully. A smaller one darkens it less.
		takesEffect = Live
		kind = Taste
		min = 1
		max = 100
		whole = False
		default = 60
	}
	SETTING
	{
		name = minimumTargetRelativeAngle
		member = DistantObject.Settings.Instance.SkyboxBrightness.minimumTargetRelativeAngle
		title = Sky darkening: lit side angle
		tooltip = The angle between the sun and you, seen from a planet, up to which it darkens the sky, in degrees.\nSeen fully lit it darkens it most; from further round its night side, not at all.
		takesEffect = Live
		kind = Taste
		min = 1
		max = 180
		whole = False
		default = 100
	}

	// For the reset, not shown: its debug and toolbar switches, which its Load reads
	// beside the groups.
	SETTING
	{
		name = debugMode
		member = DistantObject.Settings.Instance.debugMode
		takesEffect = Live
		default = False
	}
	SETTING
	{
		name = useToolbar
		member = DistantObject.Settings.Instance.useToolbar
		default = True
	}
	SETTING
	{
		name = useAppLauncher
		member = DistantObject.Settings.Instance.useAppLauncher
		default = True
	}
	SETTING
	{
		name = onlyInSpaceCenter
		member = DistantObject.Settings.Instance.onlyInSpaceCenter
		default = False
	}

	// What each graphics profile sets over the defaults: quality settings only. High
	// is the defaults; a block for it names only what High raises beyond them. No tier
	// switches the distant vessels off: by default Distant Object draws the targeted
	// one only (VesselDraw, renderMode 0).
	PROFILE
	{
		name = ultra
		renderMode = RenderAll
	}
	PROFILE
	{
		name = max
		renderMode = RenderAllDontForget
	}
}
