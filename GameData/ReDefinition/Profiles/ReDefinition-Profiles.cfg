// ReDefinition's graphics profiles: Low, Medium, High, Ultra, Max.
//
// A profile sets quality, never a mod's taste. It starts from the defaults of the
// installed builds; what it sets over them for a mod stands in that mod's
// registration, in PROFILE blocks (GameData/ReDefinition/Mods, or the mod's own
// folder). High is the defaults. What an installed mod requires counts over every
// profile. Here stand what the chooser shows, and the values of ReDefinition's own
// modules.
//
// No graphics card is named: which tier a card holds has not been measured. A tier
// says what it sets; the player tries one and takes the tier below it if the frame
// rate does not hold.
//
// A visual pack changes a mod's values for a profile in the mod's registration:
//   @MOD_SETTINGS[parallax]:NEEDS[ReDefinition] { @PROFILE[medium]:HAS[~build[]] { @densityMultiplier = 0.9 } }
// or adds a profile here and PROFILE blocks of its name to the mods it covers.

GRAPHICS_PROFILE
{
	name = low
	title = Low
	order = 1
	summary = Every visual mod on, at its lowest useful level.
	description = Every installed visual mod on, at its authors' lowest useful levels: Scatterer's "Very low" ocean, no cloud light shafts, clouds at x16, a quarter of the tessellation and half the scatter, no screen-space reflections, no plume lights.

	MODULE
	{
		name = upscaler
		enabled = True
		quality = NativeAA
	}
}

GRAPHICS_PROFILE
{
	name = medium
	title = Medium
	order = 2
	summary = Clouds, ocean and scatter a step below the mods' defaults.
	description = Scatterer's "Low" ocean without screen-space reflections, no cloud light shafts, clouds at x12, half the tessellation and three-quarter scatter; everything else at its authors' defaults.

	MODULE
	{
		name = upscaler
		enabled = True
		quality = NativeAA
	}
}

GRAPHICS_PROFILE
{
	name = high
	title = High
	order = 3
	summary = Every mod as its authors ship it.
	description = The default: every mod as its authors ship it -- with Volumetric Clouds, as its author ships it -- and KSP's own settings where its own defaults are lower than the mods ask for: full textures, high terrain detail and shaders, reflections at their minimum.

	MODULE
	{
		name = upscaler
		enabled = True
		quality = NativeAA
	}
}

GRAPHICS_PROFILE
{
	name = ultra
	title = Ultra
	order = 4
	summary = Scatterer's High preset, finer clouds, tessellation and scatter.
	description = Scatterer's "High" preset -- long-distance terrain shadows to 25 km, terrain light shafts with Volumetric Clouds -- clouds at x6, finer tessellation, denser and farther scatter, full-resolution screen-space reflections, distant vessels all drawn.

	MODULE
	{
		name = upscaler
		enabled = True
		quality = NativeAA
	}
}

GRAPHICS_PROFILE
{
	name = max
	title = Max
	order = 5
	summary = Scatterer's Very High preset and the finest detail everywhere.
	description = Scatterer's "Very High" preset -- terrain shadows to 50 km at 8192 -- clouds at x4, the finest tessellation, double scatter density, the most part-light shadow detail, distant vessels all drawn and kept.

	MODULE
	{
		name = upscaler
		enabled = True
		quality = NativeAA
	}
}
