// The snow cloud of a Seasons storm cell as a layer of EVE's volumetric clouds. EVE reads this file itself.
// The condition in the node name is ModuleManager's: with StockVolumetricClouds installed the node becomes EVE_CLOUDS, otherwise EVE
// does not read it. EVE drops the flat layers of a body once a raymarched layer of that body exists.
// The coverage map is a placeholder that Seasons replaces at run time. The layer does not move. It is a flat-topped grey-white
// blanket from 500 m to 2800 m above sea level.
// The phase functions, noise and scaled fade are the installed StockVolumetricClouds pack's values.
EVE_CLOUDS:NEEDS[StockVolumetricClouds]
{
	OBJECT
	{
		name = ReDefinition-Seasons-Storm
		body = Kerbin
		altitude = 500
		speed = 0,0,0
		detailSpeed = 0,0,0
		speedMode = LinearSurface
		layerRaymarchedVolumeV5
		{
			color = 168, 170, 174, 255
			upwardsCloudSpeed = 2
			scaledFadeStartAltitude = 200000
			scaledFadeEndAltitude = 260000
			skylightMultiplier = 1.0
			skylightTintMultiplier = 0.5
			raymarchingSettings
			{
				lightMarchSteps = 4
				lightMarchDistance = 1900
				baseStepSize = 120
				adaptiveStepSizeFactor = 0.006
				maxStepSize = 1200
				overlapRenderOrder = 3
			}
			noise
			{
				erosionDepth = 0.65
				worley
				{
					spherical = 1
					persistence = 0.57
				}
			}
			coverageMap
			{
				value = ReDefinition/Seasons/Clouds/StormCoverage
				type = AlphaMap
				alphaMask = ALPHAMAP_R
			}
			cloudTypes
			{
				Item
				{
					typeName = SnowCloud
					minAltitude = 500
					maxAltitude = 2300
					interpolateCloudHeights = true
					density = 0.007
					baseNoiseTiling = 2600
					noiseEdgeHardness = 0.85
					multipleScatteringBrightness = 1.0
					particleFieldDensity = 0
					dropletsDensity = 0
					wetSurfacesIntensity = 0
					lightningFrequency = 0
					ambientVolume = 0
					coverageCurve
					{
						key = 0 0 0 5
						key = 0.12 0.85 0 0
						key = 0.5 0.95 0 0
						key = 0.82 0.35 -3 -3
						key = 0.95 0 0 0
					}
					densityCurve
					{
						key = 0 1
					}
				}
			}
			lightVolumeSettings
			{
				useLightVolume = False
			}
			phaseFunctions
			{
				singleScattering1 = 0.95, 0.01
				singleScattering2 = 0.8, 0.05
				multipleScattering1 = 0.2, 1.5
				multipleScattering2 = -0.4, 0.2
			}
		}
		settings
		{
			_FlowMap
			{
			}
		}
	}
}
