// The snow cloud of a Seasons storm cell as layers of EVE's volumetric clouds. EVE reads this file itself.
// With StockVolumetricClouds installed ModuleManager makes the node EVE_CLOUDS, otherwise EVE does not read it.
// Storm is the cloud: a volume from 500 m to 2300 m above sea level, and a layer2D for the orbit and map view.
// The OBJECT's altitude is only the radius of the 2D sphere above the body.
// Snow is EVE's snow field and sound from the ground up.
// The maps and the 2D picture are placeholders that Seasons replaces at run time.
// The cloud's optics are the StockVolumetricClouds pack's.
EVE_CLOUDS:NEEDS[StockVolumetricClouds]
{
	OBJECT
	{
		name = ReDefinition-Seasons-Storm
		body = Kerbin
		altitude = 2700
		speed = 0,0,0
		detailSpeed = 0,0,0
		speedMode = LinearSurface
		layer2D
		{
			macroCloudMaterial
			{
				_DetailDist = 2E-06
			}
		}
		layerRaymarchedVolumeV5
		{
			color = 168, 170, 174, 255
			upwardsCloudSpeed = 2
			scaledFadeStartAltitude = 200000
			scaledFadeEndAltitude = 260000
			skylightMultiplier = 1.0
			skylightTintMultiplier = 0.5
			raymarchingSettings
			{
				lightMarchSteps = 4
				lightMarchDistance = 1900
				baseStepSize = 120
				adaptiveStepSizeFactor = 0.006
				maxStepSize = 1200
				overlapRenderOrder = 3
			}
			noise
			{
				erosionDepth = 0.65
				worley
				{
					spherical = 1
					persistence = 0.57
				}
			}
			coverageMap
			{
				value = ReDefinition/Seasons/Clouds/StormCoverage
				type = AlphaMap
				alphaMask = ALPHAMAP_R
			}
			cloudTypes
			{
				Item
				{
					typeName = SnowCloud
					minAltitude = 500
					maxAltitude = 2300
					interpolateCloudHeights = true
					density = 0.007
					baseNoiseTiling = 2600
					noiseEdgeHardness = 0.85
					multipleScatteringBrightness = 1.0
					particleFieldDensity = 0
					dropletsDensity = 0
					wetSurfacesIntensity = 0
					lightningFrequency = 0
					ambientVolume = 0
					coverageCurve
					{
						key = 0 0 0 5
						key = 0.12 0.85 0 0
						key = 0.5 0.95 0 0
						key = 0.82 0.35 -3 -3
						key = 0.95 0 0 0
					}
					densityCurve
					{
						key = 0 1
					}
				}
			}
			lightVolumeSettings
			{
				useLightVolume = False
			}
			phaseFunctions
			{
				singleScattering1 = 0.95, 0.01
				singleScattering2 = 0.8, 0.05
				multipleScattering1 = 0.2, 1.5
				multipleScattering2 = -0.4, 0.2
			}
		}
		settings
		{
			_Color = 255,255,255,255
			_Lambertian = 0.75
			_UVNoiseStrength = 0
			_MainTex
			{
				value = ReDefinition/Seasons/Clouds/StormSwirl
				isClamped = True
			}
			_FlowMap
			{
			}
		}
	}
	OBJECT
	{
		name = ReDefinition-Seasons-Snow
		body = Kerbin
		altitude = 2700
		speed = 0,0,0
		detailSpeed = 0,0,0
		speedMode = LinearSurface
		layerRaymarchedVolumeV5
		{
			scaledFadeStartAltitude = 200000
			scaledFadeEndAltitude = 260000
			coverageMap
			{
				value = ReDefinition/Seasons/Clouds/StormCoverage
				type = AlphaMap
				alphaMask = ALPHAMAP_R
			}
			raymarchingSettings
			{
				adaptiveStepSizeFactor = 0
				baseStepSize = 90000000
				maxStepSize = 90000000
				lightMarchDistance = 0
				lightMarchSteps = 0
				fxOnlyLayer = True
			}
			cloudTypes
			{
				Item
				{
					typeName = SeasonsSnow
					minAltitude = -1
					maxAltitude = 2300
					interpolateCloudHeights = false
					baseNoiseTiling = 0
					density = 0.0
					lightningFrequency = 0.0
					particleFieldDensity = 1
					ambientVolume = 1
					coverageCurve
					{
						key = 0 1
					}
					densityCurve
					{
					}
				}
			}
			particleField
			{
				particleFieldConfig = ReDefinition-Seasons-snow
			}
			ambientSound
			{
				soundName = StockVolumetricClouds/Clouds/Sounds/SnowStormLoopedFreeAudio
			}
			noise
			{
			}
			lightVolumeSettings
			{
				useLightVolume = False
			}
			phaseFunctions
			{
			}
		}
		settings
		{
			_FlowMap
			{
			}
		}
	}
}

// The snow of a storm cell: the stock snow-Kerbin field with more and larger flakes, falling faster, and full from a coverage of 0.5.
// A cell paints its coverage at up to 1, so the flakes thicken from the rim to the middle.
EVE_PARTICLE_FIELD_CONFIG:NEEDS[StockVolumetricClouds]
{
	OBJECT
	{
		name = ReDefinition-Seasons-snow
		randomDirectionStrength = 2
		fieldParticleCount = 600000
		fieldSize = 100
		tangentialSpeed = 0
		color = 255, 255, 255, 140
		minCoverageThreshold = 0.05
		maxCoverageThreshold = 0.5
		fallSpeed = 1.1
		particleSize = 0.07
		particleSheetCount = 12,12
		particleTexture
		{
			value = StockVolumetricClouds/Clouds/Textures/PluginData/SnowFlakesSheet
		}
	}
}
