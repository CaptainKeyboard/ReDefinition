// The snow cloud of a Seasons storm cell as a layer of EVE's volumetric clouds. EVE reads this file itself.
// Without raymarched layers it is ignored. The coverage map is a placeholder that Seasons replaces at run time.
// The layer does not move (speed 0). It is a flat-topped grey-white blanket from 500 m to 2300 m above sea level.
// The phase functions, the worley noise and the scaled fade are the values of the installed StockVolumetricClouds pack.
EVE_CLOUDS
{
	OBJECT
	{
		name = ReDefinition-Seasons-Storm
		body = Kerbin
		altitude = 500
		speed = 0,0,0
		detailSpeed = 0,0,0
		speedMode = LinearSurface
		layerRaymarchedVolumeV5
		{
			color = 175, 183, 196, 255
			upwardsCloudSpeed = 2
			scaledFadeStartAltitude = 200000
			scaledFadeEndAltitude = 260000
			skylightMultiplier = 1.0
			skylightTintMultiplier = 0.5
			raymarchingSettings
			{
				lightMarchSteps = 3
				lightMarchDistance = 900
				baseStepSize = 200
				adaptiveStepSizeFactor = 0.006
				maxStepSize = 2500
				overlapRenderOrder = 3
			}
			noise
			{
				erosionDepth = 0.45
				worley
				{
					spherical = 1
					persistence = 0.57
				}
			}
			coverageMap
			{
				value = ReDefinition/Seasons/Clouds/StormCoverage
				type = AlphaMap
				alphaMask = ALPHAMAP_R
			}
			cloudTypes
			{
				Item
				{
					typeName = SnowCloud
					minAltitude = 500
					maxAltitude = 2800
					interpolateCloudHeights = true
					density = 0.004
					baseNoiseTiling = 6000
					noiseEdgeHardness = 0.3
					multipleScatteringBrightness = 1.0
					particleFieldDensity = 0
					dropletsDensity = 0
					wetSurfacesIntensity = 0
					lightningFrequency = 0
					ambientVolume = 0
					coverageCurve
					{
						key = 0 0 0 5
						key = 0.12 1 0 0
						key = 0.55 1 0 0
						key = 0.82 0 -3 0
					}
					densityCurve
					{
						key = 0 1
					}
				}
			}
			lightVolumeSettings
			{
				useLightVolume = False
			}
			phaseFunctions
			{
				singleScattering1 = 0.95, 0.01
				singleScattering2 = 0.8, 0.05
				multipleScattering1 = 0.2, 1.5
				multipleScattering2 = -0.4, 0.2
			}
		}
		settings
		{
			_FlowMap
			{
			}
		}
	}
}
